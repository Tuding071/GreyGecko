              try {
                  val arr = JSONArray(browserPrefs().getString(key, "[]") ?: "[]")
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      out.add(PageEntry(o.optString("u"), o.optString("t"), o.optLong("d")))
                  }
              } catch (e: Exception) {
              }
              return out
          }

          private fun writeEntries(key: String, list: List<PageEntry>) {
              val arr = JSONArray()
              for (e in list) {
                  val o = JSONObject()
                  o.put("u", e.url)
                  o.put("t", e.title)
                  o.put("d", e.time)
                  arr.put(o)
              }
              browserPrefs().edit().putString(key, arr.toString()).apply()
          }

          object HistoryStore {
              @Synchronized
              fun load(): List<PageEntry> = readEntries("history")

              @Synchronized
              fun add(url: String, title: String) {
                  if (url.isBlank() || url.startsWith("about:")) return
                  val l = readEntries("history")
                  if (l.isNotEmpty() && l[0].url == url) l.removeAt(0)
                  l.add(0, PageEntry(url, title, System.currentTimeMillis()))
                  while (l.size > 1000) l.removeAt(l.size - 1)
                  writeEntries("history", l)
              }

              @Synchronized
              fun setTitle(url: String, title: String) {
                  if (url.isBlank() || title.isBlank()) return
                  val l = readEntries("history")
                  val i = l.indexOfFirst { it.url == url }
                  if (i >= 0) {
                      l[i] = PageEntry(url, title, l[i].time)
                      writeEntries("history", l)
                  }
              }

              @Synchronized
              fun clear() {
                  writeEntries("history", emptyList())
              }
          }

          object BookmarkStore {
              var rev by mutableStateOf(0)
              val closing = mutableStateListOf<String>()
              private val jobs = HashMap<String, Runnable>()
              private val main = Handler(Looper.getMainLooper())

              fun requestRemove(url: String) {
                  if (closing.contains(url)) return
                  closing.add(url)
                  val r = Runnable {
                      jobs.remove(url)
                      closing.remove(url)
                      remove(url)
                  }
                  jobs[url] = r
                  main.postDelayed(r, 2000L)
              }

              fun undoRemove(url: String) {
                  val r = jobs.remove(url)
                  if (r != null) main.removeCallbacks(r)
                  closing.remove(url)
              }
              @Synchronized
              fun load(): List<PageEntry> = readEntries("bookmarks")

              @Synchronized
              fun add(url: String, title: String) {
                  if (url.isBlank()) return
                  val l = readEntries("bookmarks")
                  l.removeAll { it.url == url }
                  l.add(0, PageEntry(url, title, System.currentTimeMillis()))
                  writeEntries("bookmarks", l)
                  rev++
              }

              @Synchronized
              fun remove(url: String) {
                  val l = readEntries("bookmarks")
                  l.removeAll { it.url == url }
                  writeEntries("bookmarks", l)
                  rev++
              }
          }
