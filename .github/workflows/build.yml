                  val dir = java.io.File(Gecko.appCtx.filesDir, "thumbs")
                  dir.mkdirs()
                  return java.io.File(dir, "t" + id + ".jpg")
              }

              fun moveGroupBy(key: String, delta: Int) {
                  val groups = groupTabs(tabs.filter { !it.preview })
                  val i = groups.indexOfFirst { it.key == key }
                  val j = i + delta
                  if (i < 0 || j < 0 || j >= groups.size) return
                  val order = groups.toMutableList()
                  val g = order.removeAt(i)
                  order.add(j, g)
                  val next = ArrayList<BrowserTab>()
                  for (x in order) next.addAll(x.tabs)
                  next.addAll(tabs.filter { it.preview })
                  if (next.size != tabs.size) return
                  for (k in next.indices) {
                      if (tabs[k] !== next[k]) tabs[k] = next[k]
                  }
                  persist()
              }

              fun persist() {
                  if (closing) return
                  main.removeCallbacks(saveRunnable)
                  main.postDelayed(saveRunnable, 700L)
              }

              fun saveNow() {
                  if (closing) return
                  try {
                      val arr = JSONArray()
                      for (t in tabs) {
                      if (t.preview) continue
                      val o = JSONObject()
                      o.put("id", t.id)
                          o.put("u", t.url)
                          o.put("t", t.title)
                          o.put("o", t.openerId)
                          arr.put(o)
                      }
                      val root = JSONObject()
                      val curTab = current
                      root.put("cur", if (curTab == null) 0 else if (curTab.preview) curTab.openerId else curTab.id)
                      root.put("next", counter)
                      root.put("list", arr)
                      Gecko.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)
                          .edit().putString("tabs", root.toString()).apply()
                  } catch (e: Exception) {
                      Log.d("GreyScript", "save tabs failed: " + e)
                  }
              }

              fun restore(): Boolean {
                  try {
                      val raw = Gecko.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)
                          .getString("tabs", null) ?: return false
                      val root = JSONObject(raw)
                      val arr = root.getJSONArray("list")
                      if (arr.length() == 0) return false
                      var maxId = root.optInt("next", 0)
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val id = o.getInt("id")
                          val t = BrowserTab(id, null, o.optInt("o", 0))
                          t.url = o.optString("u")
                          t.title = o.optString("t")
                          val f = thumbFile(id)
                          if (f.exists()) {
                              val bmp = BitmapFactory.decodeFile(f.path)
                              if (bmp != null) t.thumb = bmp.asImageBitmap()
                          }
                          if (id > maxId) maxId = id
                          tabs.add(t)
                      }
                      counter = maxId
                      val curId = root.optInt("cur", 0)
                      val c = tabs.firstOrNull { it.id == curId } ?: tabs.last()
                      current = c
                      c.lastUsed = System.currentTimeMillis()
                      val seenKeys = HashSet<String>()
                      for (x in listOf(c) + tabs.filter { it !== c }) {
                          if (x.url.isBlank() || x.url.startsWith("about:")) continue
                          if (!seenKeys.add(normUrl(x.url))) removeTab(x, false)
                      }
                      return true
                  } catch (e: Exception) {
                      Log.d("GreyScript", "restore failed: " + e)
                      tabs.clear()
                      current = null
                      return false
                  }
              }

              fun newTab(url: String, makeCurrent: Boolean = true, openerId: Int = 0): BrowserTab {
                  var opener = openerId
                  if (url.isNotBlank() && !url.startsWith("about:")) {
                      val key = normUrl(url)
                      val dups = tabs.filter { !it.preview && it.url.isNotBlank() && normUrl(it.url) == key }
                      val cd = dups.firstOrNull { it === current }
                      if (!makeCurrent && cd != null) return cd
                      for (d in dups) {
                          if (d.id == opener) opener = d.openerId
                          if (d === current) current = null
                          removeTab(d, false)
                      }
                  }
                  if (makeCurrent) home = false
                  counter += 1
                  val t = BrowserTab(counter, null, opener)
                  t.url = url
                  tabs.add(t)
                  ensureLive(t, url)
                  if (makeCurrent || current == null) select(t)
                  enforceLimit()
                  persist()
                  return t
              }

              private fun dedupe(t: BrowserTab) {
              if (t.preview) return
                  if (t.url.isBlank() || t.url.startsWith("about:")) return
                  if (!tabs.contains(t)) return
                  val key = normUrl(t.url)
                  val dups = tabs.filter { it !== t && !it.preview && it.url.isNotBlank() && normUrl(it.url) == key }
                  if (dups.isEmpty()) return
                  if (t !== current && dups.any { it === current }) {
                      removeTab(t, false)
                      return
                  }
                  for (d in dups) {
                      if (t.openerId == d.id) t.openerId = d.openerId
                      removeTab(d, false)
                  }
              }

              private fun ensureLive(t: BrowserTab, initialUrl: String? = null) {
              val old = t.session
              if (old != null) {
                  if (old.isOpen) return
                  t.session = null
              }
                  val s = GeckoSession()
                  t.session = s
                  attach(t, s)
                  s.open(runtime)
                  val st = t.savedState
                  if (initialUrl != null) {
                      s.loadUri(initialUrl)
                  } else if (st != null) {
                      s.restoreState(st)
                  } else if (t.url.isNotBlank() && t.url != "about:blank") {
                      s.loadUri(t.url)
                  }
              }

              fun showJs(r: JsReq) {
                  val old = js
                  if (old != null) {
                      try {
                          old.result.complete(old.cancel())
                      } catch (e: Exception) {
                      }
                  }
                  js = r
              }

              fun exitFullscreen() {
                  val ft = tabs.firstOrNull { it.id == fullscreenTab }
                  try {
                      ft?.session?.exitFullScreen()
                  } catch (e: Exception) {
                  }
                  fullscreen = false
                  fullscreenTab = 0
              }

              fun reloadTab(t: BrowserTab) {
                  val eu = t.errorUrl
                  if (eu != null) t.session?.loadUri(eu) else t.session?.reload()
              }

              fun select(t: BrowserTab) {
                  if (fullscreen && fullscreenTab != t.id) exitFullscreen()
                  val prev = current
                  Log.d("GreyScript", "select tab " + t.id + " " + t.url + " session=" + System.identityHashCode(t.session))
                  if (prev != null && prev !== t) prev.lastUsed = System.currentTimeMillis()
                  ensureLive(t)
                  t.lastUsed = System.currentTimeMillis()
                  current = t
                  if (prev != null && prev !== t && prev.preview) removeTab(prev, false)
                  enforceLimit()
                  persist()
              }

              fun load(t: BrowserTab, url: String) {
              home = false
              ensureLive(t)
                  t.session?.loadUri(url)
              }

              fun openerOf(t: BrowserTab): BrowserTab? =
                  if (t.openerId == 0) null else tabs.firstOrNull { it.id == t.openerId }

              fun closeToOpener(t: BrowserTab) {
                  val op = openerOf(t)
                  if (op != null) select(op)
                  close(t)
              }

              fun close(t: BrowserTab) {
                  removeTab(t, true)
              }

              private fun removeTab(t: BrowserTab, keepOne: Boolean) {
                  val i = tabs.indexOf(t)
                  if (i < 0) return
                  tabs.removeAt(i)
                  val s = t.session
                  t.session = null
                  try {
                      thumbFile(t.id).delete()
                  } catch (e: Exception) {
                  }
                  if (tabs.isEmpty()) {
                      current = null
                      if (keepOne) home = true
                  } else if (current === t) {
                      select(tabs[minOf(i, tabs.size - 1)])
                  }
                  if (s != null) main.postDelayed({ s.close() }, 400)
                  persist()
              }

              fun closeAll() {
                  closing = true
                  main.removeCallbacks(saveRunnable)
                  main.removeCallbacks(idleTick)
                  for (t in tabs.toList()) {
                      t.session?.close()
                      t.session = null
                  }
                  tabs.clear()
                  current = null
              }

              fun requestClose(t: BrowserTab) {
                  if (closingIds.contains(t.id)) return
                  closingIds.add(t.id)
                  val r = Runnable {
                      closeJobs.remove(t.id)
                      closingIds.remove(t.id)
                      close(t)
                  }
                  closeJobs[t.id] = r
                  main.postDelayed(r, 2000L)
              }

              fun undoClose(t: BrowserTab) {
                  val r = closeJobs.remove(t.id)
                  if (r != null) main.removeCallbacks(r)
                  closingIds.remove(t.id)
              }

              private fun recover(t: BrowserTab, dead: GeckoSession) {
                  if (t.session !== dead) return
                  Log.d("GreyScript", "session died for tab " + t.id + " " + t.url)
                  if (fullscreenTab == t.id) {
                      fullscreen = false
                      fullscreenTab = 0
                  }
                  t.session = null
                  t.loading = false
                  t.progress = 0
                  t.extId = -1
                  val now = System.currentTimeMillis()
                  if (now - t.lastRecover < 5000L) t.savedState = null
                  t.lastRecover = now
                  if (t === current && !home && t.url.isNotBlank() && t.url != "about:blank") ensureLive(t)
              }

              fun refreshView() {
                  val c = current
                  if (c == null || c.session == null) return
                  main.postDelayed({
                      ensureLive(c)
                      val v = view
                      val s = c.session
                      if (v != null && s != null) {
                          v.releaseSession()
                          v.setSession(s)
                      }
                  }, 200L)
              }

              fun openPreview(url: String, openerId: Int): BrowserTab {
                  var op = openerId
                  val c = current
                  if (c != null && c.preview) op = c.openerId
                  counter += 1
                  val t = BrowserTab(counter, null, op)
                  t.preview = true
                  t.url = url
                  tabs.add(t)
                  ensureLive(t, url)
                  home = false
                  select(t)
                  return t
              }

              fun keep(t: BrowserTab) {
                  t.preview = false
                  dedupe(t)
                  persist()
              }

              fun closePreviewTab(t: BrowserTab) {
                  if (openerOf(t) != null) closeToOpener(t) else close(t)
              }

              fun cycleMaxBg() {
                  val opts = listOf(2, 4, 6, 8, 10)
                  val i = opts.indexOf(maxBg)
                  maxBg = opts[(i + 1) % opts.size]
                  Gecko.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)
                      .edit().putInt("maxbg", maxBg).apply()
                  enforceLimit()
              }

              private fun discard(t: BrowserTab) {
                  if (t === current) return
                  val s = t.session ?: return
                  t.session = null
                  t.extId = -1
                  t.loading = false
                  t.progress = 0
                  main.postDelayed({ s.close() }, 150)
              }

              private fun enforceLimit() {
                  val cur = current
                  val bg = tabs.filter { it !== cur && it.session != null }.sortedBy { it.lastUsed }
                  var extra = bg.size - maxBg
                  for (b in bg) {
                      if (extra <= 0) break
                      if (!b.loading) {
                          discard(b)
                          extra--
                      }
                  }
              }

              private fun discardIdle() {
                  val now = System.currentTimeMillis()
                  for (t in tabs.toList()) {
                      if (t !== current && t.session != null && !t.loading && now - t.lastUsed > 1200000L) {
                          discard(t)
                      }
                  }
              }

              fun trim(level: Int) {
                  val keep = if (level >= 40) 1 else if (level >= 15) 2 else return
                  val cur = current
                  val bg = tabs.filter { it !== cur && it.session != null }.sortedByDescending { it.lastUsed }
                  for (i in bg.indices) {
                      if (i >= keep) discard(bg[i])
                  }
              }

              fun capture(t: BrowserTab) {
                  val v = view ?: return
                  if (home || t.session == null) return
                  if (current !== t) return
                  if (v.session !== t.session) return
                  try {
                      v.capturePixels().accept(
                          { bmp ->
                              try {
                                  if (bmp != null && bmp.width > 0 && bmp.height > 0) {
                                      val side = minOf(bmp.width, bmp.height)
                                      val sq = Bitmap.createBitmap(bmp, 0, 0, side, side)
                                      val sc = Bitmap.createScaledBitmap(sq, 240, 240, true)
                                      t.thumb = sc.asImageBitmap()
                                      val f = thumbFile(t.id)
                                      Thread {
                                          try {
                                              java.io.FileOutputStream(f).use { out ->
                                                  sc.compress(Bitmap.CompressFormat.JPEG, 75, out)
                                              }
                                          } catch (e: Exception) {
                                          }
                                      }.start()
                                  }
                              } catch (e: Exception) {
                                  Log.d("GreyScript", "thumb failed: " + e)
                              }
                          },
                          { e -> Log.d("GreyScript", "capture failed: " + e) }
                      )
                  } catch (e: Exception) {
                      Log.d("GreyScript", "capture threw: " + e)
                  }
              }

              private fun attach(t: BrowserTab, s: GeckoSession) {
                  s.navigationDelegate = object : GeckoSession.NavigationDelegate {
