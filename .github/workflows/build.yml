          package com.grey.gecko

          const val NEW_TEMPLATE = """// ==UserScript==
          // @name         New script
          // @namespace    greygecko
          // @version      1.0
          // @description  What this script does
          // @match        *://*.example.com/*
          // @run-at       document-idle
          // @grant        GM_addStyle
          // ==/UserScript==

          (function () {
            'use strict';

            GM_addStyle('body { outline: 4px solid red; }');
            GM_log('Script ran on ' + location.href);
          })();
