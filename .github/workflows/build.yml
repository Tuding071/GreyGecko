                      val n = ins.read(buf, 0, chunkSize())
                      if (n < 0) break
                      bos.write(buf, 0, n)
                      if (d != null) {
                          d.addBytes(n)
                          throttle(d, n)
                          tickSpeed(d)
                      }
                  }
                  return bos.toByteArray()
              }

