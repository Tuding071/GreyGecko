          @Composable
          fun UrlBar(
              tab: BrowserTab?,
              editing: Boolean,
              text: TextFieldValue,
              onText: (TextFieldValue) -> Unit,
              onStart: () -> Unit,
              onFocusLost: () -> Unit,
              onSubmit: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              val shape = RoundedCornerShape(8.dp)
              val url = shownUrl(tab)
              val loading = tab?.loading ?: false
              val fill by animateFloatAsState(targetValue = (tab?.progress ?: 0) / 100f, label = "urlProgress")
              val focus = remember { FocusRequester() }
              var hadFocus by remember { mutableStateOf(false) }

              LaunchedEffect(editing) {
                  if (editing) {
                      hadFocus = false
                      focus.requestFocus()
                  }
              }

              Box(
                  modifier
                      .height(40.dp)
                      .clip(shape)
                      .background(Field)
                      .border(0.5.dp, Color(0xFF555555), shape)
              ) {
                  if (editing) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.CenterStart) {
                          BasicTextField(
                              value = text,
                              onValueChange = onText,
                              singleLine = true,
                              textStyle = TextStyle(color = Color.White, fontSize = 14.sp),
                              cursorBrush = SolidColor(Color.White),
                              keyboardOptions = KeyboardOptions(
                                  keyboardType = KeyboardType.Uri,
                                  imeAction = ImeAction.Go
                              ),
                              keyboardActions = KeyboardActions(onGo = { onSubmit() }),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 10.dp)
                                  .focusRequester(focus)
                                  .onFocusChanged { st ->
                                      if (st.isFocused) {
                                          hadFocus = true
                                      } else if (hadFocus) {
                                          onFocusLost()
                                      }
                                  }
                          )
                      }
                  } else {
                      BoxWithConstraints(Modifier.fillMaxSize().clickable { onStart() }) {
                          val w = maxWidth
                          val label = if (url.isEmpty()) "Search or enter address" else url
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.CenterStart) {
                              UrlLabel(label, if (url.isEmpty()) Soft else Color.White)
                          }
                          if (loading) {
                              Box(
                                  Modifier
                                      .fillMaxHeight()
                                      .width(w * fill)
                                      .clipToBounds()
                                      .background(Color.White)
                              ) {
                                  Box(
                                      Modifier
                                          .wrapContentWidth(Alignment.Start, unbounded = true)
                                          .width(w)
                                          .fillMaxHeight(),
                                      contentAlignment = Alignment.CenterStart
                                  ) {
                                      UrlLabel(label, if (url.isEmpty()) Color(0xFF666666) else Color(0xFF2B2B2B))
                                  }
                              }
                          }
                      }
                  }
              }
          }

          class TabGroup(val key: String, val label: String, val tabs: List<BrowserTab>)

          fun groupKeyOf(t: BrowserTab?): String {
              val u = t?.url ?: ""
              if (u.isBlank() || u.startsWith("about:")) return "newtab"
              val h = try { android.net.Uri.parse(u).host ?: "" } catch (e: Exception) { "" }
              val d = h.removePrefix("www.")
              return if (d.isBlank()) "other" else d
          }

          fun groupTabs(all: List<BrowserTab>): List<TabGroup> {
              val order = ArrayList<String>()
              val map = HashMap<String, MutableList<BrowserTab>>()
              for (t in all) {
                  val k = groupKeyOf(t)
                  val l = map.getOrPut(k) {
                      order.add(k)
                      mutableListOf()
                  }
                  l.add(t)
              }
              return order.map { k ->
                  TabGroup(k, if (k == "newtab") "New tab" else k, map[k] ?: mutableListOf())
              }
          }

          fun groupColor(key: String): Color =
              GroupPalette[(key.hashCode() and 0x7fffffff) % GroupPalette.size]

          fun groupLetter(key: String): String =
              if (key == "newtab") "+" else key.take(1).uppercase()

