          package com.grey.gecko

          const val NEW_TEMPLATE = """// ==UserScript==
          // @name         New script
          // @namespace    greygecko
          // @version      1.0
          // @description  What this script does
          // @match        *://*.example.com/*
          // @run-at       document-idle
          // @grant        GM_addStyle
          // ==/UserScript==

