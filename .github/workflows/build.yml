              fun get(key: String): ImageBitmap? = map[key]

              fun request(key: String) {
                  if (key.isBlank() || key == "newtab" || key == "other") return
                  synchronized(requested) {
                      val ft = failed[key]
                      if (ft != null && System.currentTimeMillis() - ft < 600000L) return
                      if (!requested.add(key)) return
                  }
                  Thread {
                      var bmp = readDisk(key)
                      if (bmp == null) {
                          bmp = download("https://" + key + "/favicon.ico")
                          if (bmp == null || bmp.width < 16) {
                              bmp = download("https://www.google.com/s2/favicons?sz=64&domain=" + key)
                          }
                          if (bmp != null) writeDisk(key, bmp)
                      }
                      val b = bmp
                      if (b != null) {
                          val ib = b.asImageBitmap()
                          main.post { map[key] = ib }
                      } else {
                          synchronized(requested) {
                              requested.remove(key)
                              failed[key] = System.currentTimeMillis()
                          }
                      }
                  }.start()
              }

