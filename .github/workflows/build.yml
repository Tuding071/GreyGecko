          cat > app/src/main/java/com/grey/gecko/Dash.kt <<'EOF'
          package com.grey.gecko

          import org.w3c.dom.Element
          import org.xml.sax.InputSource
          import java.io.StringReader
          import javax.xml.parsers.DocumentBuilderFactory

          class DashRep(
              val id: String,
              val kind: String,
              val bw: Long,
              val w: Int,
              val h: Int,
              val codecs: String,
              val ext: String,
              val single: String?,
              val plan: SegPlan?
          )

          fun isDash(url: String, ctype: String): Boolean {
              val p = url.substringBefore('#').substringBefore('?')
              return p.endsWith(".mpd", true) || ctype.contains("dash+xml", true)
          }

          private fun childEls(e: Element, name: String): List<Element> {
              val out = ArrayList<Element>()
              val nl = e.childNodes
              for (i in 0 until nl.length) {
                  val n = nl.item(i)
                  if (n is Element && (n.localName ?: n.nodeName).substringAfter(':') == name) out.add(n)
              }
              return out
          }

          private fun attr(e: Element, name: String): String = if (e.hasAttribute(name)) e.getAttribute(name) else ""

          private fun baseOf(e: Element, parent: String): String {
              val b = childEls(e, "BaseURL").firstOrNull()?.textContent?.trim() ?: ""
              return if (b.isEmpty()) parent else resolveUrl(parent, b)
          }

          private fun isoSeconds(s: String): Double {
              val m = Regex("^P(?:(\\d+)D)?T?(?:(\\d+)H)?(?:(\\d+)M)?(?:([\\d.]+)S)?$").find(s.trim()) ?: return 0.0
              val d = m.groupValues[1].toDoubleOrNull() ?: 0.0
              val h = m.groupValues[2].toDoubleOrNull() ?: 0.0
              val mi = m.groupValues[3].toDoubleOrNull() ?: 0.0
              val sec = m.groupValues[4].toDoubleOrNull() ?: 0.0
              return d * 86400.0 + h * 3600.0 + mi * 60.0 + sec
          }

          private fun fillTemplate(t: String, id: String, bw: Long, number: Long, time: Long): String {
              var out = Regex("\\\$Number(%0(\\d+)d)?\\\$").replace(t) { m ->
                  number.toString().padStart(m.groupValues[2].toIntOrNull() ?: 0, '0')
              }
              out = Regex("\\\$Time(%0(\\d+)d)?\\\$").replace(out) { m ->
                  time.toString().padStart(m.groupValues[2].toIntOrNull() ?: 0, '0')
              }
              return out.replace("\$RepresentationID\$", id).replace("\$Bandwidth\$", bw.toString()).replace("\$\$", "\$")
          }

          private fun extFor(kind: String, mime: String): String {
              val m = mime.lowercase()
              return if (kind == "audio") {
                  if (m.contains("webm")) "weba" else "m4a"
              } else {
                  if (m.contains("webm")) "webm" else "mp4"
              }
          }

          private fun planFromTemplate(tpl: Element, id: String, bw: Long, base: String, perDur: Double, ext: String): SegPlan? {
              val timescale = attr(tpl, "timescale").toLongOrNull() ?: 1L
              val start = attr(tpl, "startNumber").toLongOrNull() ?: 1L
              val initT = attr(tpl, "initialization")
              val media = attr(tpl, "media")
              if (media.isEmpty()) return null
              val initUrl = if (initT.isEmpty()) null else resolveUrl(base, fillTemplate(initT, id, bw, 0L, 0L))
              val segs = ArrayList<HlsSeg>()
              val tl = childEls(tpl, "SegmentTimeline").firstOrNull()
              if (tl != null) {
                  var time = 0L
                  var num = start
                  for (s in childEls(tl, "S")) {
                      val t = attr(s, "t")
                      if (t.isNotEmpty()) time = t.toLongOrNull() ?: time
                      val dd = attr(s, "d").toLongOrNull() ?: continue
                      if (dd <= 0L) continue
                      val r = attr(s, "r").toIntOrNull() ?: 0
                      val count = if (r >= 0) r + 1 else {
                          val remaining = perDur * timescale - time
                          if (remaining <= 0.0) 1 else Math.ceil(remaining / dd).toInt()
                      }
                      for (k in 0 until count) {
                          segs.add(HlsSeg(resolveUrl(base, fillTemplate(media, id, bw, num, time)), null, null, 0L))
                          time += dd
                          num++
                          if (segs.size > 20000) return null
                      }
                  }
              } else {
                  val dur = attr(tpl, "duration").toLongOrNull() ?: return null
                  if (dur <= 0L || perDur <= 0.0) return null
                  val n = Math.ceil(perDur * timescale / dur).toLong()
                  if (n <= 0L || n > 20000L) return null
                  for (i in 0 until n) {
                      segs.add(HlsSeg(resolveUrl(base, fillTemplate(media, id, bw, start + i, i * dur)), null, null, 0L))
                  }
              }
              if (segs.isEmpty()) return null
              return SegPlan(initUrl, segs, ext)
          }

          private fun planFromList(sl: Element, base: String, ext: String): SegPlan? {
              val segs = ArrayList<HlsSeg>()
              for (su in childEls(sl, "SegmentURL")) {
                  val m = attr(su, "media")
                  if (m.isEmpty() || attr(su, "mediaRange").isNotEmpty()) return null
                  segs.add(HlsSeg(resolveUrl(base, m), null, null, 0L))
              }
              if (segs.isEmpty()) return null
              val ini = childEls(sl, "Initialization").firstOrNull()
              val initSrc = if (ini == null) "" else attr(ini, "sourceURL")
              val initUrl = if (initSrc.isEmpty()) null else resolveUrl(base, initSrc)
              return SegPlan(initUrl, segs, ext)
          }

          fun parseMpd(mpdUrl: String, xml: String): List<DashRep> {
              val out = ArrayList<DashRep>()
              val doc = DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(InputSource(StringReader(xml)))
              val root = doc.documentElement
              val mpdBase = baseOf(root, mpdUrl)
              val totalDur = isoSeconds(attr(root, "mediaPresentationDuration"))
              val period = childEls(root, "Period").firstOrNull() ?: return out
              val perBase = baseOf(period, mpdBase)
              val pd = isoSeconds(attr(period, "duration"))
              val perDur = if (pd > 0.0) pd else totalDur
              for (aset in childEls(period, "AdaptationSet")) {
                  if (childEls(aset, "ContentProtection").isNotEmpty()) continue
                  val asBase = baseOf(aset, perBase)
                  val asMime = attr(aset, "mimeType")
                  val asType = attr(aset, "contentType")
                  val asCodecs = attr(aset, "codecs")
                  val asTpl = childEls(aset, "SegmentTemplate").firstOrNull()
                  val asList = childEls(aset, "SegmentList").firstOrNull()
                  for (rep in childEls(aset, "Representation")) {
                      if (childEls(rep, "ContentProtection").isNotEmpty()) continue
                      val mime = attr(rep, "mimeType").ifEmpty { asMime }
                      val type = asType.ifEmpty { mime.substringBefore('/') }
                      val kind = if (type.startsWith("video")) "video" else if (type.startsWith("audio")) "audio" else continue
                      val id = attr(rep, "id")
                      val bw = attr(rep, "bandwidth").toLongOrNull() ?: 0L
                      val w = attr(rep, "width").toIntOrNull() ?: 0
                      val h = attr(rep, "height").toIntOrNull() ?: 0
                      val codecs = attr(rep, "codecs").ifEmpty { asCodecs }
                      val repBase = baseOf(rep, asBase)
                      val ext = extFor(kind, mime)
                      val tpl = childEls(rep, "SegmentTemplate").firstOrNull() ?: asTpl
                      val sl = childEls(rep, "SegmentList").firstOrNull() ?: asList
                      if (tpl != null) {
                          val plan = planFromTemplate(tpl, id, bw, repBase, perDur, ext) ?: continue
                          out.add(DashRep(id, kind, bw, w, h, codecs, ext, null, plan))
                      } else if (sl != null) {
                          val plan = planFromList(sl, repBase, ext) ?: continue
                          out.add(DashRep(id, kind, bw, w, h, codecs, ext, null, plan))
                      } else if (childEls(rep, "BaseURL").isNotEmpty()) {
                          out.add(DashRep(id, kind, bw, w, h, codecs, ext, repBase, null))
                      }
                  }
              }
              return out
          }

          fun parseDashItems(mpdUrl: String, xml: String, headers: Map<String, String>): List<VideoItem> {
              val reps = parseMpd(mpdUrl, xml)
              val out = mutableListOf<VideoItem>()
              val audio = reps.filter { it.kind == "audio" }.maxByOrNull { it.bw }
              for (r in reps.filter { it.kind == "video" }.sortedByDescending { it.bw }) {
                  val label = if (r.h > 0) r.h.toString() + "p" else mbps(r.bw)
                  val parts = mutableListOf("DASH")
                  if (r.w > 0) parts.add(r.w.toString() + "x" + r.h)
                  if (r.bw > 0L) parts.add(mbps(r.bw))
                  if (audio != null) parts.add("+audio")
                  out.add(VideoItem(mpdUrl, label, "DASH", parts.joinToString(" · "), headers, r.h * 100000L + r.bw / 1000L, audio?.id ?: "", r.id))
              }
              if (audio != null) {
                  out.add(VideoItem(mpdUrl, "Audio · " + mbps(audio.bw), "DASH", "DASH audio only", headers, -1L, "", audio.id))
              }
              return out
          }
