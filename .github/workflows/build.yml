          import org.mozilla.geckoview.WebExtension

          class HideRule(val host: String, val sel: String, val path: String)

          object HideRules {
              var rev by mutableStateOf(0)
              val closing = mutableStateListOf<String>()
              private val jobs = HashMap<String, Runnable>()
              private val main = Handler(Looper.getMainLooper())

              fun keyOf(r: HideRule): String = r.host + "|" + r.path + "|" + r.sel

              fun requestRemove(r: HideRule) {
                  val k = keyOf(r)
                  if (closing.contains(k)) return
                  closing.add(k)
                  val job = Runnable {
                      jobs.remove(k)
                      closing.remove(k)
                      remove(r.host, r.sel, r.path)
                      toast(Gecko.appCtx, "Rule removed. Reload the page.")
                  }
                  jobs[k] = job
                  main.postDelayed(job, 2000L)
              }

              fun undoRemove(r: HideRule) {
                  val k = keyOf(r)
                  val job = jobs.remove(k)
                  if (job != null) main.removeCallbacks(job)
                  closing.remove(k)
              }

              private fun sp() = Gecko.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)

              fun hostKey(host: String): String = host.lowercase().removePrefix("www.")

              fun normPath(p: String): String {
                  if (p.isEmpty()) return ""
                  val q = if (p.startsWith("/")) p else "/" + p
                  return if (q.length > 1) q.trimEnd('/').ifEmpty { "/" } else q
              }

              @Synchronized
              private fun readAll(): JSONObject = try {
                  JSONObject(sp().getString("hide", "{}") ?: "{}")
              } catch (e: Exception) {
                  JSONObject()
              }

              private fun parse(host: String, e: Any?): HideRule? {
                  if (e is JSONObject) return HideRule(host, e.optString("s"), e.optString("p"))
                  if (e is String) return HideRule(host, e, "")
                  return null
              }

              @Synchronized
              fun forPage(host: String, path: String): List<String> {
                  val out = mutableListOf<String>()
                  val arr = readAll().optJSONArray(hostKey(host)) ?: return out
                  val np = normPath(if (path.isEmpty()) "/" else path)
                  for (i in 0 until arr.length()) {
                      val r = parse(host, arr.opt(i)) ?: continue
                      if (r.sel.isBlank()) continue
                      if (r.path.isEmpty() || r.path == np) out.add(r.sel)
                  }
                  return out
              }

              @Synchronized
              fun all(): List<HideRule> {
                  val out = mutableListOf<HideRule>()
                  val o = readAll()
                  val keys = o.keys()
                  while (keys.hasNext()) {
                      val h = keys.next()
                      val arr = o.optJSONArray(h) ?: continue
                      for (i in 0 until arr.length()) {
                          val r = parse(h, arr.opt(i)) ?: continue
                          if (r.sel.isNotBlank()) out.add(r)
                      }
                  }
                  return out.sortedBy { it.host }
              }

              @Synchronized
              fun add(host: String, sel: String, path: String) {
                  val k = hostKey(host)
                  if (k.isBlank() || sel.isBlank() || sel.length > 500) return
                  val p = normPath(path)
                  val all = readAll()
                  val arr = all.optJSONArray(k) ?: JSONArray()
                  for (i in 0 until arr.length()) {
                      val r = parse(k, arr.opt(i)) ?: continue
                      if (r.sel == sel && r.path == p) return
                  }
                  if (arr.length() >= 200) return
                  val o = JSONObject()
                  o.put("s", sel)
                  o.put("p", p)
                  arr.put(o)
                  all.put(k, arr)
                  sp().edit().putString("hide", all.toString()).apply()
                  rev++
              }

              @Synchronized
              fun remove(host: String, sel: String, path: String) {
                  val all = readAll()
                  val arr = all.optJSONArray(host) ?: return
                  val keep = JSONArray()
                  var removed = false
                  for (i in 0 until arr.length()) {
                      val r = parse(host, arr.opt(i))
                      if (!removed && r != null && r.sel == sel && r.path == path) {
                          removed = true
                          continue
                      }
                      keep.put(arr.opt(i))
                  }
                  if (keep.length() == 0) all.remove(host) else all.put(host, keep)
                  sp().edit().putString("hide", all.toString()).apply()
                  rev++
              }

              @Synchronized
              fun clear(host: String) {
                  val all = readAll()
                  all.remove(hostKey(host))
                  sp().edit().putString("hide", all.toString()).apply()
                  rev++
              }
          }

          object HideTool {
              var active by mutableStateOf(false)
              var has by mutableStateOf(false)
              var desc by mutableStateOf("")
              var note by mutableStateOf("")
              var previewing by mutableStateOf(false)
              var pageScope by mutableStateOf(false)
              var tabId = 0
              var extId = -1
              var port: WebExtension.Port? = null

              private fun send(ext: Int, cmd: String): Boolean {
                  val p = port ?: return false
                  if (ext < 0) return false
                  return try {
                      val o = JSONObject()
                      o.put("type", "pick")
                      o.put("cmd", cmd)
                      o.put("tabId", ext)
                      o.put("page", pageScope)
                      p.postMessage(o)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              fun begin(tab: BrowserTab): Boolean {
                  if (!send(tab.extId, "start")) return false
                  tabId = tab.id
                  extId = tab.extId
                  has = false
                  desc = ""
                  previewing = false
                  pageScope = false
                  note = "Tap an element on the page"
                  active = true
                  return true
              }

              fun cmd(c: String) {
                  send(extId, c)
              }

              fun onState(h: Boolean, d: String, p: Boolean, n: String) {
                  if (!active) return
                  has = h
                  desc = d
                  previewing = p
                  if (n.isNotBlank()) note = n
              }

              fun stop() {
                  if (active) send(extId, "stop")
                  deactivateLocal()
              }

              fun deactivateLocal() {
                  active = false
                  has = false
                  previewing = false
              }
          }
          object Saver {
              private fun sp() = Gecko.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)

              fun images(): Boolean = sp().getBoolean("saveimg", false)

              fun autoplay(): Boolean = sp().getBoolean("saveplay", false)

              fun setImages(v: Boolean) {
                  sp().edit().putBoolean("saveimg", v).apply()
                  push()
              }

              fun setAutoplay(v: Boolean) {
                  sp().edit().putBoolean("saveplay", v).apply()
              }

              fun mute(): Boolean = sp().getBoolean("savemute", false)

              fun setMute(v: Boolean, tabs: TabManager) {
                  sp().edit().putBoolean("savemute", v).apply()
                  val p = HideTool.port ?: return
                  for (t in ArrayList(tabs.tabs)) {
                      if (t.extId < 0) continue
                      try {
                          val o = JSONObject()
                          o.put("type", "pick")
                          o.put("cmd", "mute")
                          o.put("on", v)
                          o.put("tabId", t.extId)
                          p.postMessage(o)
                      } catch (e: Exception) {
                      }
                  }
              }

              fun push() {
                  val p = HideTool.port ?: return
                  try {
                      val o = JSONObject()
                      o.put("type", "saver")
                      o.put("img", images())
                      p.postMessage(o)
                  } catch (e: Exception) {
                  }
              }
          }
