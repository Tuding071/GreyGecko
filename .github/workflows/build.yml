          @Composable
          fun EditorScreen(id: String?, onBack: () -> Unit) {
              val scope = rememberCoroutineScope()
              val ctx = LocalContext.current
              val existing = remember { if (id == null) null else Store.load().firstOrNull { it.id == id } }
              var curId by remember { mutableStateOf(existing?.id) }
              var code by remember { mutableStateOf(existing?.code ?: NEW_TEMPLATE) }
              var enabled by remember { mutableStateOf(existing?.enabled ?: true) }
              var srcUrl by remember { mutableStateOf(existing?.sourceUrl ?: "") }
              var remoteVer by remember { mutableStateOf(existing?.remoteVersion ?: "") }
              var savedCode by remember { mutableStateOf(existing?.code ?: NEW_TEMPLATE) }
              var savedEnabled by remember { mutableStateOf(existing?.enabled ?: true) }
              var savedSrc by remember { mutableStateOf(existing?.sourceUrl ?: "") }
              var status by remember { mutableStateOf("") }
              var showDiscard by remember { mutableStateOf(false) }
              var showDelete by remember { mutableStateOf(false) }
              val meta = remember(code) { parseMeta(code) }
              val dirty = code != savedCode || enabled != savedEnabled || srcUrl != savedSrc

              BackHandler(dirty) { showDiscard = true }

              fun save() {
                  val list = Store.load()
                  val sid = curId
                  val target = if (sid == null) null else list.firstOrNull { it.id == sid }
                  if (target == null) {
                      val s = Script(sid ?: Store.newId(), code, enabled, srcUrl, remoteVer)
                      list.add(s)
                      curId = s.id
                  } else {
                      target.code = code
                      target.enabled = enabled
                      target.sourceUrl = srcUrl
                      target.remoteVersion = remoteVer
                  }
                  Store.save(list)
                  savedCode = code
                  savedEnabled = enabled
                  savedSrc = srcUrl
                  status = "Saved. Reload the page to run it."
              }

              Column(Modifier.fillMaxSize()) {
                  Header {
                      TextButton(onClick = { if (dirty) showDiscard = true else onBack() }) {
                          Text("←", color = Color.White, fontSize = 20.sp)
                      }
                      Text(
                          if (curId == null) "New script" else "Edit script",
                          color = Color.White,
                          fontSize = 18.sp,
                          modifier = Modifier.weight(1f)
                      )
                      Button(onClick = {
                          save()
                          toast(ctx, "Saved. Reload the page to run it.")
                          onBack()
                      }) { Text("Save") }
                      Spacer(Modifier.width(6.dp))
                  }
                  Column(
                      Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(12.dp)
                  ) {
                      Text("Parsed from header", color = Color(0xFF888888), fontSize = 11.sp)
                      Spacer(Modifier.height(6.dp))
                      Row(Modifier.horizontalScroll(rememberScrollState())) {
                          InfoChip(meta.name)
                          if (meta.version.isNotBlank()) { Spacer(Modifier.width(6.dp)); InfoChip("v" + meta.version) }
                          Spacer(Modifier.width(6.dp))
                          InfoChip((meta.matches.size + meta.includes.size).toString() + " match")
                          Spacer(Modifier.width(6.dp))
                          InfoChip("run-at " + meta.runAt.removePrefix("document-"))
                          if (meta.excludes.isNotEmpty()) { Spacer(Modifier.width(6.dp)); InfoChip(meta.excludes.size.toString() + " exclude") }
                          if (meta.requires.isNotEmpty()) { Spacer(Modifier.width(6.dp)); InfoChip(meta.requires.size.toString() + " require") }
                      }
                      if (meta.matches.isEmpty() && meta.includes.isEmpty()) {
                          Text(
                              "No @match or @include: this script will never run.",
                              color = Danger,
                              fontSize = 12.sp,
                              modifier = Modifier.padding(top = 6.dp)
                          )
                      }
                      Spacer(Modifier.height(10.dp))
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("Enabled", color = Color.White, modifier = Modifier.weight(1f))
                          Switch(checked = enabled, onCheckedChange = { enabled = it }, colors = switchColors())
                      }
                      Spacer(Modifier.height(10.dp))
                      Text("Update URL (used if the header has no @updateURL or @downloadURL)", color = Color(0xFF888888), fontSize = 11.sp)
                      Spacer(Modifier.height(6.dp))
                      OutlinedTextField(
                          value = srcUrl,
                          onValueChange = { srcUrl = it },
                          modifier = Modifier.fillMaxWidth(),
                          singleLine = true,
                          textStyle = TextStyle(fontFamily = FontFamily.Monospace, fontSize = 12.sp, color = Color.White),
                          colors = fieldColors()
                      )
                      Spacer(Modifier.height(8.dp))
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Button(onClick = {
                              val u = checkUrlFor(meta, srcUrl)
                              if (u.isBlank()) {
                                  status = "Add an update URL first"
                              } else {
                                  status = "Checking…"
                                  scope.launch {
                                      val r = withContext(Dispatchers.IO) {
                                          try { httpGet(u) } catch (e: Exception) { "ERR:" + e.message }
                                      }
                                      if (r.startsWith("ERR:")) {
                                          status = r.substring(4)
                                      } else {
                                          val rv = parseMeta(r).version
                                          if (rv.isNotBlank() && compareVersions(rv, meta.version) > 0) {
                                              remoteVer = rv
                                              status = "Update " + rv + " available"
                                          } else {
                                              remoteVer = ""
                                              status = "Up to date"
                                          }
                                      }
                                  }
                              }
                          }) { Text("Check") }
                          if (remoteVer.isNotBlank()) {
                              Spacer(Modifier.width(8.dp))
                              Button(onClick = {
                                  val u = applyUrlFor(meta, srcUrl)
                                  if (u.isBlank()) {
                                      status = "No update URL"
                                  } else {
                                      status = "Downloading…"
                                      scope.launch {
                                          val r = withContext(Dispatchers.IO) {
                                              try { httpGet(u) } catch (e: Exception) { "ERR:" + e.message }
                                          }
                                          if (r.startsWith("ERR:")) {
                                              status = r.substring(4)
                                          } else if (!r.contains("==UserScript==")) {
                                              status = "Downloaded file has no script header"
                                          } else {
                                              code = r
                                              remoteVer = ""
                                              save()
                                              status = "Updated to v" + parseMeta(r).version
                                          }
                                      }
                                  }
                              }) { Text("Update to v" + remoteVer) }
                          }
                      }
                      if (status.isNotBlank()) {
                          Text(status, color = Soft, fontSize = 12.sp, modifier = Modifier.padding(top = 8.dp))
                      }
                      if (curId != null) {
                          Text(
                              "Delete script",
                              color = Danger,
                              fontSize = 14.sp,
                              modifier = Modifier
                                  .padding(top = 20.dp, bottom = 12.dp)
                                  .clickable { showDelete = true }
                          )
                      }
                      Spacer(Modifier.height(10.dp))
                      OutlinedTextField(
                          value = code,
                          onValueChange = { code = it },
                          modifier = Modifier.fillMaxWidth(),
                          minLines = 12,
                          textStyle = TextStyle(fontFamily = FontFamily.Monospace, fontSize = 12.sp, color = Color.White),
                          colors = fieldColors()
                      )
                  }
              }
              if (showDiscard) {
                  AlertDialog(
                      onDismissRequest = { showDiscard = false },
                      containerColor = Bar,
                      title = { Text("Discard changes?", color = Color.White) },
                      text = { Text("You have unsaved changes.", color = Soft) },
                      confirmButton = {
                          TextButton(onClick = { showDiscard = false; onBack() }) { Text("Discard", color = Danger) }
                      },
                      dismissButton = {
                          TextButton(onClick = { showDiscard = false }) { Text("Keep editing", color = Color.White) }
                      }
                  )
              }
              if (showDelete) {
                  AlertDialog(
                      onDismissRequest = { showDelete = false },
                      containerColor = Bar,
                      title = { Text("Delete script?", color = Color.White) },
                      text = { Text(meta.name, color = Soft) },
                      confirmButton = {
                          TextButton(onClick = {
                              showDelete = false
                              val sid = curId
                              if (sid != null) Store.remove(sid)
                              onBack()
                          }) { Text("Delete", color = Danger) }
                      },
                      dismissButton = {
                          TextButton(onClick = { showDelete = false }) { Text("Cancel", color = Color.White) }
                      }
                  )
              }
          }

          const val FILTER_GUIDE = """WHAT IT DOES
          Blocks ad and tracker network requests before they load, using the standard EasyList (Adblock Plus) rule format.

          HOW TO ADD A LIST
          1. Tap Add next to a list below. Or copy its link, tap URL on the Ad filters screen, paste it and tap Download.
          2. Or save a rules .txt file on your phone and tap Import.
          3. Reload the page. The Ad filters screen shows how many rules loaded and how many requests were blocked.

          TIPS
          - EasyList plus EasyPrivacy is a good start. More lists means more memory and a slower start.
          - Use the switch on a list to turn it off without deleting it. Tap a list to update or delete it.
          - If a site breaks, turn Ad blocking off, reload, and see if the filters caused it.

          SUPPORTED
          Domain rules (||example.com^), anchors, wildcards, exceptions (@@), hosts-format lines, and the options script, image, stylesheet, xmlhttprequest, subdocument, media, font, ping, other, third-party, domain= and important.

          NOT SUPPORTED (these rules are skipped)
          Element hiding (##), scriptlets (##+js), and redirect, csp and removeparam rules. To remove a leftover empty box yourself, use Hide element in the menu. YouTube video ads and some anti-adblock walls will still show.

          The lists below belong to their maintainers. Links are not checked by this app."""

          class FilterLink(val name: String, val url: String, val note: String)

          val FILTER_LINKS = listOf(
              FilterLink("EasyList", "https://easylist.to/easylist/easylist.txt", "Main ad list. Start here."),
              FilterLink("EasyPrivacy", "https://ublockorigin.github.io/uAssets/thirdparties/easyprivacy.txt", "Trackers and analytics."),
              FilterLink("uBlock filters", "https://ublockorigin.github.io/uAssets/filters/filters.min.txt", "uBlock Origin's own ad rules."),
              FilterLink("uBlock annoyances", "https://ublockorigin.github.io/uAssets/filters/annoyances.txt", "Popups, cookie banners, overlays."),
              FilterLink("AdGuard Base", "https://filters.adtidy.org/extension/ublock/filters/2_without_easylist.txt", "AdGuard's ad rules. Use together with EasyList."),
              FilterLink("AdGuard Mobile Ads", "https://filters.adtidy.org/extension/ublock/filters/11.txt", "Extra rules for mobile ads."),
              FilterLink("AdGuard Tracking Protection", "https://filters.adtidy.org/extension/ublock/filters/3.txt", "Tracker rules."),
              FilterLink("AdGuard Popup Overlays", "https://filters.adtidy.org/extension/ublock/filters/19.txt", "Popups and overlays."),
              FilterLink("StevenBlack hosts", "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts", "Ad and malware domains in hosts format. Large.")
          )

          fun displayName(ctx: Context, uri: android.net.Uri): String {
              var n = ""
              try {
                  ctx.contentResolver.query(uri, null, null, null, null)?.use { c ->
                      if (c.moveToFirst()) {
                          val i = c.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME)
                          if (i >= 0) n = c.getString(i) ?: ""
                      }
                  }
              } catch (e: Exception) {
              }
              return n.removeSuffix(".txt").ifBlank { "Imported list" }
          }

          @Composable
          fun FilterToggleRow(label: String, checked: Boolean, onChange: (Boolean) -> Unit) {
              Row(
                  Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(label, color = Color.White, fontSize = 14.sp, modifier = Modifier.weight(1f))
                  Switch(checked = checked, onCheckedChange = onChange, colors = switchColors())
              }
          }

          @Composable
          fun UrlListDialog(onDismiss: () -> Unit, onAdded: () -> Unit) {
              val scope = rememberCoroutineScope()
              var url by remember { mutableStateOf("") }
              var err by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              AlertDialog(
                  onDismissRequest = { if (!busy) onDismiss() },
                  containerColor = Bar,
                  title = { Text("Add filter list from URL", color = Color.White) },
                  text = {
                      Column {
                          OutlinedTextField(
                              value = url,
                              onValueChange = { url = it; err = "" },
                              singleLine = true,
                              colors = fieldColors(),
                              placeholder = { Text("https://easylist.to/easylist/easylist.txt", color = Color(0xFF999999)) }
                          )
                          if (err.isNotBlank()) {
                              Text(err, color = Danger, fontSize = 12.sp, modifier = Modifier.padding(top = 6.dp))
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          val u = url.trim()
                          if (u.isNotEmpty() && !busy) {
                              busy = true
                              err = "Downloading…"
                              scope.launch {
                                  val r = withContext(Dispatchers.IO) { Filters.addFromUrl(u, "") }
                                  busy = false
                                  if (r.isEmpty()) onAdded() else err = r
                              }
                          }
                      }) { Text("Download", color = Color.White) }
                  },
                  dismissButton = {
                      TextButton(onClick = { if (!busy) onDismiss() }) { Text("Cancel", color = Color.White) }
                  }
              )
          }

          @Composable
          fun FiltersScreen(onBack: () -> Unit, onGuide: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var lists by remember { mutableStateOf(Filters.load()) }
              var on by remember { mutableStateOf(Filters.isOn()) }

              var status by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              var showUrl by remember { mutableStateOf(false) }
              var sel by remember { mutableStateOf<FilterList?>(null) }
              var blocked by remember { mutableStateOf(Filters.blocked) }
              var loadedNet by remember { mutableStateOf(Filters.loadedNet) }
              var loadedCos by remember { mutableStateOf(Filters.loadedCos) }
              val fmt = remember { java.text.DateFormat.getDateInstance(java.text.DateFormat.SHORT) }
              fun reload() { lists = Filters.load() }

              LaunchedEffect(Unit) {
                  while (true) {
                      blocked = Filters.blocked
                      loadedNet = Filters.loadedNet
                      loadedCos = Filters.loadedCos
                      delay(1000)
                  }
              }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null && !busy) {
                      busy = true
                      status = "Importing…"
                      scope.launch {
                          val r = withContext(Dispatchers.IO) {
                              try {
                                  val t = ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""
                                  if (Filters.countRules(t) == 0) {
                                      "ERR:No rules found in that file"
                                  } else {
                                      Filters.add(displayName(ctx, uri), "", t)
                                      "OK"
                                  }
                              } catch (e: Exception) {
                                  "ERR:" + (e.message ?: "Could not read file")
                              }
                          }
                          busy = false
                          reload()
                          status = if (r.startsWith("ERR:")) r.substring(4) else "Imported. Reload the page."
                      }
                  }
              }

              Column(Modifier.fillMaxSize()) {
                  Header {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Ad filters", color = Color.White, fontSize = 18.sp)
                      Spacer(Modifier.width(8.dp))
                      Box(
                          Modifier
                              .size(26.dp)
                              .border(1.dp, Color(0xFF888888), CircleShape)
                              .clickable { onGuide() },
                          contentAlignment = Alignment.Center
                      ) {
                          Text("?", color = Color.White, fontSize = 14.sp)
                      }
                      Spacer(Modifier.weight(1f))
                      TextButton(onClick = { picker.launch(arrayOf("*/*")) }) { Text("Import", color = Color.White) }
                      TextButton(onClick = { showUrl = true }) { Text("URL", color = Color.White) }
                  }
                  Column(Modifier.weight(1f).verticalScroll(rememberScrollState())) {
                      FilterToggleRow("Ad blocking", on) { v ->
                          on = v
                          Filters.setOn(v)
                      }

                      Text(
                          "Rules loaded: " + loadedNet + " · blocked this session: " + blocked,
                          color = Soft,
                          fontSize = 12.sp,
                          modifier = Modifier.padding(horizontal = 12.dp, vertical = 4.dp)
                      )
                      Row(Modifier.fillMaxWidth().padding(horizontal = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                          if (lists.any { it.url.isNotBlank() }) {
                              TextButton(onClick = {
                                  if (!busy) {
                                      busy = true
                                      status = "Updating…"
                                      scope.launch {
                                          val res = withContext(Dispatchers.IO) {
                                              var ok = 0
                                              var tot = 0
                                              for (f in Filters.load()) {
                                                  if (f.url.isBlank()) continue
                                                  tot++
                                                  if (Filters.refresh(f.id).isEmpty()) ok++
                                              }
                                              ok.toString() + "/" + tot
                                          }
                                          busy = false
                                          reload()
                                          status = "Updated " + res + ". Reload the page."
                                      }
                                  }
                              }) { Text("Update all", color = Color.White, fontSize = 12.sp) }
                          }
                      }
                      if (status.isNotBlank()) {
                          Text(status, color = Soft, fontSize = 12.sp, modifier = Modifier.padding(horizontal = 12.dp, vertical = 2.dp))
                      }
                      Box(Modifier.fillMaxWidth().height(0.5.dp).background(Color(0xFF333333)))
                      if (lists.isEmpty()) {
                          EmptyNote("No filter lists yet. Tap URL to download one or Import to load a .txt file. Tap ? for links to popular lists.")
                      }
                      for (f in lists) {
                          key(f.id) {
                              Row(
                                  Modifier.fillMaxWidth().clickable { sel = f }.padding(horizontal = 12.dp, vertical = 10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(Modifier.weight(1f)) {
                                      Text(
                                          f.name,
                                          color = if (f.enabled) Color.White else Color(0xFF888888),
                                          fontSize = 14.sp,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                      Text(
                                          f.count.toString() + " rules" +
                                              (if (f.updated > 0) " · " + fmt.format(java.util.Date(f.updated)) else "") +
                                              (if (f.url.isBlank()) " · imported file" else " · " + hostOf(f.url)),
                                          color = Soft,
                                          fontSize = 12.sp,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  }
                                  Switch(
                                      checked = f.enabled,
                                      onCheckedChange = { v ->
                                          Filters.setEnabled(f.id, v)
                                          reload()
                                      },
                                      colors = switchColors()
                                  )
                              }
                              Box(Modifier.fillMaxWidth().height(0.5.dp).background(Color(0xFF333333)))
                          }
                      }
                  }
              }

              if (showUrl) {
                  UrlListDialog(
                      onDismiss = { showUrl = false },
                      onAdded = {
                          showUrl = false
                          reload()
                          status = "Added. Reload the page."
                      }
                  )
              }

              val s = sel
              if (s != null) {
                  AlertDialog(
                      onDismissRequest = { sel = null },
                      containerColor = Bar,
                      title = { Text(s.name, color = Color.White, fontSize = 16.sp, maxLines = 1, overflow = TextOverflow.Ellipsis) },
                      text = {
                          Column {
                              if (s.url.isNotBlank()) {
                                  MenuRow("Update now") {
                                      sel = null
                                      if (!busy) {
                                          busy = true
                                          status = "Updating…"
                                          scope.launch {
                                              val e = withContext(Dispatchers.IO) { Filters.refresh(s.id) }
                                              busy = false
                                              reload()
                                              status = if (e.isEmpty()) "Updated " + s.name + ". Reload the page." else e
                                          }
                                      }
                                  }
                              }
                              MenuRow("Delete") {
                                  sel = null
                                  Filters.remove(s.id)
                                  reload()
                              }
                          }
                      },
                      confirmButton = {},
                      dismissButton = {
                          TextButton(onClick = { sel = null }) { Text("Close", color = Color.White) }
                      }
                  )
              }
          }

          @Composable
          fun FilterGuideScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var status by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              Column(Modifier.fillMaxSize()) {
                  Header {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Filter guide", color = Color.White, fontSize = 18.sp, modifier = Modifier.weight(1f))
                  }
                  Column(Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(12.dp)) {
                      Text(FILTER_GUIDE, color = Color.White, fontSize = 13.sp)
                      Spacer(Modifier.height(14.dp))
                      Text("LISTS", color = Soft, fontSize = 11.sp, fontWeight = FontWeight.SemiBold)
                      if (status.isNotBlank()) {
                          Text(status, color = Soft, fontSize = 12.sp, modifier = Modifier.padding(vertical = 4.dp))
                      }
                      for (l in FILTER_LINKS) {
                          Column(Modifier.fillMaxWidth().padding(top = 10.dp)) {
                              Text(l.name, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                              Text(l.note, color = Soft, fontSize = 12.sp)
                              Text(l.url, color = Color(0xFFBBBBBB), fontSize = 11.sp, fontFamily = FontFamily.Monospace)
                              Row {
                                  TextButton(onClick = {
                                      copyText(ctx, l.url)
                                      toast(ctx, "Link copied")
                                  }) { Text("Copy", color = Color.White, fontSize = 13.sp) }
                                  TextButton(onClick = {
                                      if (!busy) {
                                          busy = true
                                          status = "Downloading " + l.name + "…"
                                          scope.launch {
                                              val e = withContext(Dispatchers.IO) { Filters.addFromUrl(l.url, l.name) }
                                              busy = false
                                              status = if (e.isEmpty()) l.name + " added. Reload the page." else e
                                          }
                                      }
                                  }) { Text("Add", color = Color.White, fontSize = 13.sp) }
                              }
                              Box(Modifier.fillMaxWidth().height(0.5.dp).background(Color(0xFF333333)))
                          }
                      }
                  }
              }
          }

          @Composable
          fun GuideScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              var copied by remember { mutableStateOf(false) }
              LaunchedEffect(copied) {
                  if (copied) {
                      delay(1500)
                      copied = false
                  }
              }
              Column(Modifier.fillMaxSize()) {
                  Header {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Script guide", color = Color.White, fontSize = 18.sp, modifier = Modifier.weight(1f))
                      Button(onClick = {
                          val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("GreyGecko script guide", GUIDE))
                          copied = true
                      }) { Text(if (copied) "Copied" else "Copy for AI") }
                      Spacer(Modifier.width(6.dp))
                  }
                  Column(Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(12.dp)) {
                      Text(
                          "Copy this and paste it into your AI chat, then describe the script you want.",
                          color = Color(0xFFBBBBBB),
                          fontSize = 13.sp
                      )
                      Spacer(Modifier.height(10.dp))
                      SelectionContainer {
                          Text(GUIDE, color = Color.White, fontFamily = FontFamily.Monospace, fontSize = 11.5.sp)
                      }
                  }
              }
          }

          @Composable
          fun LogScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var raw by remember { mutableStateOf("Loading...") }
              var filter by remember { mutableStateOf("GreyScript") }
              val scroll = rememberScrollState()

              fun refresh() {
                  scope.launch { raw = withContext(Dispatchers.IO) { readLogcat() } }
              }
              LaunchedEffect(Unit) { refresh() }

              val shown = remember(raw, filter) {
                  raw.lines().filter { filter.isBlank() || it.contains(filter, true) }.joinToString("\n")
              }
              LaunchedEffect(shown) {
                  delay(150)
                  scroll.scrollTo(scroll.maxValue)
              }

              Column(Modifier.fillMaxSize()) {
                  Header {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Logcat", color = Color.White, fontSize = 18.sp, modifier = Modifier.weight(1f))
                      Button(onClick = { refresh() }) { Text("Refresh") }
                      Spacer(Modifier.width(8.dp))
                      Button(onClick = {
                          val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("logcat", shown))
                      }) { Text("Copy") }
                      Spacer(Modifier.width(6.dp))
                  }
                  Column(Modifier.fillMaxSize().padding(10.dp)) {
                      OutlinedTextField(
                          value = filter,
                          onValueChange = { filter = it },
                          modifier = Modifier.fillMaxWidth(),
                          singleLine = true,
                          placeholder = { Text("Filter (e.g. GreyScript)", color = Color(0xFF999999)) },
                          colors = fieldColors()
                      )
                      Spacer(Modifier.height(6.dp))
                      Box(
                          Modifier
                              .fillMaxSize()
                              .background(Field)
                              .padding(6.dp)
                              .verticalScroll(scroll)
                      ) {
                          SelectionContainer {
                              Text(
                                  shown,
                                  color = Color.White,
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = 11.sp
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/test.jks
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GreyGecko
          path: app/build/outputs/apk/release/*.apk
