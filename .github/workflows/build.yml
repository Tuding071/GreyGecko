          class ChoiceRow(val c: GeckoSession.PromptDelegate.ChoicePrompt.Choice, val header: Boolean, val indent: Boolean)

          fun flattenChoices(arr: Array<GeckoSession.PromptDelegate.ChoicePrompt.Choice>?): List<ChoiceRow> {
              val out = ArrayList<ChoiceRow>()
              if (arr == null) return out
              for (c in arr) {
                  val kids = c.items
                  if (kids != null && kids.isNotEmpty()) {
                      out.add(ChoiceRow(c, true, false))
                      for (k in kids) out.add(ChoiceRow(k, false, true))
                  } else {
                      out.add(ChoiceRow(c, false, false))
                  }
              }
              return out
          }

          @Composable
          fun ChoiceDialog(tabs: TabManager) {
              val req = tabs.choice ?: return
              val p = req.prompt
              val rows = remember(req) { flattenChoices(p.choices) }
              val multi = p.type == GeckoSession.PromptDelegate.ChoicePrompt.Type.MULTIPLE
              val picked = remember(req) {
                  val l = mutableStateListOf<String>()
                  for (r in rows) {
                      if (!r.header && r.c.selected) l.add(r.c.id)
                  }
                  l
              }
              fun finish(resp: () -> GeckoSession.PromptDelegate.PromptResponse) {
                  tabs.choice = null
                  try {
                      req.result.complete(resp())
                  } catch (e: Exception) {
                      Log.d("GreyScript", "choice complete failed: " + e)
                  }
              }
              val heading = (p.title ?: "").ifBlank { (p.message ?: "").ifBlank { "Select" } }
              AlertDialog(
                  onDismissRequest = { finish { p.dismiss() } },
                  containerColor = Bar,
                  title = { Text(heading, color = Soft, fontSize = 14.sp, maxLines = 2, overflow = TextOverflow.Ellipsis) },
                  text = {
                      Column(Modifier.heightIn(max = 380.dp).verticalScroll(rememberScrollState())) {
                          for (r in rows) {
                              if (r.header) {
                                  Text(
                                      r.c.label,
                                      color = Soft,
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      modifier = Modifier.padding(top = 10.dp, bottom = 4.dp)
                                  )
                              } else if (r.c.separator) {
                                  Box(Modifier.fillMaxWidth().height(0.5.dp).background(Color(0xFF555555)))
                              } else {
                                  val id = r.c.id
                                  val on = if (multi) picked.contains(id) else r.c.selected
                                  val dis = r.c.disabled
                                  Row(
                                      Modifier
                                          .fillMaxWidth()
                                          .clip(RoundedCornerShape(8.dp))
                                          .background(if (on) Field else Color.Transparent)
                                          .clickable(enabled = !dis) {
                                              if (multi) {
                                                  if (picked.contains(id)) picked.remove(id) else picked.add(id)
                                              } else {
                                                  finish { p.confirm(id) }
                                              }
                                          }
                                          .padding(start = if (r.indent) 18.dp else 8.dp, end = 8.dp, top = 12.dp, bottom = 12.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      if (multi) {
                                          Text(if (on) "☑" else "☐", color = if (dis) Color(0xFF777777) else Color.White, fontSize = 16.sp)
                                          Spacer(Modifier.width(10.dp))
                                      }
                                      Text(
                                          r.c.label.ifBlank { " " },
                                          color = if (dis) Color(0xFF777777) else Color.White,
                                          fontSize = 15.sp,
                                          modifier = Modifier.weight(1f)
                                      )
                                      if (!multi && on) Text("✓", color = TmGreen, fontSize = 15.sp)
                                  }
                              }
                          }
                      }
                  },
                  confirmButton = {
                      if (multi) {
                          TextButton(onClick = { finish { p.confirm(picked.toTypedArray()) } }) { Text("OK", color = Color.White) }
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = { finish { p.dismiss() } }) { Text("Cancel", color = Color.White) }
                  }
              )
          }

          @Composable
          fun JsDialog(tabs: TabManager) {
              val req = tabs.js ?: return
              var text by remember(req) { mutableStateOf(req.def) }
              fun finish(r: () -> GeckoSession.PromptDelegate.PromptResponse) {
                  tabs.js = null
                  try {
                      req.result.complete(r())
                  } catch (e: Exception) {
                      Log.d("GreyScript", "js dialog complete failed: " + e)
                  }
              }
              val host = hostOf(tabs.current?.url ?: "")
              val heading = if (host.isBlank()) "This page says" else host + " says"
              val kind = req.kind
              val okLabel = if (kind == 3) "Leave" else "OK"
              val cancelLabel = if (kind == 3) "Stay" else "Cancel"
              val msg = if (kind == 3) "Leave this page? Changes you made may not be saved." else req.message
              AlertDialog(
                  onDismissRequest = { finish { req.cancel() } },
                  containerColor = Bar,
                  title = { Text(heading, color = Soft, fontSize = 14.sp, maxLines = 1, overflow = TextOverflow.Ellipsis) },
                  text = {
                      Column(Modifier.heightIn(max = 320.dp).verticalScroll(rememberScrollState())) {
                          if (msg.isNotBlank()) {
                              SelectionContainer { Text(msg, color = Color.White, fontSize = 15.sp) }
                          }
                          if (kind == 2) {
                              Spacer(Modifier.height(10.dp))
                              OutlinedTextField(
                                  value = text,
                                  onValueChange = { text = it },
                                  singleLine = true,
                                  colors = fieldColors(),
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = { finish { req.ok(text) } }) { Text(okLabel, color = Color.White) }
                  },
                  dismissButton = {
                      if (kind != 0) {
                          TextButton(onClick = { finish { req.cancel() } }) { Text(cancelLabel, color = Color.White) }
                      }
                  }
              )
          }

