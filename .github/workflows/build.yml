                          d.spB = d.bytes
                          return
                      }
                      val dt = now - d.spT
                      if (dt >= 1000L) {
                          d.speed = (d.bytes - d.spB) * 1000L / dt
                          d.spT = now
                          d.spB = d.bytes
                      }
