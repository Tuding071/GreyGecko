              var title by mutableStateOf("")
              var progress by mutableStateOf(0)
              var loading by mutableStateOf(false)
              var extId = -1
              val videos = mutableStateListOf<VideoItem>()
              val seen = HashSet<String>()

              fun addVideo(v: VideoItem) {
                  seen.add(v.url.substringBefore('#'))
                  val i = videos.indexOfFirst { it.url == v.url }
                  if (i >= 0) {
                      if (v.rank > videos[i].rank) videos[i] = v
                      return
                  }
                  if (videos.size >= 60) return
                  videos.add(v)
              }
          }

          fun shownUrl(t: BrowserTab?): String {
              val u = t?.url ?: ""
              return if (u == "about:blank") "" else u
          }

          class TabManager(private val runtime: GeckoRuntime) {
              val tabs = mutableStateListOf<BrowserTab>()
              var current by mutableStateOf<BrowserTab?>(null)
              private var counter = 0

              fun newTab(url: String, select: Boolean = true): BrowserTab {
                  val s = GeckoSession()
                  counter += 1
                  val t = BrowserTab(counter, s)
                  attach(t)
                  s.open(runtime)
                  tabs.add(t)
                  if (select || current == null) current = t
                  s.loadUri(url)
                  return t
              }

              fun select(t: BrowserTab) {
                  current = t
              }

              fun close(t: BrowserTab) {
                  val i = tabs.indexOf(t)
                  if (i < 0) return
                  tabs.removeAt(i)
                  if (tabs.isEmpty()) {
                      newTab("about:blank", true)
                  } else if (current === t) {
                      current = tabs[minOf(i, tabs.size - 1)]
                  }
                  Handler(Looper.getMainLooper()).postDelayed({ t.session.close() }, 400)
              }

              fun closeAll() {
                  for (t in tabs.toList()) {
                      t.session.close()
                  }
                  tabs.clear()
                  current = null
              }

              private fun attach(t: BrowserTab) {
                  t.session.navigationDelegate = object : GeckoSession.NavigationDelegate {
                      override fun onLocationChange(
                          session: GeckoSession,
                          url: String?,
                          perms: MutableList<GeckoSession.PermissionDelegate.ContentPermission>,
                          hasUserGesture: Boolean
                      ) {
                          t.url = url ?: ""
                      }

                      override fun onLoadRequest(
                          session: GeckoSession,
                          request: GeckoSession.NavigationDelegate.LoadRequest
                      ): GeckoResult<AllowOrDeny>? {
                          if (request.target == GeckoSession.NavigationDelegate.TARGET_WINDOW_NEW) {
                              newTab(request.uri, true)
                              return GeckoResult.fromValue(AllowOrDeny.DENY)
                          }
                          return null
                      }
                  }
                  t.session.progressDelegate = object : GeckoSession.ProgressDelegate {
                      override fun onPageStart(session: GeckoSession, url: String) {
                          t.loading = true
                          t.progress = 8
                          t.title = ""
                          t.url = url
                          t.videos.clear()
                          t.seen.clear()
                      }

                      override fun onProgressChange(session: GeckoSession, progress: Int) {
                          t.progress = maxOf(progress, 8)
                          t.loading = progress < 100
                      }

                      override fun onPageStop(session: GeckoSession, success: Boolean) {
                          t.loading = false
                          t.progress = 0
                          if (success) HistoryStore.add(t.url, t.title)
                      }
                  }
                  t.session.contentDelegate = object : GeckoSession.ContentDelegate {
                      override fun onTitleChange(session: GeckoSession, title: String?) {
                          t.title = title ?: ""
                          HistoryStore.setTitle(t.url, t.title)
                      }
                  }
              }
          }

          class PageEntry(val url: String, val title: String, val time: Long)

          private fun browserPrefs() =
              Gecko.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)

          private fun readEntries(key: String): MutableList<PageEntry> {
              val out = mutableListOf<PageEntry>()
              try {
                  val arr = JSONArray(browserPrefs().getString(key, "[]") ?: "[]")
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      out.add(PageEntry(o.optString("u"), o.optString("t"), o.optLong("d")))
                  }
              } catch (e: Exception) {
              }
              return out
          }

          private fun writeEntries(key: String, list: List<PageEntry>) {
              val arr = JSONArray()
              for (e in list) {
                  val o = JSONObject()
                  o.put("u", e.url)
                  o.put("t", e.title)
                  o.put("d", e.time)
                  arr.put(o)
              }
              browserPrefs().edit().putString(key, arr.toString()).apply()
          }

          object HistoryStore {
              @Synchronized
              fun load(): List<PageEntry> = readEntries("history")

              @Synchronized
              fun add(url: String, title: String) {
                  if (url.isBlank() || url.startsWith("about:")) return
                  val l = readEntries("history")
                  if (l.isNotEmpty() && l[0].url == url) l.removeAt(0)
                  l.add(0, PageEntry(url, title, System.currentTimeMillis()))
                  while (l.size > 300) l.removeAt(l.size - 1)
                  writeEntries("history", l)
              }

              @Synchronized
              fun setTitle(url: String, title: String) {
                  if (url.isBlank() || title.isBlank()) return
                  val l = readEntries("history")
                  val i = l.indexOfFirst { it.url == url }
                  if (i >= 0) {
                      l[i] = PageEntry(url, title, l[i].time)
                      writeEntries("history", l)
                  }
              }

              @Synchronized
              fun clear() {
                  writeEntries("history", emptyList())
              }
          }

          object BookmarkStore {
              @Synchronized
              fun load(): List<PageEntry> = readEntries("bookmarks")

              @Synchronized
              fun add(url: String, title: String) {
                  if (url.isBlank()) return
                  val l = readEntries("bookmarks")
                  l.removeAll { it.url == url }
                  l.add(0, PageEntry(url, title, System.currentTimeMillis()))
                  writeEntries("bookmarks", l)
              }

              @Synchronized
              fun remove(url: String) {
                  val l = readEntries("bookmarks")
                  l.removeAll { it.url == url }
                  writeEntries("bookmarks", l)
              }
          }
