                  modifier = Modifier
                      .background(Field, RoundedCornerShape(6.dp))
                      .padding(horizontal = 8.dp, vertical = 3.dp)
              )
          }

          @Composable
          fun EditorScreen(id: String?, onBack: () -> Unit) {
              val scope = rememberCoroutineScope()
              val existing = remember { if (id == null) null else Store.load().firstOrNull { it.id == id } }
              var curId by remember { mutableStateOf(existing?.id) }
              var code by remember { mutableStateOf(existing?.code ?: NEW_TEMPLATE) }
              var enabled by remember { mutableStateOf(existing?.enabled ?: true) }
              var srcUrl by remember { mutableStateOf(existing?.sourceUrl ?: "") }
              var remoteVer by remember { mutableStateOf(existing?.remoteVersion ?: "") }
              var savedCode by remember { mutableStateOf(existing?.code ?: NEW_TEMPLATE) }
              var savedEnabled by remember { mutableStateOf(existing?.enabled ?: true) }
              var savedSrc by remember { mutableStateOf(existing?.sourceUrl ?: "") }
              var status by remember { mutableStateOf("") }
              var showDiscard by remember { mutableStateOf(false) }
              var showDelete by remember { mutableStateOf(false) }
              val meta = remember(code) { parseMeta(code) }
              val dirty = code != savedCode || enabled != savedEnabled || srcUrl != savedSrc

              BackHandler(dirty) { showDiscard = true }

              fun save() {
                  val list = Store.load()
                  val sid = curId
                  val target = if (sid == null) null else list.firstOrNull { it.id == sid }
                  if (target == null) {
                      val s = Script(sid ?: Store.newId(), code, enabled, srcUrl, remoteVer)
                      list.add(s)
                      curId = s.id
                  } else {
                      target.code = code
                      target.enabled = enabled
                      target.sourceUrl = srcUrl
                      target.remoteVersion = remoteVer
                  }
                  Store.save(list)
                  savedCode = code
                  savedEnabled = enabled
                  savedSrc = srcUrl
                  status = "Saved. Reload the page to run it."
              }

              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.fillMaxWidth().background(Bar).padding(horizontal = 4.dp, vertical = 6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      TextButton(onClick = { if (dirty) showDiscard = true else onBack() }) {
                          Text("←", color = Color.White, fontSize = 20.sp)
                      }
                      Text(
                          if (curId == null) "New script" else "Edit script",
                          color = Color.White,
                          fontSize = 18.sp,
                          modifier = Modifier.weight(1f)
                      )
                      Button(onClick = { save() }) { Text("Save") }
                      Spacer(Modifier.width(6.dp))
                  }
                  Column(
                      Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(12.dp)
                  ) {
                      Text("Parsed from header", color = Color(0xFF888888), fontSize = 11.sp)
                      Spacer(Modifier.height(6.dp))
                      Row(Modifier.horizontalScroll(rememberScrollState())) {
                          InfoChip(meta.name)
                          if (meta.version.isNotBlank()) { Spacer(Modifier.width(6.dp)); InfoChip("v" + meta.version) }
                          Spacer(Modifier.width(6.dp))
                          InfoChip((meta.matches.size + meta.includes.size).toString() + " match")
                          Spacer(Modifier.width(6.dp))
                          InfoChip("run-at " + meta.runAt.removePrefix("document-"))
                          if (meta.excludes.isNotEmpty()) { Spacer(Modifier.width(6.dp)); InfoChip(meta.excludes.size.toString() + " exclude") }
                          if (meta.requires.isNotEmpty()) { Spacer(Modifier.width(6.dp)); InfoChip(meta.requires.size.toString() + " require") }
                      }
                      if (meta.matches.isEmpty() && meta.includes.isEmpty()) {
                          Text(
                              "No @match or @include: this script will never run.",
                              color = Danger,
                              fontSize = 12.sp,
                              modifier = Modifier.padding(top = 6.dp)
                          )
                      }
                      Spacer(Modifier.height(10.dp))
                      OutlinedTextField(
                          value = code,
                          onValueChange = { code = it },
                          modifier = Modifier.fillMaxWidth(),
                          minLines = 12,
                          textStyle = TextStyle(fontFamily = FontFamily.Monospace, fontSize = 12.sp, color = Color.White),
                          colors = fieldColors()
                      )
                      Spacer(Modifier.height(10.dp))
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("Enabled", color = Color.White, modifier = Modifier.weight(1f))
                          Switch(checked = enabled, onCheckedChange = { enabled = it }, colors = switchColors())
                      }
                      Spacer(Modifier.height(10.dp))
                      Text("Update URL (used if the header has no @updateURL or @downloadURL)", color = Color(0xFF888888), fontSize = 11.sp)
                      Spacer(Modifier.height(6.dp))
                      OutlinedTextField(
                          value = srcUrl,
                          onValueChange = { srcUrl = it },
                          modifier = Modifier.fillMaxWidth(),
                          singleLine = true,
                          textStyle = TextStyle(fontFamily = FontFamily.Monospace, fontSize = 12.sp, color = Color.White),
                          colors = fieldColors()
                      )
                      Spacer(Modifier.height(8.dp))
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Button(onClick = {
                              val u = checkUrlFor(meta, srcUrl)
                              if (u.isBlank()) {
                                  status = "Add an update URL first"
                              } else {
                                  status = "Checking…"
                                  scope.launch {
                                      val r = withContext(Dispatchers.IO) {
                                          try { httpGet(u) } catch (e: Exception) { "ERR:" + e.message }
                                      }
                                      if (r.startsWith("ERR:")) {
                                          status = r.substring(4)
                                      } else {
                                          val rv = parseMeta(r).version
                                          if (rv.isNotBlank() && compareVersions(rv, meta.version) > 0) {
                                              remoteVer = rv
                                              status = "Update " + rv + " available"
                                          } else {
                                              remoteVer = ""
                                              status = "Up to date"
                                          }
                                      }
                                  }
                              }
                          }) { Text("Check") }
                          if (remoteVer.isNotBlank()) {
                              Spacer(Modifier.width(8.dp))
                              Button(onClick = {
                                  val u = applyUrlFor(meta, srcUrl)
                                  if (u.isBlank()) {
                                      status = "No update URL"
                                  } else {
                                      status = "Downloading…"
                                      scope.launch {
                                          val r = withContext(Dispatchers.IO) {
                                              try { httpGet(u) } catch (e: Exception) { "ERR:" + e.message }
                                          }
                                          if (r.startsWith("ERR:")) {
                                              status = r.substring(4)
                                          } else if (!r.contains("==UserScript==")) {
                                              status = "Downloaded file has no script header"
                                          } else {
                                              code = r
                                              remoteVer = ""
                                              save()
                                              status = "Updated to v" + parseMeta(r).version
                                          }
                                      }
                                  }
                              }) { Text("Update to v" + remoteVer) }
                          }
                      }
                      if (status.isNotBlank()) {
                          Text(status, color = Soft, fontSize = 12.sp, modifier = Modifier.padding(top = 8.dp))
                      }
                      if (curId != null) {
                          Text(
                              "Delete script",
                              color = Danger,
                              fontSize = 14.sp,
                              modifier = Modifier
                                  .padding(top = 20.dp, bottom = 12.dp)
                                  .clickable { showDelete = true }
                          )
                      }
                  }
              }
              if (showDiscard) {
                  AlertDialog(
                      onDismissRequest = { showDiscard = false },
                      containerColor = Bar,
                      title = { Text("Discard changes?", color = Color.White) },
                      text = { Text("You have unsaved changes.", color = Soft) },
                      confirmButton = {
                          TextButton(onClick = { showDiscard = false; onBack() }) { Text("Discard", color = Danger) }
                      },
                      dismissButton = {
                          TextButton(onClick = { showDiscard = false }) { Text("Keep editing", color = Color.White) }
                      }
                  )
              }
              if (showDelete) {
                  AlertDialog(
                      onDismissRequest = { showDelete = false },
                      containerColor = Bar,
                      title = { Text("Delete script?", color = Color.White) },
                      text = { Text(meta.name, color = Soft) },
                      confirmButton = {
                          TextButton(onClick = {
                              showDelete = false
                              val sid = curId
                              if (sid != null) Store.remove(sid)
                              onBack()
                          }) { Text("Delete", color = Danger) }
                      },
                      dismissButton = {
                          TextButton(onClick = { showDelete = false }) { Text("Cancel", color = Color.White) }
                      }
                  )
              }
          }

          @Composable
          fun GuideScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              var copied by remember { mutableStateOf(false) }
              LaunchedEffect(copied) {
                  if (copied) {
                      delay(1500)
                      copied = false
                  }
              }
              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.fillMaxWidth().background(Bar).padding(horizontal = 4.dp, vertical = 6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Script guide", color = Color.White, fontSize = 18.sp, modifier = Modifier.weight(1f))
                      Button(onClick = {
                          val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("GreyGecko script guide", GUIDE))
                          copied = true
                      }) { Text(if (copied) "Copied" else "Copy for AI") }
                      Spacer(Modifier.width(6.dp))
                  }
                  Column(Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(12.dp)) {
                      Text(
                          "Copy this and paste it into your AI chat, then describe the script you want.",
                          color = Color(0xFFBBBBBB),
                          fontSize = 13.sp
                      )
                      Spacer(Modifier.height(10.dp))
                      SelectionContainer {
                          Text(GUIDE, color = Color.White, fontFamily = FontFamily.Monospace, fontSize = 11.5.sp)
                      }
                  }
              }
          }

          @Composable
          fun LogScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var raw by remember { mutableStateOf("Loading...") }
              var filter by remember { mutableStateOf("GreyScript") }
              val scroll = rememberScrollState()

              fun refresh() {
                  scope.launch { raw = withContext(Dispatchers.IO) { readLogcat() } }
              }
              LaunchedEffect(Unit) { refresh() }

              val shown = remember(raw, filter) {
                  raw.lines().filter { filter.isBlank() || it.contains(filter, true) }.joinToString("\n")
              }
              LaunchedEffect(shown) {
                  delay(150)
                  scroll.scrollTo(scroll.maxValue)
              }

              Column(Modifier.fillMaxSize().padding(10.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Spacer(Modifier.weight(1f))
                      Button(onClick = { refresh() }) { Text("Refresh") }
                      Spacer(Modifier.width(8.dp))
                      Button(onClick = {
                          val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("logcat", shown))
                      }) { Text("Copy") }
                  }
                  OutlinedTextField(
                      value = filter,
                      onValueChange = { filter = it },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true,
                      placeholder = { Text("Filter (e.g. GreyScript)", color = Color(0xFF999999)) },
                      colors = fieldColors()
                  )
                  Spacer(Modifier.height(6.dp))
                  Box(
                      Modifier
                          .fillMaxSize()
                          .background(Field)
                          .padding(6.dp)
                          .verticalScroll(scroll)
                  ) {
                      SelectionContainer {
                          Text(
                              shown,
                              color = Color.White,
                              fontFamily = FontFamily.Monospace,
                              fontSize = 11.sp
                          )
                      }
                  }
              }
          }
          EOF

      - name: Build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/test.jks
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GreyGecko
          path: app/build/outputs/apk/release/*.apk
