          package com.grey.gecko

          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.util.Log
          import java.io.File
          import java.nio.ByteBuffer

          // Keeps timestamps continuous. A jump or wrap in the source (common when HLS segments are joined)
          // must not stretch the file (for example 16 minutes showing as 54 hours).
          class Retimer(private val base: Long) {
              private var first = true
              private var lastIn = 0L
              private var lastOut = 0L
              private var delta = 33333L

              fun map(tm: Long): Long {
                  if (first) {
                      first = false
                      lastIn = tm
                      lastOut = if (tm - base < 0L) 0L else tm - base
                      return lastOut
                  }
                  val diff = tm - lastIn
                  val out = if (diff < -1000000L || diff > 5000000L) lastOut + delta else lastOut + diff
                  if (diff > 0L && diff <= 200000L) delta = diff
                  lastIn = tm
                  lastOut = if (out < 0L) 0L else out
                  return lastOut
              }
          }

          private class Pend(val ex: MediaExtractor, val rt: Retimer) {
              val buf: ByteBuffer = ByteBuffer.allocate(4 * 1024 * 1024)
              var size = 0
              var time = 0L
              var flags = 0
              var ended = false

              fun load() {
                  buf.clear()
                  val s = ex.readSampleData(buf, 0)
                  if (s < 0) {
                      ended = true
                      return
                  }
                  size = s
                  flags = if ((ex.sampleFlags and MediaExtractor.SAMPLE_FLAG_SYNC) != 0) MediaCodec.BUFFER_FLAG_KEY_FRAME else 0
                  time = rt.map(ex.sampleTime)
                  ex.advance()
              }
          }

          object Mux {
              // "video", "audio", "av" or "" when the file can't be read
              fun probe(f: File): String {
                  val ex = MediaExtractor()
                  return try {
                      ex.setDataSource(f.path)
                      var v = false
                      var a = false
                      for (i in 0 until ex.trackCount) {
                          val m = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: ""
                          if (m.startsWith("video/")) v = true
                          if (m.startsWith("audio/")) a = true
                      }
                      if (v && a) "av" else if (v) "video" else if (a) "audio" else ""
                  } catch (e: Exception) {
                      ""
                  } finally {
                      ex.release()
                  }
              }

              // true when the file has an audio track, or when it can't be inspected (then we don't try to merge)
              fun hasAudio(f: File): Boolean {
                  val p = probe(f)
                  return p == "av" || p == "audio" || p == ""
              }

              private fun findTrack(ex: MediaExtractor, prefix: String): Int {
                  for (i in 0 until ex.trackCount) {
                      val m = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: ""
                      if (m.startsWith(prefix)) return i
                  }
                  return -1
              }

              // Copies all video and audio tracks of src into a standard MP4 (no re-encoding).
              fun remux(src: File, out: File): Boolean {
                  val ex = MediaExtractor()
                  var mux: MediaMuxer? = null
                  var started = false
                  return try {
                      ex.setDataSource(src.path)
                      val m = MediaMuxer(out.path, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      mux = m
                      val map = HashMap<Int, Int>()
                      for (i in 0 until ex.trackCount) {
                          val f = ex.getTrackFormat(i)
                          val mime = f.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("video/") || mime.startsWith("audio/")) {
                              ex.selectTrack(i)
                              map[i] = m.addTrack(f)
                          }
                      }
                      if (map.isEmpty()) {
                          false
                      } else {
                          m.start()
                          started = true
                          val buf = ByteBuffer.allocate(4 * 1024 * 1024)
                          val info = MediaCodec.BufferInfo()
                          val rts = HashMap<Int, Retimer>()
                          var base = -1L
                          while (true) {
                              val idx = ex.sampleTrackIndex
                              if (idx < 0) break
                              buf.clear()
                              val size = ex.readSampleData(buf, 0)
                              if (size < 0) break
                              val tm = ex.sampleTime
                              if (base < 0L) base = tm
                              val track = map[idx]
                              if (track != null) {
                                  val rt = rts.getOrPut(idx) { Retimer(base) }
                                  val flags = if ((ex.sampleFlags and MediaExtractor.SAMPLE_FLAG_SYNC) != 0) MediaCodec.BUFFER_FLAG_KEY_FRAME else 0
                                  info.set(0, size, rt.map(tm), flags)
                                  m.writeSampleData(track, buf, info)
                              }
                              ex.advance()
                          }
                          true
                      }
                  } catch (e: Exception) {
                      Log.e("GreyScript", "remux failed", e)
                      false
                  } finally {
                      try {
                          if (started) mux?.stop()
                      } catch (e: Exception) {
                      }
                      try {
                          mux?.release()
                      } catch (e: Exception) {
                      }
                      ex.release()
                  }
              }

              private fun trackOf(ex: MediaExtractor, prefix: String): Int = findTrack(ex, prefix)

              // Copies the first video track of v and the first audio track of a into one MP4 (no re-encoding).
              fun merge(v: File, a: File, out: File): Boolean {
                  val ve = MediaExtractor()
                  val ae = MediaExtractor()
                  var mux: MediaMuxer? = null
                  var started = false
                  return try {
                      ve.setDataSource(v.path)
                      ae.setDataSource(a.path)
                      val vt = trackOf(ve, "video/")
                      val at = trackOf(ae, "audio/")
                      if (vt < 0 || at < 0) {
                          false
                      } else {
                          ve.selectTrack(vt)
                          ae.selectTrack(at)
                          val vt0 = ve.sampleTime
                          val at0 = ae.sampleTime
                          val base = if (vt0 >= 0L && at0 >= 0L) minOf(vt0, at0) else maxOf(vt0, at0, 0L)
                          val m = MediaMuxer(out.path, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                          mux = m
                          val vi = m.addTrack(ve.getTrackFormat(vt))
                          val ai = m.addTrack(ae.getTrackFormat(at))
                          m.start()
                          started = true
                          val vp = Pend(ve, Retimer(base))
                          val ap = Pend(ae, Retimer(base))
                          vp.load()
                          ap.load()
                          val info = MediaCodec.BufferInfo()
                          while (!vp.ended || !ap.ended) {
                              val useV = ap.ended || (!vp.ended && vp.time <= ap.time)
                              val p = if (useV) vp else ap
                              info.set(0, p.size, p.time, p.flags)
                              m.writeSampleData(if (useV) vi else ai, p.buf, info)
                              p.load()
                          }
                          true
                      }
                  } catch (e: Exception) {
                      Log.e("GreyScript", "merge failed", e)
                      false
                  } finally {
                      try {
                          if (started) mux?.stop()
                      } catch (e: Exception) {
                      }
                      try {
                          mux?.release()
                      } catch (e: Exception) {
                      }
                      ve.release()
                      ae.release()
                  }
              }
          }
