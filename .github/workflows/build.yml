              private val delegate = object : WebExtension.MessageDelegate {
                  override fun onConnect(port: WebExtension.Port) {
                      HideTool.port = port
                      port.setDelegate(object : WebExtension.PortDelegate {
                          override fun onPortMessage(message: Any, port: WebExtension.Port) {}

                          override fun onDisconnect(port: WebExtension.Port) {
                              if (HideTool.port === port) HideTool.port = null
                          }
                      })
                  }
                  override fun onMessage(
                      nativeApp: String,
                      message: Any,
                      sender: WebExtension.MessageSender
                  ): GeckoResult<Any>? {
                      val reply = JSONObject()
                      try {
                          val m = message as JSONObject
                          when (m.optString("type")) {
                              "log" -> Log.d("GreyScript", "ext: " + m.optString("msg"))
                              "get" -> {
                                  val url = m.optString("url")
                                  val tid = m.optInt("tabId", -1)
                                  if (tid >= 0) Videos.bind(tid, url)
                                  val arr = JSONArray()
                                  for (s in Store.load()) {
                                      if (!s.enabled) continue
                                      val meta = parseMeta(s.code)
                                      if (!applies(meta, url)) continue
                                      val o = JSONObject()
                                      o.put("id", s.id)
                                      o.put("name", meta.name)
                                      o.put("version", meta.version)
                                      o.put("namespace", meta.namespace)
                                      o.put("description", meta.description)
                                      o.put("runAt", meta.runAt)
                                      o.put("code", s.code)
                                      o.put("requires", JSONArray(meta.requires))
                                      o.put("grants", JSONArray(meta.grants))
                                      o.put("matches", JSONArray(meta.matches + meta.includes))
                                      o.put("values", Store.values(s.id))
                                      arr.put(o)
                                  }
                                  reply.put("scripts", arr)
                                  reply.put("grabber", Videos.enabled)
                                  reply.put("adv", Filters.ver)
                                  val hostName = try { android.net.Uri.parse(url).host ?: "" } catch (e: Exception) { "" }
                                  reply.put("hide", JSONArray(HideRules.forHost(hostName)))
                                  Log.d("GreyScript", "scripts for " + url + ": " + arr.length())
                              }
                              "cfg" -> reply.put("grabber", Videos.enabled)
                              "adcfg" -> {
                                  reply.put("on", Filters.isOn())
                                  reply.put("cos", Filters.cosOn())
                                  reply.put("ver", Filters.ver)
                              }
                              "rules" -> {
                                  val all = Filters.combined()
                                  val ch = Filters.chunk(all, m.optInt("off", 0))
                                  reply.put("text", ch.first)
                                  reply.put("next", ch.second)
                                  if (ch.second < 0) Filters.dropCache()
                              }
                              "adstat" -> {
                                  Filters.blocked = m.optInt("n")
                              }
                              "pickstate" -> {
                                  HideTool.onState(m.optBoolean("has"), m.optString("desc"), m.optBoolean("previewing"), m.optString("note"))
                              }
                              "hidesave" -> {
                                  HideRules.add(m.optString("host"), m.optString("sel"))
                              }
                              "hidereset" -> {
                                  HideRules.clear(m.optString("host"))
                              }
                              "adinfo" -> {
                                  Filters.loadedNet = m.optInt("n")
                                  Filters.loadedCos = m.optInt("c")
                              }
                              "video" -> {
                                  reply.put("grabber", Videos.enabled)
                                  if (Videos.enabled) {
                                      val hd = HashMap<String, String>()
                                      val ho = m.optJSONObject("headers")
                                      if (ho != null) {
                                          for (k in ho.keys()) hd[k] = ho.optString(k)
                                      }
                                      Videos.onDetected(
                                          m.optInt("tabId", -1),
                                          m.optString("url"),
                                          m.optString("ctype"),
                                          m.optLong("size", -1L),
                                          hd
                                      )
                                  }
                              }
                              "setValue" -> Store.setValue(m.optString("sid"), m.optString("key"), m.optString("value"))
                              "deleteValue" -> Store.deleteValue(m.optString("sid"), m.optString("key"))
                          }
                      } catch (e: Exception) {
                          Log.e("GreyScript", "delegate error", e)
                      }
                      return GeckoResult.fromValue<Any>(reply.toString())
                  }
              }

              @Synchronized
              fun runtime(ctx: Context): GeckoRuntime {
                  rt?.let { return it }
                  appCtx = ctx.applicationContext
                  val cfg = java.io.File(appCtx.filesDir, "gecko-config.yaml")
                  try {
                      cfg.writeText("prefs:\n  ui.click_hold_context_menus.delay: 350\n")
                  } catch (e: Exception) {
                      Log.e("GreyScript", "config write failed", e)
                  }
                  val settings = GeckoRuntimeSettings.Builder()
                      .configFilePath(cfg.absolutePath)
                      .build()
                  val r = GeckoRuntime.create(appCtx, settings)
                  rt = r
                  r.webExtensionController
                      .ensureBuiltIn("resource://android/assets/ext/", "scripts@grey.gecko")
                      .accept(
                          { ext ->
                              if (ext != null) {
                                  ext.setMessageDelegate(delegate, "browser")
                                  Log.d("GreyScript", "extension installed: " + ext.id)
                              } else {
                                  Log.e("GreyScript", "extension install returned null")
                              }
                          },
                          { e -> Log.e("GreyScript", "extension install failed", e) }
                      )
                  return r
              }
          }

