          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun BrowserScreen(
              tabs: TabManager,
              active: Boolean,
              startEdit: Boolean,
              onEditStarted: () -> Unit,
              onTabs: () -> Unit,
              onHistory: () -> Unit,
              onBookmarks: () -> Unit,
              onScripts: () -> Unit,
              onFilters: () -> Unit,
              onElements: () -> Unit,
              onDownloads: () -> Unit,
              onLogs: () -> Unit
          ) {
              val cur = tabs.current
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var menu by remember { mutableStateOf(false) }
              var editing by remember { mutableStateOf(false) }
              var text by remember { mutableStateOf(TextFieldValue("")) }
              var grabberOn by remember { mutableStateOf(Videos.enabled) }
              var blockImg by remember { mutableStateOf(Saver.images()) }
              var blockPlay by remember { mutableStateOf(Saver.autoplay()) }
              var blockAudio by remember { mutableStateOf(Saver.mute()) }
              var panelOpen by remember { mutableStateOf(false) }
              var lastSubmit by remember { mutableStateOf(0L) }
              val focusManager = LocalFocusManager.current
              val vids = cur?.videos
              val cm = tabs.ctxMenu
              val hostView = LocalView.current
              val density = LocalDensity.current
              val pullTrigger = with(density) { 80.dp.toPx() }
              var pull by remember { mutableStateOf(0f) }


              LaunchedEffect(cur?.id, tabs.home) {
                  if (HideTool.active && (tabs.home || cur?.id != HideTool.tabId)) HideTool.stop()
              }
              val bmRev = BookmarkStore.rev
              val curUrl = cur?.url ?: ""
              val marked = remember(bmRev, curUrl) {
                  curUrl.isNotBlank() && curUrl != "about:blank" &&
                      BookmarkStore.load().any { normUrl(it.url) == normUrl(curUrl) }
              }

              LaunchedEffect(active) {
                  if (!active) {
                      editing = false
                      focusManager.clearFocus(true)
                      if (HideTool.active) HideTool.stop()
                      val imm = ctx.getSystemService(Context.INPUT_METHOD_SERVICE) as android.view.inputmethod.InputMethodManager
                      imm.hideSoftInputFromWindow(hostView.windowToken, 0)
                  }
              }

              LaunchedEffect(cur, vids?.isEmpty()) {
                  if (vids == null || vids.isEmpty()) panelOpen = false
              }

              LaunchedEffect(startEdit) {
                  if (startEdit) {
                      text = TextFieldValue("")
                      editing = true
                      onEditStarted()
                  }
              }

              BackHandler(active) {
                  val c = tabs.current
                  if (tabs.fullscreen) {
                      tabs.exitFullscreen()
                  } else if (editing) {
                      editing = false
                      focusManager.clearFocus()
                  } else if (HideTool.active) {
                      HideTool.stop()
                  } else if (panelOpen) {
                  panelOpen = false
                  } else if (tabs.home) {
                  ctx.findActivity()?.moveTaskToBack(true)
                  } else if (c != null && c.canGoBack) {
                      c.session?.goBack()
                  } else if (c != null && tabs.openerOf(c) != null) {
                  tabs.closeToOpener(c)
                  } else if (c != null && c.preview) {
                  tabs.close(c)
                  } else {
                  tabs.home = true
                  }
              }

              fun submit(raw: String) {
                  val now = System.currentTimeMillis()
                  if (now - lastSubmit < 600) return
                  lastSubmit = now
                  val t = tabs.current
                  if (raw.isNotBlank()) {
                      if (tabs.home || t == null) tabs.newTab(normalize(raw), true) else tabs.load(t, normalize(raw))
                  }
                  scope.launch {
                      delay(300)
                      editing = false
                      focusManager.clearFocus()
                  }
              }

              Box(Modifier.fillMaxSize()) {
                  Column(Modifier.fillMaxSize()) {
                      Row(
                          Modifier
                              .fillMaxWidth()
                              .height(if (tabs.fullscreen) 0.dp else HeaderH)
                              .clipToBounds()
                              .background(Bar)
                              .padding(horizontal = 8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(
                              Modifier
                                  .size(44.dp)
                                  .clip(RoundedCornerShape(10.dp))
                                  .background(Field)
                                  .clickable {
                                      cur?.let { tabs.capture(it) }
                                      onTabs()
                                  },
                              contentAlignment = Alignment.Center
                          ) {
                              Box(
                                  Modifier
                                      .size(22.dp)
                                      .border(2.dp, Color.White, RoundedCornerShape(6.dp)),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(tabs.tabs.count { !it.preview }.toString(), color = Color.White, fontSize = 12.sp)
                              }
                          }
                          Spacer(Modifier.width(8.dp))
                          UrlBar(
                          tab = if (tabs.home) null else cur,
                              editing = editing,
                              text = text,
                              onText = { text = it },
                              onStart = {
                                  val u = if (tabs.home) "" else shownUrl(tabs.current)
                                  text = TextFieldValue(u, TextRange(0, u.length))
                                  editing = true
                              },
                              onFocusLost = { editing = false },
                              onSubmit = { submit(text.text) },
                              modifier = Modifier.weight(1f)
                          )
                          if (editing) {
                              Spacer(Modifier.width(6.dp))
                              Button(onClick = { submit(text.text) }) { Text("Go") }
                          } else if (!tabs.home && cur?.loading == true) {
                              Spacer(Modifier.width(6.dp))
                              Button(onClick = { cur?.session?.stop() }) { Text("×", fontSize = 20.sp) }
                          }
                          Box {
                              TextButton(onClick = { menu = true }) {
                                  Text("⋮", fontSize = 24.sp, color = Color.White)
                              }
                              DropdownMenu(
                                  expanded = menu,
                                  onDismissRequest = { menu = false },
                                  modifier = Modifier.background(Bar)
                              ) {
                                  DropdownMenuItem(
                                      text = { Text("Video grabber", color = Color.White) },
                                      trailingIcon = {
                                          Switch(
                                              checked = grabberOn,
                                              onCheckedChange = { v ->
                                                  grabberOn = v
                                                  Videos.setGrabber(v)
                                              },
                                              colors = switchColors()
                                          )
                                      },
                                      onClick = {
                                          grabberOn = !grabberOn
                                          Videos.setGrabber(grabberOn)
                                      }
                                  )

                                  DropdownMenuItem(
                                      text = { Text("Block images", color = Color.White) },
                                      trailingIcon = {
                                          Switch(
                                              checked = blockImg,
                                              onCheckedChange = { v ->
                                                  blockImg = v
                                                  Saver.setImages(v)
                                                  toast(ctx, "Reload the page")
                                              },
                                              colors = switchColors()
                                          )
                                      },
                                      onClick = {
                                          blockImg = !blockImg
                                          Saver.setImages(blockImg)
                                          toast(ctx, "Reload the page")
                                      }
                                  )
                                  DropdownMenuItem(
                                      text = { Text("Block video autoplay", color = Color.White) },
                                      trailingIcon = {
                                          Switch(
                                              checked = blockPlay,
                                              onCheckedChange = { v ->
                                                  blockPlay = v
                                                  Saver.setAutoplay(v)
                                                  toast(ctx, "Restart the app to apply")
                                              },
                                              colors = switchColors()
                                          )
                                      },
                                      onClick = {
                                          blockPlay = !blockPlay
                                          Saver.setAutoplay(blockPlay)
                                          toast(ctx, "Restart the app to apply")
                                      }
                                  )
                                  DropdownMenuItem(
                                      text = { Text("Block audio", color = Color.White) },
                                      trailingIcon = {
                                          Switch(
                                              checked = blockAudio,
                                              onCheckedChange = { v ->
                                                  blockAudio = v
                                                  Saver.setMute(v, tabs)
                                              },
                                              colors = switchColors()
                                          )
                                      },
                                      onClick = {
                                          blockAudio = !blockAudio
                                          Saver.setMute(blockAudio, tabs)
                                      }
                                  )
                                  DropdownMenuItem(
                                  text = { Text(if (marked) "Remove bookmark" else "Add to bookmark", color = Color.White) },
                                      onClick = {
                                          menu = false
                                          val t = tabs.current
                                          val u = shownUrl(t)
                                          if (!tabs.home && t != null && u.isNotBlank()) {
                                              val ex = BookmarkStore.load().firstOrNull { normUrl(it.url) == normUrl(u) }
                                              if (ex != null) {
                                                  BookmarkStore.remove(ex.url)
                                                  toast(ctx, "Bookmark removed")
                                              } else {
                                                  BookmarkStore.add(u, t.title.ifBlank { u })
                                                  toast(ctx, "Bookmark added")
                                              }
                                          } else {
                                              toast(ctx, "Nothing to bookmark")
                                          }
                                      }
                                  )
                                  DropdownMenuItem(
                                      text = { Text("History", color = Color.White) },
                                      onClick = { menu = false; onHistory() }
                                  )
                                  DropdownMenuItem(
                                      text = { Text("Bookmarks", color = Color.White) },
                                      onClick = { menu = false; onBookmarks() }
                                  )
                                  DropdownMenuItem(
                                      text = { Text("Scripts", color = Color.White) },
                                      onClick = { menu = false; onScripts() }
                                  )
                                  DropdownMenuItem(
                                      text = { Text("Ad filters", color = Color.White) },
                                      onClick = { menu = false; onFilters() }
                                  )
                                  DropdownMenuItem(
                                      text = { Text("Hide element", color = Color.White) },
                                      onClick = {
                                          menu = false
                                          val t = tabs.current
                                          if (tabs.home || t == null) {
                                              toast(ctx, "Open a page first")
                                          } else if (!HideTool.begin(t)) {
                                              toast(ctx, "Tool not ready. Reload the page and try again")
                                          }
                                      }
                                  )
                                  DropdownMenuItem(
                                      text = { Text("Element rules", color = Color.White) },
                                      onClick = { menu = false; onElements() }
                                  )
                                  DropdownMenuItem(
                                      text = { Text("Downloads", color = Color.White) },
                                      onClick = { menu = false; onDownloads() }
                                  )


                                  DropdownMenuItem(
                                      text = { Text("Logcat", color = Color.White) },
                                      onClick = { menu = false; onLogs() }
                                  )
                              }
                          }
                      }
                      if (!tabs.home && marked && !tabs.fullscreen) {
                          Box(
                              Modifier
                                  .fillMaxWidth()
                                  .height(12.dp)
                                  .background(Color.White)
                                  .clipToBounds(),
                                  contentAlignment = Alignment.Center
                          ) {
                              Text(
                                  "Bookmarked",
                                  color = Color.Black,
                                  fontSize = 9.sp,
                                  lineHeight = 12.sp,
                                  fontWeight = FontWeight.Bold,
                                  maxLines = 1
                              )
                          }
                          Box(Modifier.fillMaxWidth().height(1.dp).background(Color(0xFF555555)))
                      }
                      Box(
                          Modifier
                              .weight(1f)
                              .fillMaxWidth()
                              .pointerInput(Unit) {
                                  awaitPointerEventScope {
                                      while (true) {
                                          val down = awaitFirstDown(requireUnconsumed = false, pass = PointerEventPass.Initial)
                                          val c0 = tabs.current
                                          var armed = !tabs.home && !HideTool.active && c0 != null && c0.session != null && c0.scrollY == 0
                                          val startX = down.position.x
                                          val startY = down.position.y
                                          var dy = 0f
                                          while (true) {
                                              val ev = awaitPointerEvent(PointerEventPass.Initial)
                                              if (ev.changes.size > 1) armed = false
                                              val ch = ev.changes.firstOrNull { it.id == down.id } ?: break
                                              if (!ch.pressed) {
                                                  if (armed && dy >= pullTrigger) {
                                                      tabs.current?.let { tabs.reloadTab(it) }
                                                  }
                                                  break
                                              }
                                              val c1 = tabs.current
                                              if (c1 == null || c1.scrollY > 0) armed = false
                                              dy = ch.position.y - startY
                                              val dx = ch.position.x - startX
                                              if (armed && kotlin.math.abs(dx) > 40f && kotlin.math.abs(dx) > kotlin.math.abs(dy)) armed = false
                                              pull = if (armed && dy > 0f) minOf(dy, pullTrigger * 1.4f) else 0f
                                          }
                                          pull = 0f
                                      }
                                  }
                              }
                      ) {
                          AndroidView(
                              factory = { c -> GeckoView(c).also { tabs.view = it } },
                              update = { v ->
                                  val s = cur?.session
                                  if (s != null) {
                                      if (v.session !== s) v.setSession(s)
                                  } else if (v.session != null) {
                                      v.releaseSession()
                                  }
                              },
                              onRelease = { v ->
                                  if (tabs.view === v) tabs.view = null
                                  v.releaseSession()
                              },
                              modifier = Modifier.fillMaxSize()
                          )
                          if (tabs.home) {
                              HomeScreen(Modifier.fillMaxSize())
                              }
                              if (pull > 0f) {
                                  val prog = (pull / pullTrigger).coerceIn(0f, 1f)
                                  Box(
                                      Modifier
                                          .align(Alignment.TopCenter)
                                          .offset { IntOffset(0, (pull * 0.4f).toInt()) }
                                          .size(36.dp)
                                          .clip(CircleShape)
                                          .background(Bar)
                                          .border(0.5.dp, Color(0xFF555555), CircleShape),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      CircularProgressIndicator(
                                          progress = { prog },
                                          modifier = Modifier.size(20.dp),
                                          color = if (prog >= 1f) TmGreen else Color.White,
                                          strokeWidth = 2.dp
                                      )
                                  }
                              }
                              }
                  }
                  val previewCur = cur
                  if (previewCur != null && previewCur.preview && !tabs.home && !tabs.fullscreen) {
                      PreviewHeader(tabs, previewCur, Modifier.align(Alignment.TopStart))
                  }
                  if (HideTool.active && !tabs.home && !tabs.fullscreen) {
                      HideToolPanel()
                  }
                  if (!tabs.home && !tabs.fullscreen && grabberOn && vids != null && vids.isNotEmpty()) {
                      VideoPanel(
                          videos = vids,
                          title = cur?.title ?: "",
                          open = panelOpen,
                          onToggle = { panelOpen = !panelOpen },
                          modifier = Modifier.align(Alignment.CenterEnd)
                      )
                  }
              }

              if (cm != null) {
                  AlertDialog(
                      onDismissRequest = { tabs.ctxMenu = null },
                      containerColor = Bar,
                      title = {
                          Text(
                              cm.url,
                              color = Soft,
                              fontSize = 12.sp,
                              maxLines = 1,
                              softWrap = false,
                              modifier = Modifier.basicMarquee(iterations = Int.MAX_VALUE)
                          )
                      },
                      text = {
                          Column {
                              MenuRow("Open in new tab") {
                                  tabs.ctxMenu = null
                                  tabs.newTab(cm.url, true, tabs.current?.id ?: 0)
                              }
                              MenuRow("Open in Background") {
                                  tabs.ctxMenu = null
                                  tabs.newTab(cm.url, false, tabs.current?.id ?: 0)
                                  toast(ctx, "Opened in background")
                              }
                              MenuRow("Preview") {
                                  tabs.ctxMenu = null
                                  tabs.openPreview(cm.url, tabs.current?.id ?: 0)
                              }
                              MenuRow("Download") {
                                  tabs.ctxMenu = null
                                  Downloads.enqueueUrl(cm.url, tabs.current?.url, null)
                                  toast(ctx, "Added to downloads")
                              }
                              MenuRow("Copy link") {
                                  tabs.ctxMenu = null
                                  copyText(ctx, cm.url)
                                  toast(ctx, "Link copied")
                              }
                          }
                      },
                      confirmButton = {}
                  )
              }
          }

          @Composable
          fun RowScope.ToolBtn(label: String, enabled: Boolean, highlight: Boolean = false, onClick: () -> Unit) {
              Button(
                  onClick = onClick,
                  enabled = enabled,
                  modifier = Modifier.weight(1f).height(34.dp),
                  shape = RoundedCornerShape(8.dp),
                  contentPadding = PaddingValues(horizontal = 2.dp),
                  colors = ButtonDefaults.buttonColors(
                      containerColor = if (highlight) Color.White else Btn,
                      contentColor = if (highlight) Color.Black else Color.White,
                      disabledContainerColor = Field,
                      disabledContentColor = Soft
                  )
              ) {
                  Text(label, fontSize = 12.sp, maxLines = 1)
              }
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun HideToolPanel() {
              val density = LocalDensity.current
              var ox by remember { mutableStateOf(Float.NaN) }
              var oy by remember { mutableStateOf(Float.NaN) }
              BoxWithConstraints(Modifier.fillMaxSize()) {
                  val maxW = constraints.maxWidth.toFloat()
                  val maxH = constraints.maxHeight.toFloat()
                  val pw = with(density) { 250.dp.toPx() }
                  val ph = with(density) { 140.dp.toPx() }
                  val gap = with(density) { 80.dp.toPx() }
                  LaunchedEffect(maxW, maxH) {
                      if (ox.isNaN()) {
                          ox = (maxW - pw) / 2f
                          oy = maxH - ph - gap
                      }
                  }
                  val x = if (ox.isNaN()) 0f else ox.coerceIn(0f, maxOf(0f, maxW - pw))
                  val y = if (oy.isNaN()) 0f else oy.coerceIn(0f, maxOf(0f, maxH - ph))
                  val shape = RoundedCornerShape(10.dp)
                  Column(
                      Modifier
                          .offset { IntOffset(x.toInt(), y.toInt()) }
                          .width(250.dp)
                          .clip(shape)
                          .background(Bar)
                          .border(0.5.dp, Color(0xFF666666), shape)
                          .pointerInput(Unit) { detectTapGestures { } }
                  ) {
                      Box(
                          Modifier
                              .fillMaxWidth()
                              .height(20.dp)
                              .background(Color.White)
                              .clipToBounds()
                              .pointerInput(Unit) {
                                  detectDragGestures { change, drag ->
                                      change.consume()
                                      val bx = if (ox.isNaN()) x else ox
                                      val by = if (oy.isNaN()) y else oy
                                      ox = (bx + drag.x).coerceIn(0f, maxOf(0f, maxW - pw))
                                      oy = (by + drag.y).coerceIn(0f, maxOf(0f, maxH - ph))
                                  }
                              },
                          contentAlignment = Alignment.CenterStart
                      ) {
                          Text(
                              "Hide element · drag this bar to move",
                              color = Color.Black,
                              fontSize = 10.sp,
                              lineHeight = 12.sp,
                              fontWeight = FontWeight.Bold,
                              maxLines = 1,
                              modifier = Modifier.padding(horizontal = 8.dp)
                          )
                      }
                      Column(Modifier.padding(8.dp)) {
                          Text(
                              if (HideTool.has) HideTool.desc else HideTool.note,
                              color = Color.White,
                              fontSize = 12.sp,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis,
                              modifier = Modifier.heightIn(min = 30.dp)
                          )
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              ToolBtn("Parent", HideTool.has) { HideTool.cmd("parent") }
                              ToolBtn("Child", HideTool.has) { HideTool.cmd("child") }
                              ToolBtn("Preview", HideTool.has, HideTool.previewing) { HideTool.cmd("preview") }
                          }
                          Spacer(Modifier.height(6.dp))
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              ToolBtn("Hide", HideTool.has) { HideTool.cmd("hide") }
                              ToolBtn(if (HideTool.pageScope) "For: Page" else "For: Site", true, HideTool.pageScope) {
                                  HideTool.pageScope = !HideTool.pageScope
                              }
                              ToolBtn("Close", true) { HideTool.stop() }
                          }
                      }
                  }
              }
          }

