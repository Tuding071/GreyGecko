              }

              fun lastCheck(): Long = sp().getLong("lastCheck", 0L)

              fun setLastCheck(t: Long) {
                  sp().edit().putLong("lastCheck", t).apply()
              }
          }

          object Updater {
              fun checkAll(): Int {
                  val found = HashMap<String, String>()
                  for (s in Store.load()) {
                      val m = parseMeta(s.code)
                      val u = checkUrlFor(m, s.sourceUrl)
                      if (u.isBlank()) continue
                      try {
                          val remote = parseMeta(httpGet(u)).version
                          if (remote.isNotBlank() && compareVersions(remote, m.version) > 0) {
                              found[s.id] = remote
                          } else {
                              found[s.id] = ""
                          }
                      } catch (e: Exception) {
                          Log.d("GreyScript", "update check failed: " + e)
                      }
                  }
                  val fresh = Store.load()
                  var n = 0
                  for (f in fresh) {
                      val r = found[f.id]
                      if (r != null) {
                          f.remoteVersion = r
                          if (r.isNotBlank()) n++
                      }
                  }
                  Store.save(fresh)
                  Store.setLastCheck(System.currentTimeMillis())
                  return n
              }

              fun applyAll(): Int {
                  val updates = HashMap<String, String>()
                  for (s in Store.load()) {
                      if (s.remoteVersion.isBlank()) continue
                      val u = applyUrlFor(parseMeta(s.code), s.sourceUrl)
                      if (u.isBlank()) continue
                      try {
                          val t = httpGet(u)
                          if (t.contains("==UserScript==")) updates[s.id] = t
                      } catch (e: Exception) {
                          Log.d("GreyScript", "update download failed: " + e)
                      }
                  }
                  val fresh = Store.load()
                  for (f in fresh) {
                      val t = updates[f.id]
                      if (t != null) {
                          f.code = t
                          f.remoteVersion = ""
                      }
                  }
                  Store.save(fresh)
                  return updates.size
              }

              fun autoCheck() {
                  if (System.currentTimeMillis() - Store.lastCheck() > 86400000L) {
                      try {
                          checkAll()
                      } catch (e: Exception) {
                          Log.d("GreyScript", "auto check failed: " + e)
                      }
                  }
              }
          }
