          const val GUIDE = """Write a userscript for the GreyGecko browser using this guide.
          Reply with ONE complete .user.js file in a single code block (header + code) and nothing else.

          ABOUT
          GreyGecko is an Android browser with the Firefox engine. Userscripts work like Tampermonkey scripts, but only the features listed here exist.

          HEADER (required, at the very top of the file)
          // ==UserScript==
          // @name         Short name
          // @namespace    greygecko
          // @version      1.0
          // @description  What it does
          // @match        *://*.example.com/*
          // @run-at       document-idle
          // @grant        GM_addStyle
          // ==/UserScript==

          HEADER KEYS
          @name, @namespace, @version, @description: informational.
          @match: URL pattern, repeatable. Form: scheme://host/path with * wildcards, for example *://*.example.com/* or https://example.com/page/*. You need at least one @match or @include, otherwise the script never runs.
          @include: glob (https://example.com/*) or a regex written between slashes. Repeatable.
          @exclude: same format as @include. The script does not run on matching URLs. Repeatable.
          @run-at: document-start, document-end or document-idle (default).
          @require: URL of a JS library that is loaded before the script. Repeatable.
          @grant: optional. Every GM function listed below is always available, even if not granted.
          @updateURL / @downloadURL: URL of the raw .user.js file, used for update checks. An update is offered only when @version is higher than the installed one.
          Ignored keys: @author, @icon, @connect, @noframes, @resource, @license, @unwrap.

          HOW IT RUNS
          - Only in the top page, not inside iframes. Once per page load (not on in-page navigation of single-page sites).
          - The script runs in an isolated world: it shares the page DOM (document, elements, events) but NOT the page's JavaScript variables. Use unsafeWindow.someGlobal to read page globals. Functions you define are not visible to the page's own scripts.
          - document-start means as early as possible, but page scripts may already have run. Do not rely on running before them. At document-start document.body may not exist yet: use document.documentElement or wait for DOMContentLoaded.
          - The code is wrapped in a function: top-level variables are private and a top-level return is allowed. There is no top-level await and no import/export. For async code use (async () => { ... })().
          - Errors thrown by the script and GM_log output go to the app Logcat (menu > Logcat, filter: GreyScript).

          AVAILABLE API
          GM_addStyle(css): injects CSS, returns the style element.
          GM_getValue(key, default): synchronous read from per-script persistent storage.
          GM_setValue(key, value): saves any JSON-serializable value.
          GM_deleteValue(key), GM_listValues().
          GM_xmlhttpRequest({method, url, headers, data, responseType, timeout, onload, onerror, ontimeout, onloadend}): cross-origin requests. data must be a string. responseType: text (default), json, arraybuffer, blob. Callbacks receive {status, statusText, response, responseText, responseHeaders, finalUrl}. Cookies are normally sent. The Referer and Origin headers cannot be changed.
          GM_setClipboard(text): best effort, may need a user tap.
          GM_openInTab(url): opens the URL; may be blocked by the popup blocker unless triggered by a tap.
          GM_log(...): writes to Logcat.
          GM_info: {script: {name, version, description, namespace, grant, matches}, scriptHandler, version}.
          Promise versions: GM.getValue, GM.setValue, GM.deleteValue, GM.listValues, GM.xmlHttpRequest (returns a promise), GM.addStyle, GM.setClipboard, GM.openInTab, GM.info.
          unsafeWindow: the real page window.

          NOT AVAILABLE (do not use)
          GM_registerMenuCommand (does nothing, there is no script menu), GM_notification, GM_download, GM_getResourceText, GM_getResourceURL, GM_addValueChangeListener, GM_cookie, GM_addElement, @resource. GM_xmlhttpRequest with FormData or Blob bodies, progress events, and binary uploads. Scripts inside iframes. Extension APIs (browser.*, chrome.*).
          There is no UI outside the page. If the user needs controls, add your own buttons or overlays to the page DOM (for example position: fixed).

          TIPS
          - Single-page sites change the DOM without reloading: use a MutationObserver or a short setInterval instead of running once.
          - Check that elements exist before using them.
          - Prefix ids and classes of injected elements with the script name to avoid clashes.
          - Use GM_setValue and GM_getValue to remember settings.
          - Avoid eval and new Function.
          - Keep everything in one self-contained file.

          EXAMPLE
          // ==UserScript==
          // @name         Highlight links
          // @namespace    greygecko
          // @version      1.0
          // @description  Outlines every link on example.com
          // @match        *://*.example.com/*
          // @run-at       document-idle
          // @grant        GM_addStyle
          // @grant        GM_getValue
          // @grant        GM_setValue
          // ==/UserScript==

          (function () {
            'use strict';
            var runs = GM_getValue('runs', 0) + 1;
            GM_setValue('runs', runs);
            GM_addStyle('a { outline: 2px solid orange !important; }');
            GM_log('run number ' + runs + ' on ' + location.href);
          })();
          """
