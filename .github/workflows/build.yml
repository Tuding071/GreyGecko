                              DropdownMenuItem(
                                  text = { Text("Clear finished", color = Color.White) },
                                  onClick = { menu = false; Downloads.clearFinished() }
                              )
                              DropdownMenuItem(
                                  text = { Text("Delete all from list", color = Danger) },
                                  onClick = { menu = false; confirmAll = true }
                              )
                              DropdownMenuItem(
                                  text = { Text(if (Downloads.maxRetries > 0) "Auto retry: " + Downloads.maxRetries + "x" else "Auto retry: Off", color = Color.White) },
                                  onClick = { Downloads.cycleRetries() }
                              )
                              DropdownMenuItem(
                                  text = { Text("Change folder", color = Color.White) },
                                  onClick = { menu = false; picker.launch(null) }
                              )
                          }
                      }
                  }
                  Text(
                      if (Downloads.folderState.isBlank()) "No folder chosen yet. Use the menu to pick one." else "Saving to: " + Downloads.folderState,
                      color = Soft,
                      fontSize = 11.sp,
                      modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp)
                  )
                  if (Downloads.items.isEmpty()) {
                      EmptyNote("No downloads yet. Use Save in the video list, Download in the long-press menu, or open a downloadable file.")
                  }
                  Column(Modifier.weight(1f).verticalScroll(rememberScrollState())) {
                      for (d in Downloads.items) {
                          key(d.id) {
                              DlRow(d, onOpen = { openDownload(ctx, it) }, onDeleteFile = { fileTarget = it })
                          }
                      }
                  }
              }
              if (confirmAll) {
                  AlertDialog(
                      onDismissRequest = { confirmAll = false },
                      containerColor = Bar,
                      title = { Text("Delete all from list?", color = Color.White) },
                      text = { Text("Running downloads are stopped. Downloaded files are kept.", color = Soft) },
                      confirmButton = {
                          TextButton(onClick = { Downloads.removeAll(); confirmAll = false }) { Text("Delete", color = Danger) }
                      },
                      dismissButton = {
                          TextButton(onClick = { confirmAll = false }) { Text("Cancel", color = Color.White) }
                      }
                  )
              }
              val ft = fileTarget
              if (ft != null) {
                  AlertDialog(
                      onDismissRequest = { fileTarget = null },
                      containerColor = Bar,
                      title = { Text("Delete file?", color = Color.White) },
                      text = { Text(if (ft.state == DL_DONE) ft.name + " will be deleted from storage." else "The partial download of " + ft.name + " will be deleted.", color = Soft) },
                      confirmButton = {
                          TextButton(onClick = { Downloads.deleteFile(ft); fileTarget = null }) { Text("Delete", color = Danger) }
                      },
                      dismissButton = {
                          TextButton(onClick = { fileTarget = null }) { Text("Cancel", color = Color.White) }
                      }
                  )
              }
          }

          @Composable

          fun GuideScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              var copied by remember { mutableStateOf(false) }
              LaunchedEffect(copied) {
                  if (copied) {
                      delay(1500)
                      copied = false
                  }
              }
              Column(Modifier.fillMaxSize()) {
                  Header {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Script guide", color = Color.White, fontSize = 18.sp, modifier = Modifier.weight(1f))
                      Button(onClick = {
                          val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("GreyGecko script guide", GUIDE))
                          copied = true
                      }) { Text(if (copied) "Copied" else "Copy for AI") }
                      Spacer(Modifier.width(6.dp))
                  }
                  Column(Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(12.dp)) {
                      Text(
                          "Copy this and paste it into your AI chat, then describe the script you want.",
                          color = Color(0xFFBBBBBB),
                          fontSize = 13.sp
                      )
                      Spacer(Modifier.height(10.dp))
                      SelectionContainer {
                          Text(GUIDE, color = Color.White, fontFamily = FontFamily.Monospace, fontSize = 11.5.sp)
                      }
                  }
              }
          }

          @Composable
          fun LogScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var raw by remember { mutableStateOf("Loading...") }
              var filter by remember { mutableStateOf("GreyScript") }
              val scroll = rememberScrollState()

              fun refresh() {
                  scope.launch { raw = withContext(Dispatchers.IO) { readLogcat() } }
              }
              LaunchedEffect(Unit) { refresh() }

              val shown = remember(raw, filter) {
                  raw.lines().filter { filter.isBlank() || it.contains(filter, true) }.joinToString("\n")
              }
              LaunchedEffect(shown) {
                  delay(150)
                  scroll.scrollTo(scroll.maxValue)
              }

              Column(Modifier.fillMaxSize()) {
                  Header {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Logcat", color = Color.White, fontSize = 18.sp, modifier = Modifier.weight(1f))
                      Button(onClick = { refresh() }) { Text("Refresh") }
                      Spacer(Modifier.width(8.dp))
                      Button(onClick = {
                          val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("logcat", shown))
                      }) { Text("Copy") }
                      Spacer(Modifier.width(6.dp))
                  }
                  Column(Modifier.fillMaxSize().padding(10.dp)) {
                      OutlinedTextField(
                          value = filter,
                          onValueChange = { filter = it },
                          modifier = Modifier.fillMaxWidth(),
                          singleLine = true,
                          placeholder = { Text("Filter (e.g. GreyScript)", color = Color(0xFF999999)) },
                          colors = fieldColors()
                      )
                      Spacer(Modifier.height(6.dp))
                      Box(
                          Modifier
                              .fillMaxSize()
                              .background(Field)
                              .padding(6.dp)
                              .verticalScroll(scroll)
                      ) {
                          SelectionContainer {
                              Text(
                                  shown,
                                  color = Color.White,
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = 11.sp
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/test.jks
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GreyGecko
          path: app/build/outputs/apk/release/*.apk
