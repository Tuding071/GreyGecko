          @Composable
          fun TabManagerScreen(
              tabs: TabManager,
              onBack: () -> Unit,
              onNewTab: () -> Unit,
              onSelect: (BrowserTab) -> Unit
          ) {
              val groups = groupTabs(tabs.tabs.filter { !it.preview })
              val curKey = groupKeyOf(tabs.current)
              var activeKey by remember { mutableStateOf(curKey) }
              var dragKey by remember { mutableStateOf<String?>(null) }
              var dragOffset by remember { mutableStateOf(0f) }
              val heights = remember { mutableStateMapOf<String, Int>() }
              val haptic = LocalHapticFeedback.current
              val active = groups.firstOrNull { it.key == activeKey }
                  ?: groups.firstOrNull { it.key == curKey }
                  ?: groups.firstOrNull()

              Column(Modifier.fillMaxSize().background(BG)) {
                  Header {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Tab Manager", color = Color.White, fontSize = 18.sp, modifier = Modifier.weight(1f))
                      Box(
                          Modifier
                              .size(38.dp)
                              .clip(CircleShape)
                              .background(Color.White)
                              .clickable { onNewTab() },
                          contentAlignment = Alignment.Center
                      ) {
                          Text("+", color = Color.Black, fontSize = 24.sp)
                      }
                      Spacer(Modifier.width(8.dp))
                  }
                  Box(Modifier.fillMaxWidth().height(0.5.dp).background(Field))
                  BoxWithConstraints(Modifier.weight(1f).fillMaxWidth()) {
                      val railW = (maxWidth * 0.38f).coerceIn(120.dp, 160.dp)
                      Row(Modifier.fillMaxSize()) {
                          Column(
                              Modifier
                                  .width(railW)
                                  .fillMaxHeight()
                                  .background(Bar)
                                  .verticalScroll(rememberScrollState())
                                  .padding(vertical = 8.dp)
                          ) {
                              for (g in groups) {
                                  key(g.key) {
                                      val dragging = dragKey == g.key
                                      Box(
                                          Modifier
                                              .onSizeChanged { heights[g.key] = it.height }
                                              .zIndex(if (dragging) 1f else 0f)
                                              .graphicsLayer { translationY = if (dragging) dragOffset else 0f }
                                              .background(if (dragging) Color(0xFF454545) else Color.Transparent)
                                              .pointerInput(g.key) {
                                                  detectDragGesturesAfterLongPress(
                                                      onDragStart = {
                                                          dragKey = g.key
                                                          dragOffset = 0f
                                                          haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                                      },
                                                      onDrag = { change, amount ->
                                                          change.consume()
                                                          dragOffset += amount.y
                                                          val cur = groupTabs(tabs.tabs.filter { !it.preview })
                                                          val i = cur.indexOfFirst { it.key == g.key }
                                                          if (dragOffset > 0f && i >= 0 && i < cur.size - 1) {
                                                              val nh = (heights[cur[i + 1].key] ?: 160).toFloat()
                                                              if (dragOffset > nh / 2f) {
                                                                  tabs.moveGroupBy(g.key, 1)
                                                                  dragOffset -= nh
                                                              }
                                                          } else if (dragOffset < 0f && i > 0) {
                                                              val ph = (heights[cur[i - 1].key] ?: 160).toFloat()
                                                              if (-dragOffset > ph / 2f) {
                                                                  tabs.moveGroupBy(g.key, -1)
                                                                  dragOffset += ph
                                                              }
                                                          }
                                                      },
                                                      onDragEnd = {
                                                          dragKey = null
                                                          dragOffset = 0f
                                                      },
                                                      onDragCancel = {
                                                          dragKey = null
                                                          dragOffset = 0f
                                                      }
                                                  )
                                              }
                                      ) {
                                          GroupItem(
                                              g,
                                              active = g.key == active?.key,
                                              foreground = g.tabs.any { it === tabs.current },
                                              onClick = { activeKey = g.key }
                                          )
                                      }
                                  }
                              }
                          }
                          Box(Modifier.width(0.5.dp).fillMaxHeight().background(Field))
                          Column(
                              Modifier
                                  .weight(1f)
                                  .fillMaxHeight()
                                  .verticalScroll(rememberScrollState())
                                  .padding(12.dp)
                          ) {
                              if (active != null) {
                                  Text(
                                      active.label.uppercase(),
                                      color = Soft,
                                      fontSize = 11.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      letterSpacing = 0.5.sp,
                                      modifier = Modifier.padding(start = 4.dp, top = 2.dp, bottom = 10.dp)
                                  )
                                  for (t in active.tabs) {
                                      key(t.id) {
                                          TabCard(
                                              t,
                                              foreground = t === tabs.current,
                                              closing = tabs.closingIds.contains(t.id),
                                              onClick = { onSelect(t) },
                                              onToggleClose = {
                                                  if (tabs.closingIds.contains(t.id)) tabs.undoClose(t) else tabs.requestClose(t)
                                              }
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

