                          return "Sent to " + p.second
                      } catch (e: Exception) {
                          Log.d("GreyScript", "handoff to " + p.first + " failed: " + e)
                      }
                  }
                  return try {
                      val s = Intent(Intent.ACTION_SEND)
                      s.type = "text/plain"
                      s.putExtra(Intent.EXTRA_TEXT, v.url)
                      val c = Intent.createChooser(s, "Send link")
                      c.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(c)
                      "No download manager found, pick an app"
                  } catch (e: Exception) {
                      "Could not send link"
                  }
              }
          }
