          package com.grey.gecko

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.util.Log
          import org.json.JSONArray
          import org.json.JSONObject

          object Backup {
              private const val TAG = "GreyScript"
              private val names = listOf("browser", "scripts")
              @Volatile
              private var active = false
              private val main = Handler(Looper.getMainLooper())
              private val pool = java.util.concurrent.Executors.newSingleThreadExecutor { r ->
                  val t = Thread(r)
                  t.isDaemon = true
                  t
              }
              private val job = Runnable { pool.execute { writeNow() } }
              private val listener = SharedPreferences.OnSharedPreferenceChangeListener { _, _ -> schedule() }

              private fun prefs(n: String): SharedPreferences =
                  Gecko.appCtx.getSharedPreferences(n, Context.MODE_PRIVATE)

              private fun dir(): java.io.File = java.io.File(Environment.getExternalStorageDirectory(), "GreyGecko")

              private fun mainFile(): java.io.File = java.io.File(dir(), "greygecko.json")

              private fun filtersDir(): java.io.File = java.io.File(dir(), "filters")

              private fun appFilters(): java.io.File = java.io.File(Gecko.appCtx.filesDir, "filters")

              fun hasAccess(): Boolean = Build.VERSION.SDK_INT >= 30 && Environment.isExternalStorageManager()

              fun openSettings(c: Context) {
                  try {
                      c.startActivity(
                          Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + c.packageName))
                      )
                  } catch (e: Exception) {
                      try {
                          c.startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                      } catch (e2: Exception) {
                          Log.e(TAG, "cannot open all-files settings", e2)
                      }
                  }
              }

              private fun listen() {
                  for (n in names) prefs(n).registerOnSharedPreferenceChangeListener(listener)
              }

              @Synchronized
              fun start() {
                  if (active) return
                  try {
                      dir().mkdirs()
                      val f = mainFile()
                      if (f.exists() && f.length() > 0L) {
                          if (!restore(f)) {
                              Log.e(TAG, "greygecko.json unreadable, backup off this session")
                              toast(Gecko.appCtx, "greygecko.json is unreadable. Backup is off. Fix or delete the file.")
                              return
                          }
                          restoreFilterFiles()
                          active = true
                          listen()
                          Log.d(TAG, "backup restored from file")
                      } else {
                          // No file: the file is the only source of truth, so start empty.
                          for (n in names) prefs(n).edit().clear().commit()
                          appFilters().deleteRecursively()
                          java.io.File(Gecko.appCtx.filesDir, "thumbs").deleteRecursively()
                          active = true
                          listen()
                          writeNow()
                          Log.d(TAG, "backup file missing, started empty")
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "backup start failed", e)
                  }
              }

              private fun restore(f: java.io.File): Boolean {
                  return try {
                      val root = JSONObject(f.readText())
                      for (n in names) {
                          val o = root.optJSONObject(n) ?: JSONObject()
                          val e = prefs(n).edit()
                          e.clear()
                          val keys = o.keys()
                          while (keys.hasNext()) {
                              val k = keys.next()
                              val v = o.get(k)
                              when (v) {
                                  is JSONObject -> e.putString(k, v.toString())
                                  is JSONArray -> e.putString(k, v.toString())
                                  is Boolean -> e.putBoolean(k, v)
                                  is Int -> e.putInt(k, v)
                                  is Long -> e.putLong(k, v)
                                  is Double -> e.putFloat(k, v.toFloat())
                                  is String -> e.putString(k, v)
                              }
                          }
                          e.commit()
                      }
                      true
                  } catch (ex: Exception) {
                      Log.e(TAG, "backup restore failed", ex)
                      false
                  }
              }

              private fun snapshot(): JSONObject {
                  val root = JSONObject()
                  root.put("app", "GreyGecko")
                  root.put("version", 1)
                  root.put("saved", System.currentTimeMillis())
                  for (n in names) {
                      val o = JSONObject()
                      for ((k, v) in prefs(n).all) {
                          when (v) {
                              is String -> {
                                  val t = v.trimStart()
                                  var put: Any = v
                                  if (t.startsWith("[")) {
                                      put = try { JSONArray(v) } catch (e: Exception) { v }
                                  } else if (t.startsWith("{")) {
                                      put = try { JSONObject(v) } catch (e: Exception) { v }
                                  }
                                  o.put(k, put)
                              }
                              is Boolean -> o.put(k, v)
                              is Int -> o.put(k, v)
                              is Long -> o.put(k, v)
                              is Float -> o.put(k, v.toDouble())
                          }
                      }
                      root.put(n, o)
                  }
                  return root
              }

              @Synchronized
              private fun writeNow(): Boolean {
                  if (!active) return false
                  return try {
                      val d = dir()
                      d.mkdirs()
                      val root = snapshot()
                      val f = mainFile()
                      val empty = root.optJSONObject("browser")?.length() == 0 &&
                          root.optJSONObject("scripts")?.length() == 0
                      if (empty && f.exists() && f.length() > 200L) {
                          false
                      } else {
                          val tmp = java.io.File(d, "greygecko.json.tmp")
                          tmp.writeText(root.toString(1))
                          JSONObject(tmp.readText())
                          var ok = tmp.renameTo(f)
                          if (!ok) {
                              try {
                                  tmp.copyTo(f, overwrite = true)
                                  tmp.delete()
                                  ok = true
                              } catch (e: Exception) {
                                  ok = false
                              }
                          }
                          if (ok) syncFilters(root)
                          ok
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "backup write failed", e)
                      false
                  }
              }

              private fun syncFilters(root: JSONObject) {
                  try {
                      val src = appFilters()
                      val dst = filtersDir()
                      val ids = HashSet<String>()
                      val arr = root.optJSONObject("browser")?.optJSONArray("filters")
                      if (arr != null) {
                          for (i in 0 until arr.length()) ids.add(arr.getJSONObject(i).optString("id"))
                      }
                      if (ids.isEmpty()) return
                      dst.mkdirs()
                      for (id in ids) {
                          val a = java.io.File(src, id + ".txt")
                          val b = java.io.File(dst, id + ".txt")
                          if (a.exists() && (!b.exists() || b.length() != a.length() || b.lastModified() < a.lastModified())) {
                              a.copyTo(b, overwrite = true)
                          }
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "filter sync failed", e)
                  }
              }

              private fun restoreFilterFiles() {
                  try {
                      val files = filtersDir().listFiles() ?: return
                      val dst = appFilters()
                      dst.mkdirs()
                      for (f in files) {
                          if (!f.name.endsWith(".txt")) continue
                          val t = java.io.File(dst, f.name)
                          if (!t.exists() || t.length() != f.length()) f.copyTo(t, overwrite = true)
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "filter restore failed", e)
                  }
              }

              fun schedule() {
                  if (!active) return
                  main.removeCallbacks(job)
                  main.postDelayed(job, 600L)
              }

              fun flush() {
                  if (!active) return
                  main.removeCallbacks(job)
                  writeNow()
              }

              fun finish() {
                  if (!active) return
                  main.removeCallbacks(job)
                  val ok = writeNow()
                  active = false
                  for (n in names) prefs(n).unregisterOnSharedPreferenceChangeListener(listener)
                  if (ok) {
                      for (n in names) prefs(n).edit().clear().commit()
                  }
