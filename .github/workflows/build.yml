              var has by mutableStateOf(false)
              var desc by mutableStateOf("")
              var note by mutableStateOf("")
              var previewing by mutableStateOf(false)
              var tabId = 0
              var extId = -1
              var port: WebExtension.Port? = null

              private fun send(ext: Int, cmd: String): Boolean {
                  val p = port ?: return false
                  if (ext < 0) return false
                  return try {
                      val o = JSONObject()
                      o.put("type", "pick")
                      o.put("cmd", cmd)
                      o.put("tabId", ext)
                      p.postMessage(o)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              fun begin(tab: BrowserTab): Boolean {
                  if (!send(tab.extId, "start")) return false
                  tabId = tab.id
                  extId = tab.extId
                  has = false
                  desc = ""
                  previewing = false
                  note = "Tap an element on the page"
                  active = true
                  return true
              }

              fun cmd(c: String) {
                  send(extId, c)
              }

              fun onState(h: Boolean, d: String, p: Boolean, n: String) {
                  if (!active) return
                  has = h
                  desc = d
                  previewing = p
                  if (n.isNotBlank()) note = n
              }

              fun stop() {
                  if (active) send(extId, "stop")
                  deactivateLocal()
              }

              fun deactivateLocal() {
                  active = false
                  has = false
                  previewing = false
              }
          }
