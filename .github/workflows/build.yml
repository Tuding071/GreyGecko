          package com.grey.gecko

          import android.content.Context
          import android.util.Log
          import org.json.JSONArray
          import org.json.JSONObject

          class FilterList(
              val id: String,
              var name: String,
              var url: String,
              var enabled: Boolean,
              var count: Int,
              var updated: Long
          )

          object Filters {
              @Volatile
              var ver = 1
              @Volatile
              var blocked = 0
              @Volatile
              var loadedNet = 0
              @Volatile
              var loadedCos = 0
              private var cache: String? = null
              private var cacheVer = -1

              private fun sp() = Gecko.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)

              private fun dir(): java.io.File {
                  val d = java.io.File(Gecko.appCtx.filesDir, "filters")
                  d.mkdirs()
                  return d
              }

              private fun file(id: String): java.io.File = java.io.File(dir(), id + ".txt")

              @Synchronized
              private fun bump() {
                  ver += 1
              }

              fun isOn(): Boolean = sp().getBoolean("adblock", true)

              fun cosOn(): Boolean = sp().getBoolean("adcos", true)

              fun setOn(v: Boolean) {
                  sp().edit().putBoolean("adblock", v).apply()
                  bump()
              }

              fun setCos(v: Boolean) {
                  sp().edit().putBoolean("adcos", v).apply()
                  bump()
              }

              @Synchronized
              fun load(): MutableList<FilterList> {
                  val out = mutableListOf<FilterList>()
                  try {
                      val arr = JSONArray(sp().getString("filters", "[]") ?: "[]")
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(
                              FilterList(
                                  o.getString("id"),
                                  o.optString("name"),
                                  o.optString("url"),
                                  o.optBoolean("on", true),
                                  o.optInt("n"),
                                  o.optLong("t")
                              )
                          )
                      }
                  } catch (e: Exception) {
                      Log.e("GreyScript", "filters load failed", e)
                  }
                  return out
              }

              @Synchronized
              private fun save(l: List<FilterList>) {
                  val arr = JSONArray()
                  for (f in l) {
                      val o = JSONObject()
                      o.put("id", f.id)
                      o.put("name", f.name)
                      o.put("url", f.url)
                      o.put("on", f.enabled)
                      o.put("n", f.count)
                      o.put("t", f.updated)
                      arr.put(o)
                  }
                  sp().edit().putString("filters", arr.toString()).apply()
              }

              fun countRules(text: String): Int {
                  var n = 0
                  for (ln in text.lineSequence()) {
                      val t = ln.trim()
                      if (t.isEmpty()) continue
                      val c = t[0]
                      if (c == '!' || c == '[') continue
                      if (c == '#' && !(t.length > 1 && (t[1] == '#' || t[1] == '@'))) continue
                      n++
                  }
                  return n
              }

              @Synchronized
              fun add(name: String, url: String, text: String): String {
                  val l = load()
                  var f = if (url.isBlank()) null else l.firstOrNull { it.url == url }
                  if (f == null) {
                      f = FilterList(Store.newId(), name, url, true, 0, 0L)
                      l.add(f)
                  }
                  file(f.id).writeText(text)
                  f.count = countRules(text)
                  f.updated = System.currentTimeMillis()
                  save(l)
                  bump()
                  return f.id
              }

              @Synchronized
              fun remove(id: String) {
                  val l = load()
                  l.removeAll { it.id == id }
                  save(l)
                  try {
                      file(id).delete()
                  } catch (e: Exception) {
                  }
                  bump()
              }

              @Synchronized
              fun setEnabled(id: String, v: Boolean) {
                  val l = load()
                  for (f in l) {
                      if (f.id == id) f.enabled = v
                  }
                  save(l)
                  bump()
              }

              private fun nameFromUrl(url: String): String = try {
                  val u = java.net.URL(url)
                  val s = u.path.substringAfterLast('/').removeSuffix(".txt")
                  if (s.isBlank()) u.host else s
              } catch (e: Exception) {
                  url
              }

              fun addFromUrl(url: String, name: String): String {
                  if (!url.startsWith("http://") && !url.startsWith("https://")) {
                      return "Link must start with http:// or https://"
                  }
                  return try {
                      val t = httpGet(url)
                      if (countRules(t) == 0) {
                          "No rules found at that URL"
                      } else {
                          add(name.ifBlank { nameFromUrl(url) }, url, t)
                          ""
                      }
                  } catch (e: Exception) {
                      e.message ?: "Download failed"
                  }
              }

              fun refresh(id: String): String {
                  val f = load().firstOrNull { it.id == id } ?: return "List not found"
                  if (f.url.isBlank()) return "No URL for this list"
                  return try {
                      val t = httpGet(f.url)
                      if (countRules(t) == 0) {
                          "No rules found at that URL"
                      } else {
                          add(f.name, f.url, t)
                          ""
                      }
                  } catch (e: Exception) {
                      e.message ?: "Download failed"
                  }
              }

              @Synchronized
              fun combined(): String {
                  val c = cache
                  if (c != null && cacheVer == ver) return c
                  val sb = StringBuilder()
                  if (isOn()) {
                      for (f in load()) {
                          if (!f.enabled) continue
                          try {
                              sb.append(file(f.id).readText())
                              sb.append('\n')
                          } catch (e: Exception) {
                          }
                      }
                  }
                  val s = sb.toString()
                  cache = s
                  cacheVer = ver
                  return s
              }

              @Synchronized
              fun dropCache() {
                  cache = null
              }

              fun chunk(all: String, off: Int): Pair<String, Int> {
                  if (off >= all.length) return Pair("", -1)
                  var end = minOf(all.length, off + 300000)
                  if (end < all.length) {
                      val nl = all.lastIndexOf('\n', end)
                      if (nl > off) end = nl + 1
                  }
                  return Pair(all.substring(off, end), if (end >= all.length) -1 else end)
              }
          }
