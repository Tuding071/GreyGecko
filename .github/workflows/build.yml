              // Limit is in kilobits per second and applies to each download on its own.
              private fun throttle(d: DlItem, n: Int) {
                  val k = limitKbps
                  if (k <= 0) return
                  val bps = k * 125L
                  var waitMs = 0L
                  synchronized(d.limLock) {
                      val now = System.nanoTime()
                      if (d.nextFree < now) d.nextFree = now
                      d.nextFree += n * 1000000000L / bps
                      waitMs = (d.nextFree - now) / 1000000L
                  }
                  if (waitMs > 2L) {
                      try {
                          Thread.sleep(minOf(waitMs, 5000L))
                      } catch (e: InterruptedException) {
                      }
                  }
