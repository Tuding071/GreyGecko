          class BookGroup(val key: String, val items: List<PageEntry>)

          fun groupBookmarks(all: List<PageEntry>): List<BookGroup> {
              val order = ArrayList<String>()
              val map = HashMap<String, MutableList<PageEntry>>()
              for (e in all) {
                  val k = keyOfUrl(e.url)
                  val l = map.getOrPut(k) {
                      order.add(k)
                      mutableListOf()
                  }
                  l.add(e)
              }
              return order.map { k -> BookGroup(k, map[k] ?: mutableListOf()) }
          }

