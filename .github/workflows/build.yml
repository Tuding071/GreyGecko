              private val delegate = object : WebExtension.MessageDelegate {
                  override fun onConnect(port: WebExtension.Port) {
                      HideTool.port = port
                      port.setDelegate(object : WebExtension.PortDelegate {
                          override fun onPortMessage(message: Any, port: WebExtension.Port) {}

                          override fun onDisconnect(port: WebExtension.Port) {
                              if (HideTool.port === port) HideTool.port = null
                          }
                      })
                  }
                  override fun onMessage(
                      nativeApp: String,
                      message: Any,
                      sender: WebExtension.MessageSender
                  ): GeckoResult<Any>? {
                      val reply = JSONObject()
                      try {
                          val m = message as JSONObject
                          when (m.optString("type")) {
                              "log" -> Log.d("GreyScript", "ext: " + m.optString("msg"))
                              "get" -> {
                                  val url = m.optString("url")
                                  val tid = m.optInt("tabId", -1)
                                  if (tid >= 0) Videos.bind(tid, url)
                                  val arr = JSONArray()
                                  for (s in Store.load()) {
                                      if (!s.enabled) continue
                                      val meta = parseMeta(s.code)
                                      if (!applies(meta, url)) continue
                                      val o = JSONObject()
                                      o.put("id", s.id)
                                      o.put("name", meta.name)
                                      o.put("version", meta.version)
                                      o.put("namespace", meta.namespace)
                                      o.put("description", meta.description)
                                      o.put("runAt", meta.runAt)
                                      o.put("code", s.code)
                                      o.put("requires", JSONArray(meta.requires))
                                      o.put("grants", JSONArray(meta.grants))
                                      o.put("matches", JSONArray(meta.matches + meta.includes))
                                      o.put("values", Store.values(s.id))
                                      arr.put(o)
                                  }
                                  reply.put("scripts", arr)
                                  reply.put("grabber", Videos.enabled)
                                  reply.put("adv", Filters.ver)
                                  reply.put("img", Saver.images())
                                  reply.put("mute", Saver.mute())
                                  val hostName = try { android.net.Uri.parse(url).host ?: "" } catch (e: Exception) { "" }
                                  val pathName = try { android.net.Uri.parse(url).path ?: "/" } catch (e: Exception) { "/" }
                                  reply.put("hide", JSONArray(HideRules.forPage(hostName, pathName)))
                                  Log.d("GreyScript", "scripts for " + url + ": " + arr.length())
                              }
                              "cfg" -> reply.put("grabber", Videos.enabled)
                              "adcfg" -> {
                                  reply.put("on", Filters.isOn())
                                  reply.put("cos", Filters.cosOn())
                                  reply.put("ver", Filters.ver)
                              }
                              "rules" -> {
                                  val all = Filters.combined()
                                  val ch = Filters.chunk(all, m.optInt("off", 0))
                                  reply.put("text", ch.first)
                                  reply.put("next", ch.second)
                                  if (ch.second < 0) Filters.dropCache()
                              }
                              "adstat" -> {
                                  Filters.blocked = m.optInt("n")
                              }
                              "pickstate" -> {
                                  HideTool.onState(m.optBoolean("has"), m.optString("desc"), m.optBoolean("previewing"), m.optString("note"))
                              }
                              "hidesave" -> {
                                  HideRules.add(m.optString("host"), m.optString("sel"), m.optString("path"))
                              }
                              "hidereset" -> {
                                  HideRules.clear(m.optString("host"))
                              }
                              "adinfo" -> {
                                  Filters.loadedNet = m.optInt("n")
                                  Filters.loadedCos = m.optInt("c")
                              }
                              "video" -> {
                                  reply.put("grabber", Videos.enabled)
                                  if (Videos.enabled) {
                                      val hd = HashMap<String, String>()
                                      val ho = m.optJSONObject("headers")
                                      if (ho != null) {
                                          for (k in ho.keys()) hd[k] = ho.optString(k)
                                      }
                                      Videos.onDetected(
                                          m.optInt("tabId", -1),
                                          m.optString("url"),
                                          m.optString("ctype"),
                                          m.optLong("size", -1L),
                                          hd,
                                          m.optString("kind")
                                          )
                                  }
                              }
                              "setValue" -> Store.setValue(m.optString("sid"), m.optString("key"), m.optString("value"))
                              "deleteValue" -> Store.deleteValue(m.optString("sid"), m.optString("key"))
                          }
                      } catch (e: Exception) {
                          Log.e("GreyScript", "delegate error", e)
                      }
                      return GeckoResult.fromValue<Any>(reply.toString())
                  }
              }

              @Synchronized
              fun runtime(ctx: Context): GeckoRuntime {
                  rt?.let { return it }
                  appCtx = ctx.applicationContext
                  val cfg = java.io.File(appCtx.filesDir, "gecko-config.yaml")
                  try {
                      cfg.writeText("prefs:\n  ui.click_hold_context_menus.delay: 350\n" + (if (Saver.autoplay()) "  media.autoplay.default: 5\n" else ""))
                  } catch (e: Exception) {
                      Log.e("GreyScript", "config write failed", e)
                  }
                  val settings = GeckoRuntimeSettings.Builder()
                      .configFilePath(cfg.absolutePath)
                      .build()
                  val r = GeckoRuntime.create(appCtx, settings)
                  rt = r
                  r.webExtensionController
                      .ensureBuiltIn("resource://android/assets/ext/", "scripts@grey.gecko")
                      .accept(
                          { ext ->
                              if (ext != null) {
                                  ext.setMessageDelegate(delegate, "browser")
                                  Log.d("GreyScript", "extension installed: " + ext.id)
                              } else {
                                  Log.e("GreyScript", "extension install returned null")
                              }
                          },
                          { e -> Log.e("GreyScript", "extension install failed", e) }
                      )
                  return r
              }
          }

          class MainActivity : ComponentActivity() {
              private lateinit var tabs: TabManager
              private var started = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  Gecko.appCtx = applicationContext
                  if (Backup.hasAccess()) {
                      startApp(true)
                  } else {
                      setContent {
                          AccessGate(
                              onAllow = { Backup.openSettings(this) },
                              onSkip = { startApp(false) }
                          )
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (!started && Backup.hasAccess()) startApp(true)
              }

              private fun startApp(useBackup: Boolean) {
                  if (started) return
                  started = true
                  if (useBackup) Backup.start()
                  Downloads.load()
                  val runtime = Gecko.runtime(this)
                  Videos.load(this)
                  Thread { Updater.autoCheck() }.start()
                  tabs = TabManager(runtime)
                  Videos.tabs = tabs
                  tabs.restore()
                  setContent { App(tabs) }
              }

              override fun onStart() {
                  super.onStart()
                  if (::tabs.isInitialized) tabs.refreshView()
              }

              override fun onStop() {
                  if (::tabs.isInitialized) {
                      tabs.saveNow()
                      Backup.flush()
                  }
                  super.onStop()
              }

              override fun onTrimMemory(level: Int) {
                  super.onTrimMemory(level)
                  if (::tabs.isInitialized) tabs.trim(level)
              }

              override fun onDestroy() {
                  Videos.tabs = null
                  if (::tabs.isInitialized) {
                      tabs.saveNow()
                      tabs.closeAll()
                      if (Downloads.hasActive()) Backup.flush() else Backup.finish()
                  }
                  super.onDestroy()
              }
          }

          fun Context.findActivity(): android.app.Activity? {
              var c: Context? = this
              while (c is android.content.ContextWrapper) {
                  if (c is android.app.Activity) return c
                  c = c.baseContext
              }
              return null
          }

          fun normalize(s: String): String {
              val t = s.trim()
              return when {
                  t.startsWith("http://") || t.startsWith("https://") ||
                      t.startsWith("about:") || t.startsWith("file:") -> t
                  t.contains(" ") || !t.contains(".") ->
                      "https://www.google.com/search?q=" + java.net.URLEncoder.encode(t, "UTF-8")
                  else -> "https://" + t
              }
          }

          fun toast(ctx: Context, msg: String) {
              android.widget.Toast.makeText(ctx, msg, android.widget.Toast.LENGTH_SHORT).show()
          }

          fun readLogcat(): String = try {
              val p = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-v", "time", "-t", "2000"))
              p.inputStream.bufferedReader().readText()
          } catch (e: Exception) {
              "logcat error: " + e
          }

