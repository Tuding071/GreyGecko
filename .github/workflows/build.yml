name: Build GreyGecko

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Resolve latest GeckoView
        run: |
          META=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/maven-metadata.xml)
          VER=$(echo "$META" | grep -oP '(?<=<release>)[^<]+' | head -1 || true)
          if [ -z "$VER" ]; then
            VER=$(echo "$META" | grep -oP '(?<=<latest>)[^<]+' | head -1 || true)
          fi
          if [ -z "$VER" ]; then
            echo "Could not resolve GeckoView version"; exit 1
          fi
          echo "GECKO_VERSION=$VER" >> $GITHUB_ENV
          echo "Using GeckoView $VER"

      - name: Test keystore cache
        id: ks
        uses: actions/cache@v4
        with:
          path: keystore
          key: test-keystore-v1

      - name: Create test keystore
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/test.jks -storepass testkey123 \
            -keypass testkey123 -alias test -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Test, O=Test, C=PH"

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/grey/gecko app/src/main/assets/ext

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://maven.mozilla.org/maven2/") }
              }
          }
          rootProject.name = "GreyGecko"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.grey.gecko"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.grey.gecko"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              signingConfigs {
                  create("test") {
                      storeFile = file(System.getenv("KEYSTORE_PATH"))
                      storePassword = "testkey123"
                      keyAlias = "test"
                      keyPassword = "testkey123"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("test")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-Xskip-metadata-version-check"
              }
              buildFeatures { compose = true }
          }

          tasks.configureEach {
              if (name.startsWith("check") && name.endsWith("AarMetadata")) enabled = false
          }

          dependencies {
              implementation("org.mozilla.geckoview:geckoview-arm64-v8a:${System.getenv("GECKO_VERSION")}")
              implementation(platform("androidx.compose:compose-bom:2025.01.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <package android:name="idm.internet.download.manager.plus" />
                  <package android:name="idm.internet.download.manager" />
                  <package android:name="idm.internet.download.manager.adm.lite" />
                  <package android:name="com.dv.adm.pay" />
                  <package android:name="com.dv.adm" />
              </queries>
              <application
                  android:label="GreyGecko"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/ext/manifest.json <<'EOF'
          {
            "manifest_version": 2,
            "name": "GreyScripts",
            "version": "3.0",
            "browser_specific_settings": { "gecko": { "id": "scripts@grey.gecko" } },
            "background": { "scripts": ["background.js"] },
            "content_scripts": [
              {
                "matches": ["<all_urls>"],
                "js": ["content.js"],
                "run_at": "document_start"
              }
            ],
            "permissions": ["nativeMessaging", "geckoViewAddons", "tabs", "webRequest", "<all_urls>"]
          }
          EOF

          cat > app/src/main/assets/ext/content.js <<'EOF'
          browser.runtime.sendMessage({ type: "page", url: location.href }).catch(function (e) {
            console.log("GreyScript content error: " + e);
          });
          EOF

          cat > app/src/main/assets/ext/background.js <<'EOF'
          var APP = "browser";
          var libCache = {};
          var grabberOn = true;
          var lastCfg = 0;
          var reqHdr = {};

          function nlog(m) {
            try { browser.runtime.sendNativeMessage(APP, { type: "log", msg: String(m) }); } catch (e) {}
          }

          function native(o) {
            return browser.runtime.sendNativeMessage(APP, o).then(function (raw) {
              if (typeof raw === "string") {
                try { return JSON.parse(raw); } catch (e) { return {}; }
              }
              return raw || {};
            });
          }

          function gmFactory(sid, vals, info) {
            function send(m) {
              try { return browser.runtime.sendMessage(m); } catch (e) { return Promise.resolve(); }
            }
            function log() {
              var a = [];
              for (var i = 0; i < arguments.length; i++) {
                var x = arguments[i];
                try { a.push(typeof x === "string" ? x : JSON.stringify(x)); } catch (e) { a.push(String(x)); }
              }
              send({ type: "log", msg: "[" + info.script.name + "] " + a.join(" ") });
            }
            function addStyle(css) {
              var s = document.createElement("style");
              s.textContent = css;
              (document.head || document.documentElement).appendChild(s);
              return s;
            }
            function getValue(k, d) {
              return Object.prototype.hasOwnProperty.call(vals, k) ? vals[k] : d;
            }
            function setValue(k, v) {
              var j;
              try { j = JSON.stringify(v); } catch (e) { j = undefined; }
              if (j === undefined) {
                delete vals[k];
                send({ type: "deleteValue", sid: sid, key: k });
              } else {
                vals[k] = v;
                send({ type: "setValue", sid: sid, key: k, value: j });
              }
            }
            function deleteValue(k) {
              delete vals[k];
              send({ type: "deleteValue", sid: sid, key: k });
            }
            function listValues() { return Object.keys(vals); }
            function xhr(d) {
              var aborted = false;
              var det = {
                url: d.url,
                method: d.method,
                headers: d.headers,
                data: d.data == null ? null : (typeof d.data === "string" ? d.data : String(d.data)),
                timeout: d.timeout
              };
              send({ type: "xhr", details: det }).then(function (r) {
                if (aborted) return;
                if (!r || !r.ok) {
                  var er = { error: (r && r.error) || "request failed", status: 0 };
                  if (r && r.timeout) { if (d.ontimeout) d.ontimeout(er); }
                  else if (d.onerror) { d.onerror(er); }
                  if (d.onloadend) d.onloadend(er);
                  return;
                }
                var bin = atob(r.b64);
                var bytes = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                var text = new TextDecoder("utf-8").decode(bytes);
                var rt = d.responseType || "text";
                var resp;
                if (rt === "arraybuffer") resp = bytes.buffer;
                else if (rt === "blob") resp = new Blob([bytes]);
                else if (rt === "json") { try { resp = JSON.parse(text); } catch (e) { resp = null; } }
                else resp = text;
                var res = {
                  status: r.status,
                  statusText: r.statusText,
                  finalUrl: r.finalUrl,
                  responseHeaders: r.responseHeaders,
                  response: resp,
                  responseText: (rt === "arraybuffer" || rt === "blob") ? "" : text,
                  readyState: 4,
                  context: d.context
                };
                if (d.onload) d.onload(res);
                if (d.onloadend) d.onloadend(res);
              }).catch(function (e) { log("xhr handler error: " + e); });
              return { abort: function () { aborted = true; if (d.onabort) d.onabort({}); } };
            }
            function xhrP(d) {
              return new Promise(function (resolve, reject) {
                var o = {};
                for (var k in d) o[k] = d[k];
                o.onload = function (r) { resolve(r); };
                o.onerror = function (e) { reject(e); };
                o.ontimeout = function (e) { reject(e); };
                xhr(o);
              });
            }
            function setClipboard(t) {
              t = String(t);
              function fb() {
                var ta = document.createElement("textarea");
                ta.value = t;
                ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
                (document.body || document.documentElement).appendChild(ta);
                ta.select();
                try { document.execCommand("copy"); } catch (e) {}
                ta.remove();
              }
              try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(t).catch(fb);
                } else {
                  fb();
                }
              } catch (e) { fb(); }
            }
            function openInTab(u) {
              try { window.open(u, "_blank"); } catch (e) { log("openInTab failed: " + e); }
            }
            function unsupported(n) {
              return function () { log(n + " is not supported"); };
            }
            var GM = {
              info: info,
              log: log,
              addStyle: function (c) { return Promise.resolve(addStyle(c)); },
              getValue: function (k, d) { return Promise.resolve(getValue(k, d)); },
              setValue: function (k, v) { setValue(k, v); return Promise.resolve(); },
              deleteValue: function (k) { deleteValue(k); return Promise.resolve(); },
              listValues: function () { return Promise.resolve(listValues()); },
              xmlHttpRequest: xhrP,
              setClipboard: function (t) { setClipboard(t); return Promise.resolve(); },
              openInTab: function (u) { openInTab(u); return Promise.resolve(); }
            };
            return {
              GM_info: info,
              GM_log: log,
              GM_addStyle: addStyle,
              GM_getValue: getValue,
              GM_setValue: setValue,
              GM_deleteValue: deleteValue,
              GM_listValues: listValues,
              GM_xmlhttpRequest: xhr,
              GM_setClipboard: setClipboard,
              GM_openInTab: openInTab,
              GM_registerMenuCommand: unsupported("GM_registerMenuCommand"),
              GM_notification: unsupported("GM_notification"),
              GM_download: unsupported("GM_download"),
              GM: GM,
              unsafeWindow: window.wrappedJSObject || window
            };
          }

          function bufToB64(buf) {
            var b = new Uint8Array(buf);
            var s = "";
            var chunk = 0x8000;
            for (var i = 0; i < b.length; i += chunk) {
              s += String.fromCharCode.apply(null, b.subarray(i, i + chunk));
            }
            return btoa(s);
          }

          function doXhr(d) {
            var opts = { method: d.method || "GET", headers: d.headers || {}, credentials: "include", redirect: "follow" };
            if (d.data != null && opts.method !== "GET" && opts.method !== "HEAD") opts.body = d.data;
            var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
            var timedOut = false;
            var timer = null;
            if (ctrl) opts.signal = ctrl.signal;
            if (ctrl && d.timeout > 0) {
              timer = setTimeout(function () { timedOut = true; ctrl.abort(); }, d.timeout);
            }
            return fetch(d.url, opts).then(function (r) {
              var hdrs = "";
              r.headers.forEach(function (v, k) { hdrs += k + ": " + v + "\r\n"; });
              return r.arrayBuffer().then(function (buf) {
                if (timer) clearTimeout(timer);
                return {
                  ok: true,
                  status: r.status,
                  statusText: r.statusText,
                  finalUrl: r.url,
                  responseHeaders: hdrs,
                  b64: bufToB64(buf)
                };
              });
            }).catch(function (e) {
              if (timer) clearTimeout(timer);
              return { ok: false, timeout: timedOut, error: String(e) };
            });
          }

          function fetchLib(url) {
            if (!libCache[url]) {
              libCache[url] = fetch(url).then(function (r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.text();
              }).catch(function (e) {
                delete libCache[url];
                nlog("require failed " + url + ": " + e);
                return "";
              });
            }
            return libCache[url];
          }

          function buildCode(s, libs) {
            var info = {
              script: {
                name: s.name,
                version: s.version,
                description: s.description,
                namespace: s.namespace,
                grant: s.grants || [],
                matches: s.matches || []
              },
              scriptHandler: "GreyGecko",
              version: "1.0"
            };
            var runAt = s.runAt || "document-idle";
            var timing;
            if (runAt === "document-start") {
              timing = "__safe();";
            } else if (runAt === "document-end") {
              timing = "if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', __safe, { once: true }); } else { __safe(); }";
            } else {
              timing = "if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', function () { setTimeout(__safe, 0); }, { once: true }); } else { __safe(); }";
            }
            return "(function () {\n" +
              "var __A = (" + gmFactory.toString() + ")(" + JSON.stringify(s.id) + ", " + JSON.stringify(s.values || {}) + ", " + JSON.stringify(info) + ");\n" +
              "var GM_info = __A.GM_info, GM_log = __A.GM_log, GM_addStyle = __A.GM_addStyle, GM_getValue = __A.GM_getValue, GM_setValue = __A.GM_setValue, GM_deleteValue = __A.GM_deleteValue, GM_listValues = __A.GM_listValues, GM_xmlhttpRequest = __A.GM_xmlhttpRequest, GM_setClipboard = __A.GM_setClipboard, GM_openInTab = __A.GM_openInTab, GM_registerMenuCommand = __A.GM_registerMenuCommand, GM_notification = __A.GM_notification, GM_download = __A.GM_download, GM = __A.GM, unsafeWindow = __A.unsafeWindow;\n" +
              "var __run = function () {\n" + (libs ? libs + "\n;\n" : "") + s.code + "\n};\n" +
              "var __safe = function () { try { __run(); } catch (e) { GM_log('script error: ' + (e && e.stack ? e.stack : e)); } };\n" +
              timing + "\n})();";
          }

          function runScript(s, sender, url) {
            return Promise.all((s.requires || []).map(fetchLib)).then(function (libs) {
              var code = buildCode(s, libs.join("\n;\n"));
              return browser.tabs.executeScript(sender.tab.id, {
                code: code,
                runAt: "document_start",
                frameId: sender.frameId || 0
              });
            }).then(function () {
              nlog("injected '" + s.name + "' into " + url);
            }, function (e) {
              nlog("script '" + s.name + "' failed: " + e);
            });
          }

          function handlePage(msg, sender) {
            if (!sender.tab) { nlog("no sender.tab"); return Promise.resolve({}); }
            return native({ type: "get", url: msg.url, tabId: sender.tab.id }).then(function (res) {
              if (typeof res.grabber === "boolean") grabberOn = res.grabber;
              var list = res.scripts || [];
              if (!list.length) { return {}; }
              return Promise.all(list.map(function (s) { return runScript(s, sender, msg.url); })).then(function () { return {}; });
            }).catch(function (e) {
              nlog("native error: " + e);
              return {};
            });
          }

          browser.runtime.onMessage.addListener(function (msg, sender) {
            if (!msg) return;
            if (msg.type === "log") { nlog(msg.msg); return; }
            if (msg.type === "setValue" || msg.type === "deleteValue") { native(msg); return; }
            if (msg.type === "xhr") { return doXhr(msg.details); }
            if (msg.type === "page") { return handlePage(msg, sender); }
          });

          // ---- Video grabber (network sniffing) ----
          var VIDEO_EXT = /\.(mp4|m4v|webm|mkv|mov|flv|avi|3gp|ogv)(\?|#|$)/i;
          var SKIP_EXT = /\.(ts|m4s|aac|vtt|webvtt|key|jpg|jpeg|png|gif|webp|svg|css|js|json|woff2?|ico)(\?|#|$)/i;
          var SEG_NAME = /(seg|segment|chunk|frag|fragment|init)[-_.]?\d*\.mp4/i;

          function refreshCfg() {
            var now = Date.now();
            if (now - lastCfg < 3000) return;
            lastCfg = now;
            native({ type: "cfg" }).then(function (r) {
              if (r && typeof r.grabber === "boolean") grabberOn = r.grabber;
            }).catch(function () {});
          }

          function classify(url, ct) {
            var c = String(ct || "").toLowerCase();
            if (/\.m3u8(\?|#|$)/i.test(url) || c.indexOf("mpegurl") >= 0) return "hls";
            if (SKIP_EXT.test(url)) return "";
            if (c.indexOf("mp2t") >= 0 || c.indexOf("segment") >= 0) return "";
            if (VIDEO_EXT.test(url) || c.indexOf("video/") === 0) return "file";
            return "";
          }

          function onSend(d) {
            if (!grabberOn || d.tabId < 0) return;
            var h = {};
            var list = d.requestHeaders || [];
            for (var i = 0; i < list.length; i++) {
              var n = String(list[i].name).toLowerCase();
              if (n === "referer") h["Referer"] = list[i].value;
              else if (n === "cookie") h["Cookie"] = list[i].value;
              else if (n === "user-agent") h["User-Agent"] = list[i].value;
              else if (n === "origin") h["Origin"] = list[i].value;
            }
            reqHdr[d.requestId] = h;
          }

          function onHeaders(d) {
            if (d.tabId < 0) return;
            if (!grabberOn) { refreshCfg(); return; }
            var ct = "";
            var len = -1;
            var hs = d.responseHeaders || [];
            for (var i = 0; i < hs.length; i++) {
              var n = String(hs[i].name).toLowerCase();
              if (n === "content-type") {
                ct = hs[i].value || "";
              } else if (n === "content-length") {
                var l = parseInt(hs[i].value, 10);
                if (!isNaN(l) && len < 0) len = l;
              } else if (n === "content-range") {
                var m = /\/(\d+)\s*$/.exec(hs[i].value || "");
                if (m) len = parseInt(m[1], 10);
              }
            }
            var kind = classify(d.url, ct);
            if (!kind) return;
            if (kind === "file") {
              if (SEG_NAME.test(d.url)) return;
              if (len >= 0 && len < 204800) return;
            }
            nlog("grabber " + kind + " " + d.url);
            native({
              type: "video",
              tabId: d.tabId,
              url: d.url,
              ctype: ct,
              size: len,
              headers: reqHdr[d.requestId] || {}
            }).then(function (r) {
              if (r && typeof r.grabber === "boolean") grabberOn = r.grabber;
            }).catch(function () {});
          }

          function cleanup(d) {
            delete reqHdr[d.requestId];
          }

          try {
            var WR = { urls: ["<all_urls>"], types: ["main_frame", "sub_frame", "media", "xmlhttprequest", "other", "object"] };
            browser.webRequest.onSendHeaders.addListener(onSend, WR, ["requestHeaders"]);
            browser.webRequest.onHeadersReceived.addListener(onHeaders, WR, ["responseHeaders"]);
            browser.webRequest.onCompleted.addListener(cleanup, WR);
            browser.webRequest.onErrorOccurred.addListener(cleanup, WR);
            nlog("grabber listeners ready");
          } catch (e) {
            nlog("grabber unavailable: " + e);
          }

          nlog("background started");
          EOF

          cat > app/src/main/java/com/grey/gecko/Scripts.kt <<'EOF'
          package com.grey.gecko

          import android.content.SharedPreferences
          import android.util.Log
          import org.json.JSONArray
          import org.json.JSONObject
          import org.json.JSONTokener

          class Script(
              val id: String,
              var code: String,
              var enabled: Boolean,
              var sourceUrl: String,
              var remoteVersion: String
          )

          class Meta(
              val name: String,
              val version: String,
              val namespace: String,
              val description: String,
              val matches: List<String>,
              val includes: List<String>,
              val excludes: List<String>,
              val runAt: String,
              val requires: List<String>,
              val grants: List<String>,
              val updateUrl: String,
              val downloadUrl: String
          )

          fun parseMeta(code: String): Meta {
              val map = HashMap<String, MutableList<String>>()
              val tag = "==UserScript=="
              val start = code.indexOf(tag)
              val end = code.indexOf("==/UserScript==")
              if (start >= 0 && end > start) {
                  val block = code.substring(start + tag.length, end)
                  val re = Regex("^\\s*//\\s*@([A-Za-z0-9_:\\-]+)\\s*(.*)")
                  for (line in block.lines()) {
                      val m = re.find(line.trimEnd()) ?: continue
                      map.getOrPut(m.groupValues[1].lowercase()) { mutableListOf() }.add(m.groupValues[2].trim())
                  }
              }
              fun one(k: String): String = map[k]?.firstOrNull() ?: ""
              fun many(k: String): List<String> = (map[k] ?: mutableListOf<String>()).filter { it.isNotBlank() }
              var runAt = one("run-at").lowercase().replace("_", "-")
              if (runAt != "document-start" && runAt != "document-end") runAt = "document-idle"
              return Meta(
                  one("name").ifBlank { "Unnamed script" },
                  one("version"),
                  one("namespace"),
                  one("description"),
                  many("match"),
                  many("include"),
                  many("exclude"),
                  runAt,
                  many("require"),
                  many("grant"),
                  one("updateurl"),
                  one("downloadurl")
              )
          }

          fun compareVersions(a: String, b: String): Int {
              val pa = a.split(".", "-", "+").map { p -> p.filter { c -> c.isDigit() }.ifEmpty { "0" }.toIntOrNull() ?: 0 }
              val pb = b.split(".", "-", "+").map { p -> p.filter { c -> c.isDigit() }.ifEmpty { "0" }.toIntOrNull() ?: 0 }
              for (i in 0 until maxOf(pa.size, pb.size)) {
                  val x = pa.getOrElse(i) { 0 }
                  val y = pb.getOrElse(i) { 0 }
                  if (x != y) return x.compareTo(y)
              }
              return 0
          }

          fun globToRegex(g: String): Regex {
              val body = g.split("*").joinToString(".*") { Regex.escape(it) }
              return Regex(body, RegexOption.IGNORE_CASE)
          }

          fun matchPattern(p: String, url: String): Boolean {
              if (p == "<all_urls>") return url.startsWith("http")
              val m = Regex("(\\*|https?|file|ftp)://([^/]*)(/.*)?").matchEntire(p) ?: return false
              val scheme = m.groupValues[1]
              val host = m.groupValues[2]
              val path = m.groupValues[3].ifEmpty { "/*" }
              val sre = if (scheme == "*") "https?" else Regex.escape(scheme)
              val hre = when {
                  host == "*" -> "[^/]*"
                  host.startsWith("*.") -> "([^/]*\\.)?" + Regex.escape(host.substring(2))
                  else -> Regex.escape(host)
              }
              val pre = path.split("*").joinToString(".*") { Regex.escape(it) }
              return try {
                  Regex(sre + "://" + hre + pre, RegexOption.IGNORE_CASE).matches(url)
              } catch (e: Exception) {
                  false
              }
          }

          fun matchInclude(p: String, url: String): Boolean {
              val t = p.trim()
              if (t == "*") return true
              if (t.length > 2 && t.startsWith("/") && t.endsWith("/")) {
                  return try {
                      Regex(t.substring(1, t.length - 1), RegexOption.IGNORE_CASE).matches(url)
                  } catch (e: Exception) {
                      false
                  }
              }
              return globToRegex(t).matches(url)
          }

          fun applies(m: Meta, url: String): Boolean {
              val u = url.substringBefore('#')
              if (m.matches.isEmpty() && m.includes.isEmpty()) return false
              val ok = m.matches.any { matchPattern(it, u) } || m.includes.any { matchInclude(it, u) }
              if (!ok) return false
              return !m.excludes.any { matchInclude(it, u) }
          }

          fun checkUrlFor(m: Meta, src: String): String =
              m.updateUrl.ifBlank { m.downloadUrl }.ifBlank { src }

          fun applyUrlFor(m: Meta, src: String): String =
              m.downloadUrl.ifBlank { m.updateUrl }.ifBlank { src }

          fun httpGet(url: String): String {
              val c = java.net.URL(url).openConnection() as java.net.HttpURLConnection
              c.connectTimeout = 15000
              c.readTimeout = 20000
              c.instanceFollowRedirects = true
              c.setRequestProperty("User-Agent", "GreyGecko/1.0")
              try {
                  if (c.responseCode !in 200..299) throw Exception("HTTP " + c.responseCode)
                  return c.inputStream.bufferedReader().readText()
              } finally {
                  c.disconnect()
              }
          }

          object Store {
              private fun sp(): SharedPreferences = Gecko.prefs(Gecko.appCtx)

              fun newId(): String = java.util.UUID.randomUUID().toString().take(8)

              @Synchronized
              fun load(): MutableList<Script> {
                  val out = mutableListOf<Script>()
                  try {
                      val arr = JSONArray(sp().getString("list", "[]") ?: "[]")
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(
                              Script(
                                  o.getString("id"),
                                  o.optString("code"),
                                  o.optBoolean("enabled", true),
                                  o.optString("src"),
                                  o.optString("remote")
                              )
                          )
                      }
                  } catch (e: Exception) {
                      Log.e("GreyScript", "load failed", e)
                  }
                  return out
              }

              @Synchronized
              fun save(list: List<Script>) {
                  val arr = JSONArray()
                  for (s in list) {
                      val o = JSONObject()
                      o.put("id", s.id)
                      o.put("code", s.code)
                      o.put("enabled", s.enabled)
                      o.put("src", s.sourceUrl)
                      o.put("remote", s.remoteVersion)
                      arr.put(o)
                  }
                  sp().edit().putString("list", arr.toString()).apply()
              }

              @Synchronized
              fun setEnabled(id: String, v: Boolean) {
                  val l = load()
                  for (s in l) {
                      if (s.id == id) s.enabled = v
                  }
                  save(l)
              }

              @Synchronized
              fun remove(id: String) {
                  val l = load()
                  l.removeAll { it.id == id }
                  save(l)
                  sp().edit().remove("vals_" + id).apply()
              }

              @Synchronized
              fun values(id: String): JSONObject {
                  return try {
                      JSONObject(sp().getString("vals_" + id, "{}") ?: "{}")
                  } catch (e: Exception) {
                      JSONObject()
                  }
              }

              @Synchronized
              fun setValue(id: String, key: String, json: String) {
                  if (id.isBlank() || key.isBlank()) return
                  if (json.isEmpty()) {
                      deleteValue(id, key)
                      return
                  }
                  val o = values(id)
                  try {
                      o.put(key, JSONTokener(json).nextValue())
                  } catch (e: Exception) {
                      return
                  }
                  sp().edit().putString("vals_" + id, o.toString()).apply()
              }

              @Synchronized
              fun deleteValue(id: String, key: String) {
                  if (id.isBlank()) return
                  val o = values(id)
                  o.remove(key)
                  sp().edit().putString("vals_" + id, o.toString()).apply()
              }

              fun lastCheck(): Long = sp().getLong("lastCheck", 0L)

              fun setLastCheck(t: Long) {
                  sp().edit().putLong("lastCheck", t).apply()
              }
          }

          object Updater {
              fun checkAll(): Int {
                  val found = HashMap<String, String>()
                  for (s in Store.load()) {
                      val m = parseMeta(s.code)
                      val u = checkUrlFor(m, s.sourceUrl)
                      if (u.isBlank()) continue
                      try {
                          val remote = parseMeta(httpGet(u)).version
                          if (remote.isNotBlank() && compareVersions(remote, m.version) > 0) {
                              found[s.id] = remote
                          } else {
                              found[s.id] = ""
                          }
                      } catch (e: Exception) {
                          Log.d("GreyScript", "update check failed: " + e)
                      }
                  }
                  val fresh = Store.load()
                  var n = 0
                  for (f in fresh) {
                      val r = found[f.id]
                      if (r != null) {
                          f.remoteVersion = r
                          if (r.isNotBlank()) n++
                      }
                  }
                  Store.save(fresh)
                  Store.setLastCheck(System.currentTimeMillis())
                  return n
              }

              fun applyAll(): Int {
                  val updates = HashMap<String, String>()
                  for (s in Store.load()) {
                      if (s.remoteVersion.isBlank()) continue
                      val u = applyUrlFor(parseMeta(s.code), s.sourceUrl)
                      if (u.isBlank()) continue
                      try {
                          val t = httpGet(u)
                          if (t.contains("==UserScript==")) updates[s.id] = t
                      } catch (e: Exception) {
                          Log.d("GreyScript", "update download failed: " + e)
                      }
                  }
                  val fresh = Store.load()
                  for (f in fresh) {
                      val t = updates[f.id]
                      if (t != null) {
                          f.code = t
                          f.remoteVersion = ""
                      }
                  }
                  Store.save(fresh)
                  return updates.size
              }

              fun autoCheck() {
                  if (System.currentTimeMillis() - Store.lastCheck() > 86400000L) {
                      try {
                          checkAll()
                      } catch (e: Exception) {
                          Log.d("GreyScript", "auto check failed: " + e)
                      }
                  }
              }
          }
