                  java.io.File(favDir(), key.replace(Regex("[^A-Za-z0-9.-]"), "_") + ".png")

              private fun readDisk(key: String): Bitmap? {
                  return try {
                      val f = favFile(key)
                      if (f.exists()) BitmapFactory.decodeFile(f.path) else null
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun writeDisk(key: String, b: Bitmap) {
                  try {
                      java.io.FileOutputStream(favFile(key)).use { out ->
                          b.compress(Bitmap.CompressFormat.PNG, 100, out)
                      }
                      val files = favDir().listFiles() ?: return
                      if (files.size > 100) {
                          val sorted = files.sortedBy { it.lastModified() }
                          for (i in 0 until sorted.size - 100) sorted[i].delete()
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun download(u: String): Bitmap? {
                  return try {
                      val c = java.net.URL(u).openConnection() as java.net.HttpURLConnection
                      c.connectTimeout = 8000
                      c.readTimeout = 8000
                      c.instanceFollowRedirects = true
                      c.setRequestProperty("User-Agent", DEFAULT_UA)
                      try {
                          if (c.responseCode in 200..299) c.inputStream.use { BitmapFactory.decodeStream(it) } else null
