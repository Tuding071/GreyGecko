          @Composable
          fun FiltersScreen(onBack: () -> Unit, onGuide: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var lists by remember { mutableStateOf(Filters.load()) }
              var on by remember { mutableStateOf(Filters.isOn()) }

              var status by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              var showUrl by remember { mutableStateOf(false) }
              var sel by remember { mutableStateOf<FilterList?>(null) }
              var blocked by remember { mutableStateOf(Filters.blocked) }
              var loadedNet by remember { mutableStateOf(Filters.loadedNet) }
              var loadedCos by remember { mutableStateOf(Filters.loadedCos) }
              val fmt = remember { java.text.DateFormat.getDateInstance(java.text.DateFormat.SHORT) }
              fun reload() { lists = Filters.load() }

              LaunchedEffect(Unit) {
                  while (true) {
                      blocked = Filters.blocked
                      loadedNet = Filters.loadedNet
                      loadedCos = Filters.loadedCos
                      delay(1000)
                  }
              }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null && !busy) {
                      busy = true
                      status = "Importing…"
                      scope.launch {
                          val r = withContext(Dispatchers.IO) {
                              try {
                                  val t = ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""
                                  if (Filters.countRules(t) == 0) {
                                      "ERR:No rules found in that file"
                                  } else {
                                      Filters.add(displayName(ctx, uri), "", t)
                                      "OK"
                                  }
                              } catch (e: Exception) {
                                  "ERR:" + (e.message ?: "Could not read file")
                              }
                          }
                          busy = false
                          reload()
                          status = if (r.startsWith("ERR:")) r.substring(4) else "Imported. Reload the page."
                      }
                  }
              }

              Column(Modifier.fillMaxSize()) {
                  Header {
                      TextButton(onClick = onBack) { Text("←", color = Color.White, fontSize = 20.sp) }
                      Text("Ad filters", color = Color.White, fontSize = 18.sp)
                      Spacer(Modifier.width(8.dp))
                      Box(
                          Modifier
                              .size(26.dp)
                              .border(1.dp, Color(0xFF888888), CircleShape)
                              .clickable { onGuide() },
                          contentAlignment = Alignment.Center
                      ) {
                          Text("?", color = Color.White, fontSize = 14.sp)
                      }
                      Spacer(Modifier.weight(1f))
                      TextButton(onClick = { picker.launch(arrayOf("*/*")) }) { Text("Import", color = Color.White) }
                      TextButton(onClick = { showUrl = true }) { Text("URL", color = Color.White) }
                  }
                  Column(Modifier.weight(1f).verticalScroll(rememberScrollState())) {
                      FilterToggleRow("Ad blocking", on) { v ->
                          on = v
                          Filters.setOn(v)
                      }

                      Text(
                          "Rules loaded: " + loadedNet + " · blocked this session: " + blocked,
                          color = Soft,
                          fontSize = 12.sp,
                          modifier = Modifier.padding(horizontal = 12.dp, vertical = 4.dp)
                      )
                      Row(Modifier.fillMaxWidth().padding(horizontal = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                          if (lists.any { it.url.isNotBlank() }) {
                              TextButton(onClick = {
                                  if (!busy) {
                                      busy = true
                                      status = "Updating…"
                                      scope.launch {
                                          val res = withContext(Dispatchers.IO) {
                                              var ok = 0
                                              var tot = 0
                                              for (f in Filters.load()) {
                                                  if (f.url.isBlank()) continue
                                                  tot++
                                                  if (Filters.refresh(f.id).isEmpty()) ok++
                                              }
                                              ok.toString() + "/" + tot
                                          }
                                          busy = false
                                          reload()
                                          status = "Updated " + res + ". Reload the page."
                                      }
                                  }
                              }) { Text("Update all", color = Color.White, fontSize = 12.sp) }
                          }
                      }
                      if (status.isNotBlank()) {
                          Text(status, color = Soft, fontSize = 12.sp, modifier = Modifier.padding(horizontal = 12.dp, vertical = 2.dp))
                      }
                      Box(Modifier.fillMaxWidth().height(0.5.dp).background(Color(0xFF333333)))
                      if (lists.isEmpty()) {
                          EmptyNote("No filter lists yet. Tap URL to download one or Import to load a .txt file. Tap ? for links to popular lists.")
                      }
                      for (f in lists) {
                          key(f.id) {
                              Row(
                                  Modifier.fillMaxWidth().clickable { sel = f }.padding(horizontal = 12.dp, vertical = 10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(Modifier.weight(1f)) {
                                      Text(
                                          f.name,
                                          color = if (f.enabled) Color.White else Color(0xFF888888),
                                          fontSize = 14.sp,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                      Text(
                                          f.count.toString() + " rules" +
                                              (if (f.updated > 0) " · " + fmt.format(java.util.Date(f.updated)) else "") +
                                              (if (f.url.isBlank()) " · imported file" else " · " + hostOf(f.url)),
                                          color = Soft,
                                          fontSize = 12.sp,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  }
                                  Switch(
                                      checked = f.enabled,
                                      onCheckedChange = { v ->
                                          Filters.setEnabled(f.id, v)
                                          reload()
                                      },
                                      colors = switchColors()
                                  )
                              }
                              Box(Modifier.fillMaxWidth().height(0.5.dp).background(Color(0xFF333333)))
                          }
                      }
                  }
              }

              if (showUrl) {
                  UrlListDialog(
                      onDismiss = { showUrl = false },
                      onAdded = {
                          showUrl = false
                          reload()
                          status = "Added. Reload the page."
                      }
                  )
              }

              val s = sel
              if (s != null) {
                  AlertDialog(
                      onDismissRequest = { sel = null },
                      containerColor = Bar,
                      title = { Text(s.name, color = Color.White, fontSize = 16.sp, maxLines = 1, overflow = TextOverflow.Ellipsis) },
                      text = {
                          Column {
                              if (s.url.isNotBlank()) {
                                  MenuRow("Update now") {
                                      sel = null
                                      if (!busy) {
                                          busy = true
                                          status = "Updating…"
                                          scope.launch {
                                              val e = withContext(Dispatchers.IO) { Filters.refresh(s.id) }
                                              busy = false
                                              reload()
                                              status = if (e.isEmpty()) "Updated " + s.name + ". Reload the page." else e
                                          }
                                      }
                                  }
                              }
                              MenuRow("Delete") {
                                  sel = null
                                  Filters.remove(s.id)
                                  reload()
                              }
                          }
                      },
                      confirmButton = {},
                      dismissButton = {
                          TextButton(onClick = { sel = null }) { Text("Close", color = Color.White) }
                      }
                  )
              }
          }

          @Composable
          fun FilterGuideScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var status by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              Column(Modifier.fillMaxSize()) {
