          package com.grey.gecko

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Log

          const val DEFAULT_UA = "Mozilla/5.0 (Android 14; Mobile; rv:130.0) Gecko/130.0 Firefox/130.0"

          class VideoItem(
              val url: String,
              val label: String,
              val kind: String,
              val sub: String,
              val headers: Map<String, String>,
              val rank: Long = 0L
          )

          fun fmtSize(b: Long): String = when {
              b >= 1073741824L -> String.format("%.1f GB", b / 1073741824.0)
              b >= 1048576L -> String.format("%.1f MB", b / 1048576.0)
              b >= 1024L -> String.format("%.0f KB", b / 1024.0)
              else -> b.toString() + " B"
          }

          fun fmtDur(sec: Double): String {
              val t = sec.toLong()
              val h = t / 3600
              val m = (t % 3600) / 60
              val s = t % 60
              return if (h > 0) String.format("%d:%02d:%02d", h, m, s) else String.format("%d:%02d", m, s)
          }

          fun mbps(bw: Long): String = String.format("%.1f Mbps", bw / 1000000.0)

          fun hostOf(url: String): String = try {
              Uri.parse(url).host ?: ""
          } catch (e: Exception) {
              ""
          }

          fun isHls(url: String, ctype: String): Boolean {
              val p = url.substringBefore('#').substringBefore('?')
              return p.endsWith(".m3u8", true) || ctype.contains("mpegurl", true)
          }

          fun hlsAttrs(s: String): Map<String, String> {
              val out = HashMap<String, String>()
              for (m in Regex("([A-Z0-9-]+)=(\"[^\"]*\"|[^,]*)").findAll(s)) {
                  out[m.groupValues[1]] = m.groupValues[2].trim('"')
              }
              return out
          }

          fun resolveUrl(base: String, ref: String): String = try {
              java.net.URL(java.net.URL(base), ref).toString()
          } catch (e: Exception) {
              ref
          }

          fun fetchText(url: String, h: Map<String, String>): String {
              val c = java.net.URL(url).openConnection() as java.net.HttpURLConnection
              c.connectTimeout = 15000
              c.readTimeout = 20000
              c.instanceFollowRedirects = true
              c.setRequestProperty("User-Agent", h["User-Agent"] ?: DEFAULT_UA)
              for (k in listOf("Referer", "Cookie", "Origin")) {
                  val v = h[k]
                  if (!v.isNullOrBlank()) c.setRequestProperty(k, v)
              }
              try {
                  if (c.responseCode !in 200..299) throw Exception("HTTP " + c.responseCode)
                  if (c.contentLengthLong > 5000000L) throw Exception("too large")
                  return c.inputStream.bufferedReader().readText()
              } finally {
                  c.disconnect()
              }
          }

          fun parseHls(url: String, text: String, h: Map<String, String>): List<VideoItem> {
              val out = mutableListOf<VideoItem>()
              if (!text.trimStart().startsWith("#EXTM3U")) return out
              val lines = text.lines().map { it.trim() }
              if (lines.any { it.startsWith("#EXT-X-STREAM-INF") }) {
                  var i = 0
                  while (i < lines.size) {
                      val ln = lines[i]
                      if (ln.startsWith("#EXT-X-STREAM-INF:")) {
                          val attrs = hlsAttrs(ln.substringAfter(':'))
                          var j = i + 1
                          while (j < lines.size && (lines[j].isEmpty() || lines[j].startsWith("#"))) j++
                          if (j < lines.size) {
                              val u = resolveUrl(url, lines[j])
                              val res = attrs["RESOLUTION"] ?: ""
                              val height = res.substringAfter("x", "").toIntOrNull() ?: 0
                              val bw = (attrs["AVERAGE-BANDWIDTH"] ?: attrs["BANDWIDTH"])?.toLongOrNull() ?: 0L
                              val label = when {
                                  height > 0 -> height.toString() + "p"
                                  bw > 0 -> mbps(bw)
                                  else -> "Stream"
                              }
                              val parts = mutableListOf("HLS")
                              if (res.isNotBlank()) parts.add(res)
                              if (bw > 0) parts.add(mbps(bw))
                              out.add(VideoItem(u, label, "HLS", parts.joinToString(" · "), h, height * 100000L + bw / 1000))
                              i = j
                          }
                      } else if (ln.startsWith("#EXT-X-MEDIA:")) {
                          val attrs = hlsAttrs(ln.substringAfter(':'))
                          val uri = attrs["URI"]
                          if (attrs["TYPE"] == "AUDIO" && !uri.isNullOrBlank()) {
                              val nm = attrs["NAME"] ?: attrs["LANGUAGE"] ?: "track"
                              out.add(VideoItem(resolveUrl(url, uri), "Audio · " + nm, "HLS", "HLS audio track", h, -1L))
                          }
                      }
                      i++
                  }
                  out.sortByDescending { it.rank }
              } else if (lines.any { it.startsWith("#EXTINF") }) {
                  var dur = 0.0
                  var enc = ""
                  var ended = false
                  for (ln in lines) {
                      if (ln.startsWith("#EXTINF:")) {
                          dur += ln.substringAfter(':').substringBefore(',').toDoubleOrNull() ?: 0.0
                      } else if (ln.startsWith("#EXT-X-KEY:")) {
                          val mth = hlsAttrs(ln.substringAfter(':'))["METHOD"]
                          if (mth != null && mth != "NONE") enc = mth
                      } else if (ln.startsWith("#EXT-X-ENDLIST")) {
                          ended = true
                      }
                  }
                  val parts = mutableListOf("HLS")
                  parts.add(if (ended) fmtDur(dur) else "live")
                  if (enc.isNotEmpty()) parts.add(if (enc == "SAMPLE-AES") "DRM, may not download" else "encrypted " + enc)
                  out.add(VideoItem(url, "HLS stream", "HLS", parts.joinToString(" · "), h, 0L))
              }
              return out
          }

          fun fileItem(url: String, ctype: String, size: Long, h: Map<String, String>): VideoItem {
              val name = try { Uri.parse(url).lastPathSegment ?: "" } catch (e: Exception) { "" }
              var ext = if (name.contains('.')) name.substringAfterLast('.').lowercase() else ""
              if (ext.isEmpty() || ext.length > 5) {
                  ext = when {
                      ctype.contains("mp4", true) -> "mp4"
                      ctype.contains("webm", true) -> "webm"
                      ctype.contains("matroska", true) -> "mkv"
                      ctype.contains("quicktime", true) -> "mov"
                      else -> "video"
                  }
              }
              val kind = ext.uppercase()
              val parts = mutableListOf(kind)
              if (size > 0) parts.add(fmtSize(size))
              val host = hostOf(url)
              if (host.isNotBlank()) parts.add(host)
              return VideoItem(url, name.ifBlank { "video." + ext }, kind, parts.joinToString(" · "), h, size)
          }

          fun copyText(ctx: Context, text: String) {
              val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText("link", text))
          }

          object Videos {
              @Volatile
              var enabled = true
              var tabs: TabManager? = null
              private val pending = HashMap<Int, MutableList<VideoItem>>()
              private val pendingSeen = HashMap<Int, HashSet<String>>()
              private val main = Handler(Looper.getMainLooper())

              fun load(ctx: Context) {
                  enabled = ctx.applicationContext
                      .getSharedPreferences("browser", Context.MODE_PRIVATE)
                      .getBoolean("grabber", true)
              }

              fun setGrabber(v: Boolean) {
                  enabled = v
                  Gecko.appCtx.getSharedPreferences("browser", Context.MODE_PRIVATE)
                      .edit().putBoolean("grabber", v).apply()
              }

              private fun tabFor(extId: Int): BrowserTab? = tabs?.tabs?.firstOrNull { it.extId == extId }

              fun bind(extId: Int, url: String) {
                  val tm = tabs ?: return
                  val u = url.substringBefore('#')
                  var found = tm.tabs.firstOrNull { it.extId == extId }
                  if (found == null) found = tm.tabs.firstOrNull { it.extId == -1 && it.url.substringBefore('#') == u }
                  if (found == null) found = tm.tabs.firstOrNull { it.url.substringBefore('#') == u }
                  val tab: BrowserTab = found ?: return
                  tab.extId = extId
                  val ps = pendingSeen.remove(extId)
                  if (ps != null) tab.seen.addAll(ps)
                  val pv = pending.remove(extId)
                  if (pv != null) {
                      for (v in pv) tab.addVideo(v)
                  }
              }

              fun onDetected(extId: Int, url: String, ctype: String, size: Long, hdr: Map<String, String>) {
                  if (!enabled || extId < 0) return
                  val t = tabFor(extId)
                  val key = url.substringBefore('#')
                  val fresh = if (t != null) t.seen.add(key) else pendingSeen.getOrPut(extId) { HashSet() }.add(key)
                  if (!fresh) return
                  val h = HashMap<String, String>(hdr)
                  if (h["Referer"].isNullOrBlank() && t != null && t.url.isNotBlank()) h["Referer"] = t.url
                  if (h["User-Agent"].isNullOrBlank()) h["User-Agent"] = DEFAULT_UA
                  if (isHls(url, ctype)) {
                      Thread {
                          try {
                              val items = parseHls(url, fetchText(url, h), h)
                              for (v in items) report(extId, v)
                          } catch (e: Exception) {
                              Log.d("GreyScript", "hls failed: " + url + " " + e)
                          }
                      }.start()
                  } else {
                      report(extId, fileItem(url, ctype, size, h))
                  }
              }

              private fun report(extId: Int, v: VideoItem) {
                  main.post {
                      val t = tabFor(extId)
                      if (t != null) {
                          t.addVideo(v)
                      } else {
                          val l = pending.getOrPut(extId) { mutableListOf() }
                          if (l.size < 60) l.add(v)
                      }
                  }
              }
          }

          object Handoff {
              private val packages = listOf(
                  "idm.internet.download.manager.plus" to "1DM+",
                  "idm.internet.download.manager" to "1DM",
                  "idm.internet.download.manager.adm.lite" to "1DM Lite",
                  "com.dv.adm.pay" to "ADM",
                  "com.dv.adm" to "ADM"
              )

              fun send(ctx: Context, v: VideoItem): String {
                  for (p in packages) {
                      val i = Intent(Intent.ACTION_VIEW, Uri.parse(v.url))
                      i.setPackage(p.first)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      val b = Bundle()
                      for ((k, x) in v.headers) b.putString(k, x)
                      i.putExtra("com.android.browser.headers", b)
                      try {
                          ctx.startActivity(i)
                          return "Sent to " + p.second
                      } catch (e: Exception) {
                          Log.d("GreyScript", "handoff to " + p.first + " failed: " + e)
                      }
                  }
                  return try {
                      val s = Intent(Intent.ACTION_SEND)
                      s.type = "text/plain"
                      s.putExtra(Intent.EXTRA_TEXT, v.url)
                      val c = Intent.createChooser(s, "Send link")
                      c.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(c)
                      "No download manager found, pick an app"
                  } catch (e: Exception) {
                      "Could not send link"
                  }
              }
          }
