                  concurrent = n
                  sp().edit().putInt("dlconc", n).apply()
                  pump()
              }

              fun cycleRetries() {
                  maxRetries = when (maxRetries) {
                      0 -> 2
                      2 -> 4
                      4 -> 8
                      else -> 0
                  }
                  sp().edit().putInt("dlretry", maxRetries).apply()
              }

              private fun shouldRetry(d: DlItem, e: Exception): Boolean {
                  if (d.cancel || d.tries >= maxRetries) return false
                  if (d.kind == "stream") return false
                  val m = (e.message ?: "").lowercase()
                  if (m == "canceled") return false
                  if (m.contains("space") || m.contains("permission") || m.contains("denied") || m.contains("read-only")) return false
                  if (e is java.io.IOException) return true
                  if (Regex("http (408|425|429|5\\d\\d)").containsMatchIn(m)) return true
                  for (k in listOf("timed out", "timeout", "unable to resolve", "connection", "reset", "unexpected end", "eof", "broken pipe", "segment failed", "ssl", "socket")) {
                      if (m.contains(k)) return true
                  }
                  return false
              }

              private fun waitRetry(d: DlItem, ms: Long): Boolean {
                  var left = ms
                  while (left > 0L) {
                      if (d.cancel) return false
                      try {
                          Thread.sleep(200L)
                      } catch (e: InterruptedException) {
                          return false
                      }
                      left -= 200L
                  }
                  try {
                      awaitResume(d)
                  } catch (e: Exception) {
                      return false
                  }
                  return !d.cancel
              }

              private fun runItem(d: DlItem) {
                  try {
                      runItemInner(d)
                  } finally {
                      synchronized(qLock) { inFlight-- }
                      pump()
                  }
              }

              private fun runItemInner(d: DlItem) {
                  if (d.cancel) {
                      d.state = DL_CANCELED
                      save()
                      return
                  }
                  try {
                      awaitResume(d)
                  } catch (e: Exception) {
                      d.state = DL_CANCELED
                      save()
                      return
                  }
                  d.started = true
                  d.state = DL_RUNNING
                  d.error = ""
                  d.note = ""
                  running.add(d)
                  if (active.incrementAndGet() == 1) startService()
                  try {
                      while (true) {
                          try {
                              val dir = folder() ?: throw Exception("No download folder")
                              dir.mkdirs()
                              if (!dir.canWrite()) throw Exception("Folder is not writable")
                              when (d.kind) {
                                  "hls" -> runHls(d, dir)
                                  "dash" -> runDash(d, dir)
                                  "stream" -> runStream(d, dir)
                                  else -> runFile(d, dir)
                              }
                              d.state = DL_DONE
                              val done = d.name
                              main.post { toast(Gecko.appCtx, "Downloaded " + done) }
                              break
                          } catch (e: Exception) {
                              if (d.cancel) {
                                  d.state = DL_CANCELED
                                  break
                              }
                              if (shouldRetry(d, e)) {
                                  d.tries = d.tries + 1
                                  d.speed = 0L
                                  d.note = "Retrying " + d.tries + "/" + maxRetries + "…"
                                  Log.e("GreyScript", "download retry " + d.tries + " " + d.url, e)
                                  if (!waitRetry(d, minOf(2000L * d.tries, 10000L))) {
                                      d.state = DL_CANCELED
                                      break
                                  }
                                  d.note = ""
                                  continue
                              }
                              d.state = DL_FAILED
                              d.error = e.message ?: "Failed"
                              val msg = d.error
                              main.post { toast(Gecko.appCtx, "Download failed: " + msg) }
                              Log.e("GreyScript", "download failed " + d.url, e)
                              try {
                                  if (d.path.isNotBlank() && d.kind != "hls" && d.kind != "dash") File(d.path + ".part").delete()
                              } catch (x: Exception) {
                              }
                              break
                          }
                      }
                  } finally {
                      running.remove(d)
                      d.speed = 0L
                      if (active.decrementAndGet() == 0) stopService()
                      save()
                  }
              }

              private fun tempDir(): File {
                  val t = File(Gecko.appCtx.cacheDir, "dl")
                  t.mkdirs()
                  return t
              }

              private fun moveFile(src: File, dst: File) {
                  if (!src.renameTo(dst)) {
                      src.copyTo(dst, overwrite = true)
                      src.delete()
                  }
              }

              private fun uniqueFile(dir: File, name: String): File {
                  var f = File(dir, name)
                  if (!f.exists() && !File(dir, name + ".part").exists()) return f
                  val dot = name.lastIndexOf('.')
                  val base = if (dot > 0) name.substring(0, dot) else name
                  val ext = if (dot > 0) name.substring(dot) else ""
                  var i = 1
                  while (true) {
                      f = File(dir, base + " (" + i + ")" + ext)
                      if (!f.exists() && !File(dir, f.name + ".part").exists()) return f
                      i++
                  }
              }

              private fun nameFromHeaders(cd: String?, url: String, ct: String?): String {
                  if (!cd.isNullOrBlank()) {
                      val m1 = Regex("filename\\*\\s*=\\s*[^']*''([^;]+)", RegexOption.IGNORE_CASE).find(cd)
                      if (m1 != null) {
                          return try {
                              java.net.URLDecoder.decode(m1.groupValues[1].trim(), "UTF-8")
                          } catch (e: Exception) {
                              m1.groupValues[1]
                          }
                      }
                      val m2 = Regex("filename\\s*=\\s*\"?([^\";]+)\"?", RegexOption.IGNORE_CASE).find(cd)
                      if (m2 != null) return m2.groupValues[1].trim()
                  }
                  val seg = try {
                      java.net.URLDecoder.decode(Uri.parse(url).lastPathSegment ?: "", "UTF-8")
                  } catch (e: Exception) {
                      ""
                  }
                  return seg.ifBlank { "download" }
              }

              private fun withExt(name: String, ct: String?): String {
                  val dot = name.lastIndexOf('.')
                  if (dot > 0 && name.length - dot <= 6) return name
                  val m = (ct ?: "").lowercase().substringBefore(';').trim()
                  val ext = when (m) {
                      "video/mp4" -> "mp4"
                      "video/webm" -> "webm"
                      "video/x-matroska" -> "mkv"
                      "video/quicktime" -> "mov"
                      "audio/mpeg" -> "mp3"
                      "audio/mp4" -> "m4a"
                      "image/jpeg" -> "jpg"
                      "image/png" -> "png"
                      "image/gif" -> "gif"
                      "image/webp" -> "webp"
                      "application/pdf" -> "pdf"
                      "application/zip" -> "zip"
                      "application/vnd.android.package-archive" -> "apk"
                      else -> ""
                  }
                  return if (ext.isEmpty()) name else name + "." + ext
              }

              private fun openConn(url0: String, h: Map<String, String>, range: String? = null): java.net.HttpURLConnection {
                  var url = url0
                  var hops = 0
                  while (true) {
                      val c = java.net.URL(url).openConnection() as java.net.HttpURLConnection
                      c.connectTimeout = 15000
                      c.readTimeout = 30000
                      c.instanceFollowRedirects = false
                      c.setRequestProperty("User-Agent", h["User-Agent"] ?: DEFAULT_UA)
                      if (range != null) c.setRequestProperty("Range", range)
                      for (k in listOf("Referer", "Cookie", "Origin")) {
                          val v = h[k]
                          if (!v.isNullOrBlank()) c.setRequestProperty(k, v)
                      }
                      val code = c.responseCode
                      if (code in 300..399 && hops < 8) {
                          val loc = c.getHeaderField("Location")
                          c.disconnect()
                          if (loc.isNullOrBlank()) throw Exception("Bad redirect")
                          url = resolveUrl(url, loc)
                          hops++
                          continue
                      }
                      if (code !in 200..299) {
                          c.disconnect()
                          throw Exception("HTTP " + code)
                      }
                      return c
                  }
              }

              private fun getBytes(url: String, h: Map<String, String>, d: DlItem? = null): ByteArray {
                  val c = openConn(url, h)
                  try {
                      return c.inputStream.use { readLimited(it, d) }
                  } finally {
                      c.disconnect()
                  }
              }

              // Returns true at the end of the stream. Returns false only when resumable and the item was paused.
              private fun copyStream(d: DlItem, ins: InputStream, out: java.io.OutputStream, resumable: Boolean = false): Boolean {
                  val buf = ByteArray(16384)
                  var last = 0L
                  while (true) {
                      if (d.cancel) throw Exception("Canceled")
                      if (d.paused) {
                          if (resumable) return false
                          awaitResume(d)
                      }
                      val n = ins.read(buf, 0, chunkSize())
                      if (n < 0) return true
                      out.write(buf, 0, n)
                      d.done = d.done + n
                      d.addBytes(n)
                      throttle(d, n)
                      tickSpeed(d)
                      val now = System.currentTimeMillis()
                      if (now - last > 400L) {
                          last = now
                          notifyProgress()
                      }
                  }
              }

              private fun saveTo(d: DlItem, dir: File, name: String, ins: InputStream) {
                  val target = uniqueFile(dir, name)
                  d.name = target.name
                  d.path = target.path
                  val part = File(dir, target.name + ".part")
                  try {
                      java.io.FileOutputStream(part).use { out -> copyStream(d, ins, out) }
                      if (!part.renameTo(target)) throw Exception("Could not save file")
                  } catch (e: Exception) {
                      part.delete()
                      throw e
                  }
              }

              private fun runFile(d: DlItem, dir: File) {
                  var target: File? = null
                  var part: File? = null
                  if (d.tries > 0 && d.path.isNotBlank() && File(d.path + ".part").exists()) {
                      target = File(d.path)
                      part = File(d.path + ".part")
                  }
                  while (true) {
                      val existing = if (part != null) part.length() else 0L
                      val c = openConn(d.url, d.headers, if (existing > 0L) "bytes=" + existing + "-" else null)
                      try {
                          val resumed = existing > 0L && c.responseCode == 206
                          if (target == null) {
                              var name = d.name
                              if (name.isBlank()) name = withExt(clean(nameFromHeaders(c.getHeaderField("Content-Disposition"), d.url, c.contentType)), c.contentType)
                              target = uniqueFile(dir, clean(name))
                              part = File(dir, target.name + ".part")
                              d.name = target.name
                              d.path = target.path
                          }
                          val p = part ?: throw Exception("No file")
                          val startAt = if (resumed) existing else 0L
                          val len = c.contentLengthLong
                          d.total = if (len > 0L) startAt + len else 0L
                          d.done = startAt
                          try {
                              val finished = java.io.FileOutputStream(p, resumed).use { out -> copyStream(d, c.inputStream, out, true) }
                              if (finished) break
                          } catch (e: Exception) {
                              if (!shouldRetry(d, e)) p.delete()
                              throw e
                          }
                      } finally {
                          c.disconnect()
                      }
                      awaitResume(d)
                  }
                  val t = target ?: throw Exception("No file")
                  val p2 = part ?: throw Exception("No file")
                  if (!p2.renameTo(t)) {
                      p2.delete()
                      throw Exception("Could not save file")
                  }
                  afterFile(d, dir)
              }

              // A plain video file may have no sound (video-only). If a separate audio file was found, merge it in.
              private fun afterFile(d: DlItem, dir: File) {
                  if (d.audioUrl.isBlank() || d.path.isBlank()) return
                  val f = File(d.path)
                  if (!f.exists() || Mux.hasAudio(f)) return
                  val tmp = tempDir()
                  val a = File(tmp, d.id + "_a.m4a")
                  val merged = File(tmp, d.id + "_m.mp4")
                  try {
                      d.note = "Downloading audio…"
                      d.done = 0L
                      d.total = 0L
                      val c = openConn(d.audioUrl, d.headers)
                      try {
                          c.inputStream.use { ins -> java.io.FileOutputStream(a).use { out -> copyStream(d, ins, out) } }
                      } finally {
                          c.disconnect()
                      }
                      d.note = "Merging audio…"
                      val base = f.name.substringBeforeLast('.')
                      if (Mux.merge(f, a, merged)) {
                          f.delete()
                          val target = uniqueFile(dir, base + ".mp4")
                          moveFile(merged, target)
                          d.name = target.name
                          d.path = target.path
                          d.note = ""
                      } else {
                          val af = uniqueFile(dir, base + " (audio).m4a")
                          moveFile(a, af)
                          d.note = "No sound: could not merge. Audio saved as a separate file."
                      }
                  } catch (e: Exception) {
                      if (d.cancel) throw e
                      d.note = "No sound: audio failed (" + (e.message ?: "error") + ")"
                  } finally {
                      a.delete()
                      merged.delete()
                  }
              }

              private fun runStream(d: DlItem, dir: File) {
                  val ins = d.stream ?: throw Exception("No data")
                  try {
                      saveTo(d, dir, clean(d.name), ins)
                  } finally {
                      try {
                          ins.close()
                      } catch (e: Exception) {
                      }
                      d.stream = null
                  }
              }

              // ---------- HLS / DASH segments ----------
              private fun hexToBytes(s0: String): ByteArray {
                  var s = s0.trim()
                  if (s.startsWith("0x") || s.startsWith("0X")) s = s.substring(2)
                  if (s.length % 2 == 1) s = "0" + s
                  val out = ByteArray(s.length / 2)
                  for (i in out.indices) out[i] = s.substring(i * 2, i * 2 + 2).toInt(16).toByte()
                  return if (out.size < 16) ByteArray(16 - out.size) + out else out
              }

              private fun ivFromSeq(seq: Long): ByteArray {
                  val b = ByteArray(16)
                  for (i in 0 until 8) b[15 - i] = ((seq shr (8 * i)) and 0xFFL).toByte()
                  return b
              }

              private fun fetchSeg(s: HlsSeg, h: Map<String, String>, keys: HashMap<String, ByteArray>, d: DlItem): ByteArray {
                  var lastErr: Exception? = null
                  for (attempt in 0 until 3) {
                      try {
                          var b = getBytes(s.url, h, d)
                          val ku = s.keyUrl
                          if (ku != null) {
                              val key = synchronized(keys) { keys.getOrPut(ku) { getBytes(ku, h, d) } }
                              val iv = s.iv ?: ivFromSeq(s.seq)
                              val cipher = javax.crypto.Cipher.getInstance("AES/CBC/PKCS5Padding")
                              cipher.init(
                                  javax.crypto.Cipher.DECRYPT_MODE,
                                  javax.crypto.spec.SecretKeySpec(key, "AES"),
                                  javax.crypto.spec.IvParameterSpec(iv)
                              )
                              b = cipher.doFinal(b)
                          }
                          return b
                      } catch (e: Exception) {
                          lastErr = e
                      }
                  }
                  throw lastErr ?: Exception("Segment failed")
              }

              private fun parseHlsPlan(url0: String, h: Map<String, String>): SegPlan {
                  var url = url0
                  var lns = fetchText(url, h).let { t ->
                      if (!t.trimStart().startsWith("#EXTM3U")) throw Exception("Not a playlist")
                      t.lines().map { it.trim() }
                  }
                  if (lns.any { it.startsWith("#EXT-X-STREAM-INF") }) {
                      var best = -1L
                      var bu = ""
                      var i = 0
                      while (i < lns.size) {
                          val ln = lns[i]
                          if (ln.startsWith("#EXT-X-STREAM-INF:")) {
                              val bw = hlsAttrs(ln.substringAfter(':'))["BANDWIDTH"]?.toLongOrNull() ?: 0L
                              var j = i + 1
                              while (j < lns.size && (lns[j].isEmpty() || lns[j].startsWith("#"))) j++
                              if (j < lns.size && bw > best) {
                                  best = bw
                                  bu = resolveUrl(url, lns[j])
                              }
                          }
                          i++
                      }
                      if (bu.isEmpty()) throw Exception("No stream found")
                      url = bu
                      lns = fetchText(url, h).lines().map { it.trim() }
                  }
                  if (lns.none { it.startsWith("#EXT-X-ENDLIST") }) throw Exception("Live streams are not supported")
                  var seq = 0L
                  var keyUrl: String? = null
                  var ivBytes: ByteArray? = null
                  var initUrl: String? = null
                  val segs = ArrayList<HlsSeg>()
                  for (ln in lns) {
                      if (ln.startsWith("#EXT-X-MEDIA-SEQUENCE:")) {
                          seq = ln.substringAfter(':').trim().toLongOrNull() ?: 0L
                      } else if (ln.startsWith("#EXT-X-KEY:")) {
                          val a = hlsAttrs(ln.substringAfter(':'))
                          val m = a["METHOD"] ?: "NONE"
                          if (m == "NONE") {
                              keyUrl = null
                              ivBytes = null
                          } else if (m == "AES-128") {
                              keyUrl = resolveUrl(url, a["URI"] ?: "")
                              val iv = a["IV"]
                              ivBytes = if (iv != null) hexToBytes(iv) else null
                          } else {
                              throw Exception("Encrypted stream (" + m + ") is not supported")
                          }
                      } else if (ln.startsWith("#EXT-X-MAP:")) {
                          val a = hlsAttrs(ln.substringAfter(':'))
                          if (a.containsKey("BYTERANGE")) throw Exception("Byte-range streams are not supported")
                          initUrl = resolveUrl(url, a["URI"] ?: "")
                      } else if (ln.startsWith("#EXT-X-BYTERANGE")) {
                          throw Exception("Byte-range streams are not supported")
                      } else if (ln.isNotEmpty() && !ln.startsWith("#")) {
                          segs.add(HlsSeg(resolveUrl(url, ln), keyUrl, ivBytes, seq))
                          seq++
                      }
                  }
                  if (segs.isEmpty()) throw Exception("No segments")
                  val first = segs[0].url.substringBefore('?').lowercase()
                  val ext = if (initUrl != null) "mp4"
                  else if (first.endsWith(".aac")) "aac"
                  else if (first.endsWith(".mp3")) "mp3"
                  else if (first.endsWith(".mp4") || first.endsWith(".m4s") || first.endsWith(".m4a")) "mp4"
                  else "ts"
                  return SegPlan(initUrl, segs, ext)
              }

              private fun downloadPlan(d: DlItem, plan: SegPlan, out: File, count: Boolean = true) {
                  val keys = HashMap<String, ByteArray>()
                  val exec = java.util.concurrent.Executors.newFixedThreadPool(4)
                  try {
                      java.io.FileOutputStream(out).use { os ->
                          val initSeg = plan.init
                          if (initSeg != null) os.write(getBytes(initSeg, d.headers, d))
                          var i = 0
                          while (i < plan.segs.size) {
                          if (d.cancel) throw Exception("Canceled")
                          if (d.paused) awaitResume(d)
                              val end = minOf(i + 8, plan.segs.size)
                              val futs = ArrayList<java.util.concurrent.Future<ByteArray>>()
                              for (k in i until end) {
                                  val s = plan.segs[k]
                                  futs.add(exec.submit(java.util.concurrent.Callable { fetchSeg(s, d.headers, keys, d) }))
                              }
                              for (f in futs) {
                                  val bytes = try {
                                      f.get()
                                  } catch (e: java.util.concurrent.ExecutionException) {
                                      throw Exception(e.cause?.message ?: "Segment failed")
                                  }
                                  os.write(bytes)
                                  if (count) d.done = d.done + 1L
                                  tickSpeed(d)
                              }
                              notifyProgress()
                              i = end
                          }
                      }
                  } finally {
                      exec.shutdownNow()
                  }
              }

              // The video part had no sound: look for an audio-only playlist among the other streams found on the page.
              private fun findAudioPlan(d: DlItem): SegPlan? {
                  for (u in d.cands.take(6)) {
                      if (d.cancel) return null
                      try {
                          val p = parseHlsPlan(u, d.headers)
                          if (p.ext == "aac" || p.ext == "mp3") return p
                          val probe = File(tempDir(), d.id + "_probe." + p.ext)
                          try {
                              downloadPlan(d, SegPlan(p.init, p.segs.take(1), p.ext), probe, false)
                              if (Mux.probe(probe) == "audio") return p
                          } finally {
                              probe.delete()
                          }
                      } catch (e: Exception) {
                      }
                  }
                  return null
              }

              private fun finishTracks(d: DlItem, dir: File, v: File, a: File?) {
                  val base = clean(d.name.ifBlank { "video" })
                  if (a == null) {
                      val ext = v.extension
                      if (ext == "ts" || ext == "mp4") {
                          d.note = "Converting to mp4…"
                          val conv = File(v.parentFile, d.id + "_c.mp4")
                          if (Mux.remux(v, conv) && conv.length() > 1024L) {
                              val target = uniqueFile(dir, base + ".mp4")
                              moveFile(conv, target)
                              v.delete()
                              d.name = target.name
                              d.path = target.path
                              d.note = ""
                              return
                          }
                          conv.delete()
                          d.note = "Saved as ." + ext + " (could not convert to mp4)"
                      }
                      val target = uniqueFile(dir, base + "." + ext)
                      moveFile(v, target)
                      d.name = target.name
                      d.path = target.path
                      return
                  }
                  d.note = "Merging audio…"
                  val merged = File(v.parentFile, d.id + "_m.mp4")
                  val ok = Mux.merge(v, a, merged) && merged.length() > 1024L
                  if (ok) {
                      val target = uniqueFile(dir, base + ".mp4")
                      moveFile(merged, target)
                      v.delete()
                      a.delete()
                      d.name = target.name
                      d.path = target.path
                      d.note = ""
                  } else {
                      merged.delete()
                      val tv = uniqueFile(dir, base + "." + v.extension)
                      val ta = uniqueFile(dir, base + " (audio)." + a.extension)
                      moveFile(v, tv)
                      moveFile(a, ta)
                      d.name = tv.name
                      d.path = tv.path
                      d.note = "No sound: could not merge. Audio saved as a separate file."
                  }
              }

              private fun runHls(d: DlItem, dir: File) {
                  val vPlan = parseHlsPlan(d.url, d.headers)
                  var aPlan: SegPlan? = null
                  if (d.audioUrl.isNotBlank()) {
                      aPlan = try {
                          parseHlsPlan(d.audioUrl, d.headers)
                      } catch (e: Exception) {
                          d.note = "No sound: audio playlist failed"
                          null
                      }
                  }
                  d.total = (vPlan.segs.size + (aPlan?.segs?.size ?: 0)).toLong()
                  d.done = 0L
                  val tmp = tempDir()
                  val vFile = File(tmp, d.id + "_v." + vPlan.ext)
                  var aFile: File? = null
                  try {
                      downloadPlan(d, vPlan, vFile)
                      var ap = aPlan
                      if (ap == null && d.cands.isNotEmpty() && !Mux.hasAudio(vFile)) {
                          d.note = "Looking for audio…"
                          ap = findAudioPlan(d)
                          d.note = ""
                          if (ap != null) d.total = d.total + ap.segs.size
                      }
                      if (ap != null) {
                          aFile = File(tmp, d.id + "_a." + ap.ext)
                          downloadPlan(d, ap, aFile)
                      }
                      finishTracks(d, dir, vFile, aFile)
                  } finally {
                      vFile.delete()
                      aFile?.delete()
                  }
              }

              private fun runDash(d: DlItem, dir: File) {
                  val reps = parseMpd(d.url, fetchText(d.url, d.headers))
                  val v = reps.firstOrNull { it.id == d.rep } ?: throw Exception("Stream not found in the manifest")
                  val a = if (d.audioUrl.isNotBlank()) reps.firstOrNull { it.id == d.audioUrl && it.kind == "audio" } else null
                  val vs = v.single
                  if (vs != null) {
                      // whole-file representation: use the normal file path (with audio merge if needed)
                      d.url = vs
                      d.audioUrl = a?.single ?: ""
                      d.kind = "file"
                      if (d.name.indexOf('.') < 0) d.name = d.name + "." + v.ext
                      runFile(d, dir)
                      return
                  }
                  val vPlan = v.plan ?: throw Exception("No segments")
                  val aPlan = a?.plan
                  d.total = (vPlan.segs.size + (aPlan?.segs?.size ?: 0)).toLong()
                  d.done = 0L
                  val tmp = tempDir()
                  val vFile = File(tmp, d.id + "_v." + vPlan.ext)
                  var aFile: File? = null
                  try {
                      downloadPlan(d, vPlan, vFile)
                      var ap = aPlan
                      if (ap == null && d.cands.isNotEmpty() && !Mux.hasAudio(vFile)) {
                          d.note = "Looking for audio…"
                          ap = findAudioPlan(d)
                          d.note = ""
                          if (ap != null) d.total = d.total + ap.segs.size
                      }
                      if (ap != null) {
                          aFile = File(tmp, d.id + "_a." + ap.ext)
                          downloadPlan(d, ap, aFile)
                      }
                      finishTracks(d, dir, vFile, aFile)
                  } finally {
                      vFile.delete()
                      aFile?.delete()
                  }
              }

              // ---------- foreground service + notification ----------
              private fun notifyProgress() {
                  val now = System.currentTimeMillis()
                  if (now - lastNotif < 1000L) return
                  lastNotif = now
                  val list = ArrayList(running)
                  if (list.isEmpty()) return
                  val first = list[0]
                  val pct = if (first.total > 0L) (first.done * 100L / first.total).toInt() else -1
                  val text = if (list.size == 1) first.name else list.size.toString() + " downloads"
                  DlNotif.update(Gecko.appCtx, text, pct)
              }

              private fun startService() {
                  try {
                      val c = Gecko.appCtx
                      c.startForegroundService(Intent(c, DownloadService::class.java))
                  } catch (e: Exception) {
                      Log.e("GreyScript", "download service start failed", e)
                  }
              }

              private fun stopService() {
                  try {
                      val c = Gecko.appCtx
                      c.stopService(Intent(c, DownloadService::class.java))
                  } catch (e: Exception) {
                  }
              }
          }

          object DlNotif {
              const val ID = 4711
              private const val CH = "downloads"

              fun ensureChannel(c: Context) {
                  val nm = c.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel(CH, "Downloads", NotificationManager.IMPORTANCE_LOW))
              }

              fun build(c: Context, text: String, pct: Int): Notification {
                  val open = PendingIntent.getActivity(
                      c,
                      0,
                      Intent(c, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val b = Notification.Builder(c, CH)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle("GreyGecko downloads")
                      .setContentText(text)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(open)
                  if (pct >= 0) b.setProgress(100, pct, false)
                  return b.build()
              }

              fun update(c: Context, text: String, pct: Int) {
                  try {
                      val nm = c.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(ID, build(c, text, pct))
                  } catch (e: Exception) {
                  }
              }
          }

          class DownloadService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  DlNotif.ensureChannel(this)
                  val n = DlNotif.build(this, "Downloading…", -1)
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(DlNotif.ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(DlNotif.ID, n)
                  }
                  return START_NOT_STICKY
              }
          }
