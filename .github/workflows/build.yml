name: Build GreyGecko

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Resolve latest GeckoView
        run: |
          META=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/maven-metadata.xml)
          VER=$(echo "$META" | grep -oP '(?<=<release>)[^<]+' | head -1 || true)
          if [ -z "$VER" ]; then
            VER=$(echo "$META" | grep -oP '(?<=<latest>)[^<]+' | head -1 || true)
          fi
          if [ -z "$VER" ]; then
            echo "Could not resolve GeckoView version"; exit 1
          fi
          echo "GECKO_VERSION=$VER" >> $GITHUB_ENV
          echo "Using GeckoView $VER"

      - name: Test keystore cache
        id: ks
        uses: actions/cache@v4
        with:
          path: keystore
          key: test-keystore-v1

      - name: Create test keystore
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/test.jks -storepass testkey123 \
            -keypass testkey123 -alias test -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Test, O=Test, C=PH"

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/grey/gecko app/src/main/assets/ext app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://maven.mozilla.org/maven2/") }
              }
          }
          rootProject.name = "GreyGecko"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.grey.gecko"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.grey.gecko"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              signingConfigs {
                  create("test") {
                      storeFile = file(System.getenv("KEYSTORE_PATH"))
                      storePassword = "testkey123"
                      keyAlias = "test"
                      keyPassword = "testkey123"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("test")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-Xskip-metadata-version-check"
              }
              buildFeatures { compose = true }
          }

          tasks.configureEach {
              if (name.startsWith("check") && name.endsWith("AarMetadata")) enabled = false
          }

          dependencies {
              implementation("org.mozilla.geckoview:geckoview-arm64-v8a:${System.getenv("GECKO_VERSION")}")
              implementation(platform("androidx.compose:compose-bom:2025.01.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries>
                  <package android:name="idm.internet.download.manager.plus" />
                  <package android:name="idm.internet.download.manager" />
                  <package android:name="idm.internet.download.manager.adm.lite" />
                  <package android:name="com.dv.adm.pay" />
                  <package android:name="com.dv.adm" />
              </queries>
              <application
                  android:label="GreyGecko"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="com.grey.gecko.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/file_paths" />
              </provider>
              <service
                  android:name=".DownloadService"
                  android:exported="false"
                  android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <root-path name="root" path="." />
          </paths>
          EOF

          cat > app/src/main/assets/ext/manifest.json <<'EOF'
          {
            "manifest_version": 2,
            "name": "GreyScripts",
            "version": "4.0",
            "browser_specific_settings": { "gecko": { "id": "scripts@grey.gecko" } },
            "background": { "scripts": ["background.js"] },
            "content_scripts": [
              {
                "matches": ["<all_urls>"],
                "js": ["content.js"],
                "run_at": "document_start"
              }
            ],
            "permissions": ["nativeMessaging", "geckoViewAddons", "tabs", "webRequest", "webRequestBlocking", "<all_urls>"]
          }
          EOF

          cat > app/src/main/assets/ext/content.js <<'EOF'
          browser.runtime.sendMessage({ type: "page", url: location.href }).catch(function (e) {
            console.log("GreyScript content error: " + e);
          });
          (function () {
            var on = false;
            var sel = null;
            var trail = [];
            var box = null;
            var shield = null;
            var previewing = false;
            var savedDisp = "";
            var savedPrio = "";
            var curDesc = "";

            function stableName(s) {
              return !!s && s.length <= 32 && !/\d{3,}/.test(s) && !/^(css|sc|jsx|styled|emotion)-/i.test(s);
            }
            function esc(s) {
              return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
            }
            function describe(el) {
              var s = el.tagName.toLowerCase();
              if (el.id) s += "#" + el.id;
              else if (el.classList && el.classList.length) s += "." + el.classList[0];
              return s.length > 40 ? s.slice(0, 40) : s;
            }
            function seg(el) {
              var tag = el.tagName.toLowerCase();
              if (el.id && stableName(el.id)) return "#" + esc(el.id);
              var s = tag;
              var n = 0;
              if (el.classList) {
                for (var i = 0; i < el.classList.length && n < 2; i++) {
                  if (stableName(el.classList[i])) { s += "." + esc(el.classList[i]); n++; }
                }
              }
              var p = el.parentElement;
              if (p) {
                var same = 0;
                var idx = 0;
                for (var k = 0; k < p.children.length; k++) {
                  var c = p.children[k];
                  if (c.tagName === el.tagName) { same++; if (c === el) idx = same; }
                }
                var cnt = 2;
                try { cnt = p.querySelectorAll(":scope > " + s).length; } catch (e) {}
                if (cnt > 1) s += ":nth-of-type(" + idx + ")";
              }
              return s;
            }
            function cssPath(el) {
              var parts = [];
              var cur = el;
              var depth = 0;
              while (cur && cur.nodeType === 1 && cur !== document.documentElement && depth < 8) {
                var s = seg(cur);
                parts.unshift(s);
                var q = parts.join(" > ");
                try { if (document.querySelectorAll(q).length === 1) return q; } catch (e) {}
                if (s.charAt(0) === "#") break;
                cur = cur.parentElement;
                depth++;
              }
              return parts.join(" > ");
            }
            function sendState(note) {
              browser.runtime.sendMessage({
                type: "pickstate",
                has: !!sel,
                desc: curDesc,
                previewing: previewing,
                note: note || ""
              }).catch(function () {});
            }
            function place() {
              if (!box) return;
              if (!on || !sel || previewing) { box.style.display = "none"; return; }
              var r = sel.getBoundingClientRect();
              box.style.display = "block";
              box.style.left = r.left + "px";
              box.style.top = r.top + "px";
              box.style.width = r.width + "px";
              box.style.height = r.height + "px";
            }
            function setPreview(v) {
              if (!sel) return;
              if (v && !previewing) {
                savedDisp = sel.style.getPropertyValue("display");
                savedPrio = sel.style.getPropertyPriority("display");
                sel.style.setProperty("display", "none", "important");
                previewing = true;
              } else if (!v && previewing) {
                if (savedDisp) sel.style.setProperty("display", savedDisp, savedPrio);
                else sel.style.removeProperty("display");
                previewing = false;
              }
            }
            function refresh() {
              var r = sel.getBoundingClientRect();
              curDesc = describe(sel) + " · " + Math.round(r.width) + "x" + Math.round(r.height);
              place();
              sendState("");
            }
            function select(el) {
              setPreview(false);
              sel = el;
              trail = [];
              refresh();
            }
            function start() {
              if (on) { sendState("Tap an element on the page"); return; }
              on = true;
              box = document.createElement("div");
              box.setAttribute("data-grey-pick", "1");
              box.style.cssText = "position:fixed;z-index:2147483647;pointer-events:none;border:2px solid #ff3b30;background:rgba(255,59,48,.18);box-sizing:border-box;display:none;";
              document.documentElement.appendChild(box);
              shield = document.createElement("style");
              shield.setAttribute("data-grey-pick", "1");
              shield.textContent = "iframe,embed,object,video{pointer-events:none!important}";
              document.documentElement.appendChild(shield);
              sel = null;
              trail = [];
              curDesc = "";
              sendState("Tap an element on the page");
            }
            function stop() {
              setPreview(false);
              on = false;
              sel = null;
              trail = [];
              curDesc = "";
              if (box) { box.remove(); box = null; }
              if (shield) { shield.remove(); shield = null; }
              sendState("");
            }
            function parent() {
              if (!sel) return;
              var p = sel.parentElement;
              if (!p || p === document.documentElement) return;
              setPreview(false);
              trail.push(sel);
              sel = p;
              refresh();
            }
            function child() {
              if (!sel) return;
              var c = trail.length ? trail.pop() : sel.firstElementChild;
              if (!c) return;
              setPreview(false);
              sel = c;
              refresh();
            }
            function hide(page) {
              if (!sel) return;
              if (sel === document.body || sel === document.documentElement) { sendState("Can't hide the whole page"); return; }
              var q = cssPath(sel);
              setPreview(false);
              var st = document.createElement("style");
              st.setAttribute("data-grey-hide", "1");
              st.textContent = q + "{display:none!important}";
              document.documentElement.appendChild(st);
              browser.runtime.sendMessage({ type: "hidesave", host: location.hostname, sel: q, path: page ? location.pathname : "" }).catch(function () {});
              sel = null;
              trail = [];
              curDesc = "";
              place();
              sendState("Hidden. Tap another element or Close.");
            }
            function reset() {
              setPreview(false);
              var st = document.querySelectorAll("style[data-grey-hide]");
              for (var i = 0; i < st.length; i++) st[i].remove();
              browser.runtime.sendMessage({ type: "hidereset", host: location.hostname }).catch(function () {});
              sendState("Hidden elements for this site were cleared.");
            }
            function onClick(e) {
              if (!on) return;
              var t = e.target;
              if (!t || t.nodeType !== 1) return;
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              browser.runtime.sendMessage({ type: "log", msg: "pick click " + describe(t) }).catch(function () {});
              select(t);
            }
            window.addEventListener("click", onClick, true);
            function swallow(e) {
              if (!on) return;
              var t = e.target;
              if (!t || t.nodeType !== 1) return;
              e.stopPropagation();
              e.stopImmediatePropagation();
            }
            ["pointerdown", "pointerup", "mousedown", "mouseup", "touchstart", "touchend"].forEach(function (n) {
              window.addEventListener(n, swallow, true);
            });
            window.addEventListener("scroll", place, true);
            window.addEventListener("resize", place);
            browser.runtime.onMessage.addListener(function (m) {
              if (!m || m.type !== "pick") return;
              if (m.cmd === "start") start();
              else if (m.cmd === "stop") stop();
              else if (m.cmd === "parent") parent();
              else if (m.cmd === "child") child();
              else if (m.cmd === "preview") { if (sel) { setPreview(!previewing); place(); sendState(""); } }
              else if (m.cmd === "hide") hide(!!m.page);
              else if (m.cmd === "reset") reset();
            });
          })();
          (function () {
            var seen = Object.create(null);
            var scans = 0;
            var timer = null;
            var MEDIA = /\.(mp4|m4v|webm|mkv|mov|flv|m3u8|mpd|mp3|m4a)(\?|#|$)/i;
            function abs(u) {
              try { return new URL(u, location.href).href; } catch (e) { return ""; }
            }
            function collect() {
              timer = null;
              if (scans > 10) return;
              scans++;
              var out = [];
              function add(u, strict) {
                if (!u) return;
                u = abs(u);
                if (!u || !/^https?:/i.test(u) || seen[u]) return;
                if (strict && !MEDIA.test(u)) return;
                seen[u] = 1;
                out.push(u);
              }
              var els = document.querySelectorAll("video, audio");
              for (var i = 0; i < els.length; i++) {
                add(els[i].currentSrc, false);
                add(els[i].getAttribute("src"), false);
                var ss = els[i].querySelectorAll("source[src]");
                for (var j = 0; j < ss.length; j++) add(ss[j].getAttribute("src"), false);
              }
              var ms = document.querySelectorAll('meta[property="og:video"],meta[property="og:video:url"],meta[property="og:video:secure_url"],meta[name="twitter:player:stream"]');
              for (var k = 0; k < ms.length; k++) add(ms[k].getAttribute("content"), true);
              if (out.length) browser.runtime.sendMessage({ type: "dommedia", page: location.href, urls: out }).catch(function () {});
            }
            function later() { if (!timer) timer = setTimeout(collect, 1200); }
            document.addEventListener("DOMContentLoaded", later);
            window.addEventListener("load", later);
            try { new MutationObserver(later).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) {}
          })();
          (function () {
            var muteAll = false;
            function apply(el) {
              if (muteAll) {
                if (!el.hasAttribute("data-grey-m")) el.setAttribute("data-grey-m", el.muted ? "1" : "0");
                el.muted = true;
              } else if (el.hasAttribute("data-grey-m")) {
                el.muted = el.getAttribute("data-grey-m") === "1";
                el.removeAttribute("data-grey-m");
              }
            }
            function all() {
              var els = document.querySelectorAll("video, audio");
              for (var i = 0; i < els.length; i++) apply(els[i]);
            }
            function setMute(v) { muteAll = v; all(); }
            document.addEventListener("play", function (e) { if (muteAll && e.target && e.target.muted === false) e.target.muted = true; }, true);
            document.addEventListener("volumechange", function (e) { if (muteAll && e.target && e.target.muted === false) e.target.muted = true; }, true);
            try { new MutationObserver(function () { if (muteAll) all(); }).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) {}
            browser.runtime.onMessage.addListener(function (m) {
              if (m && m.type === "pick" && m.cmd === "mute") setMute(!!m.on);
            });
          })();
          EOF

          cat > app/src/main/assets/ext/background.js <<'EOF'
          var APP = "browser";
          var libCache = {};
          var grabberOn = true;
          var lastCfg = 0;
          var reqHdr = {};

          function nlog(m) {
            try { browser.runtime.sendNativeMessage(APP, { type: "log", msg: String(m) }); } catch (e) {}
          }

          function native(o) {
            return browser.runtime.sendNativeMessage(APP, o).then(function (raw) {
              if (typeof raw === "string") {
                try { return JSON.parse(raw); } catch (e) { return {}; }
              }
              return raw || {};
            });
          }

          function gmFactory(sid, vals, info) {
            function send(m) {
              try { return browser.runtime.sendMessage(m); } catch (e) { return Promise.resolve(); }
            }
            function log() {
              var a = [];
              for (var i = 0; i < arguments.length; i++) {
                var x = arguments[i];
                try { a.push(typeof x === "string" ? x : JSON.stringify(x)); } catch (e) { a.push(String(x)); }
              }
              send({ type: "log", msg: "[" + info.script.name + "] " + a.join(" ") });
            }
            function addStyle(css) {
              var s = document.createElement("style");
              s.textContent = css;
              (document.head || document.documentElement).appendChild(s);
              return s;
            }
            function getValue(k, d) {
              return Object.prototype.hasOwnProperty.call(vals, k) ? vals[k] : d;
            }
            function setValue(k, v) {
              var j;
              try { j = JSON.stringify(v); } catch (e) { j = undefined; }
              if (j === undefined) {
                delete vals[k];
                send({ type: "deleteValue", sid: sid, key: k });
              } else {
                vals[k] = v;
                send({ type: "setValue", sid: sid, key: k, value: j });
              }
            }
            function deleteValue(k) {
              delete vals[k];
              send({ type: "deleteValue", sid: sid, key: k });
            }
            function listValues() { return Object.keys(vals); }
            function xhr(d) {
              var aborted = false;
              var det = {
                url: d.url,
                method: d.method,
                headers: d.headers,
                data: d.data == null ? null : (typeof d.data === "string" ? d.data : String(d.data)),
                timeout: d.timeout
              };
              send({ type: "xhr", details: det }).then(function (r) {
                if (aborted) return;
                if (!r || !r.ok) {
                  var er = { error: (r && r.error) || "request failed", status: 0 };
                  if (r && r.timeout) { if (d.ontimeout) d.ontimeout(er); }
                  else if (d.onerror) { d.onerror(er); }
                  if (d.onloadend) d.onloadend(er);
                  return;
                }
                var bin = atob(r.b64);
                var bytes = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                var text = new TextDecoder("utf-8").decode(bytes);
                var rt = d.responseType || "text";
                var resp;
                if (rt === "arraybuffer") resp = bytes.buffer;
                else if (rt === "blob") resp = new Blob([bytes]);
                else if (rt === "json") { try { resp = JSON.parse(text); } catch (e) { resp = null; } }
                else resp = text;
                var res = {
                  status: r.status,
                  statusText: r.statusText,
                  finalUrl: r.finalUrl,
                  responseHeaders: r.responseHeaders,
                  response: resp,
                  responseText: (rt === "arraybuffer" || rt === "blob") ? "" : text,
                  readyState: 4,
                  context: d.context
                };
                if (d.onload) d.onload(res);
                if (d.onloadend) d.onloadend(res);
              }).catch(function (e) { log("xhr handler error: " + e); });
              return { abort: function () { aborted = true; if (d.onabort) d.onabort({}); } };
            }
            function xhrP(d) {
              return new Promise(function (resolve, reject) {
                var o = {};
                for (var k in d) o[k] = d[k];
                o.onload = function (r) { resolve(r); };
                o.onerror = function (e) { reject(e); };
                o.ontimeout = function (e) { reject(e); };
                xhr(o);
              });
            }
            function setClipboard(t) {
              t = String(t);
              function fb() {
                var ta = document.createElement("textarea");
                ta.value = t;
                ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
                (document.body || document.documentElement).appendChild(ta);
                ta.select();
                try { document.execCommand("copy"); } catch (e) {}
                ta.remove();
              }
              try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(t).catch(fb);
                } else {
                  fb();
                }
              } catch (e) { fb(); }
            }
            function openInTab(u) {
              try { window.open(u, "_blank"); } catch (e) { log("openInTab failed: " + e); }
            }
            function unsupported(n) {
              return function () { log(n + " is not supported"); };
            }
            var GM = {
              info: info,
              log: log,
              addStyle: function (c) { return Promise.resolve(addStyle(c)); },
              getValue: function (k, d) { return Promise.resolve(getValue(k, d)); },
              setValue: function (k, v) { setValue(k, v); return Promise.resolve(); },
              deleteValue: function (k) { deleteValue(k); return Promise.resolve(); },
              listValues: function () { return Promise.resolve(listValues()); },
              xmlHttpRequest: xhrP,
              setClipboard: function (t) { setClipboard(t); return Promise.resolve(); },
              openInTab: function (u) { openInTab(u); return Promise.resolve(); }
            };
            return {
              GM_info: info,
              GM_log: log,
              GM_addStyle: addStyle,
              GM_getValue: getValue,
              GM_setValue: setValue,
              GM_deleteValue: deleteValue,
              GM_listValues: listValues,
              GM_xmlhttpRequest: xhr,
              GM_setClipboard: setClipboard,
              GM_openInTab: openInTab,
              GM_registerMenuCommand: unsupported("GM_registerMenuCommand"),
              GM_notification: unsupported("GM_notification"),
              GM_download: unsupported("GM_download"),
              GM: GM,
              unsafeWindow: window.wrappedJSObject || window
            };
          }

          function bufToB64(buf) {
            var b = new Uint8Array(buf);
            var s = "";
            var chunk = 0x8000;
            for (var i = 0; i < b.length; i += chunk) {
              s += String.fromCharCode.apply(null, b.subarray(i, i + chunk));
            }
            return btoa(s);
          }

