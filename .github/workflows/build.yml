          @Composable
          fun ImportDialog(onDismiss: () -> Unit, onImported: (String) -> Unit) {
              val scope = rememberCoroutineScope()
              var url by remember { mutableStateOf("") }
              var err by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              AlertDialog(
                  onDismissRequest = { if (!busy) onDismiss() },
                  containerColor = Bar,
                  title = { Text("Import from URL", color = Color.White) },
                  text = {
                      Column {
                          OutlinedTextField(
                              value = url,
                              onValueChange = { url = it; err = "" },
                              singleLine = true,
                              colors = fieldColors(),
                              placeholder = { Text("https://site.com/script.user.js", color = Color(0xFF999999)) }
                          )
                          if (err.isNotBlank()) {
                              Text(err, color = Danger, fontSize = 12.sp, modifier = Modifier.padding(top = 6.dp))
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          val u = url.trim()
                          if (u.isNotEmpty() && !busy) {
                              busy = true
                              err = "Downloading…"
                              scope.launch {
                                  val r = withContext(Dispatchers.IO) {
                                      try { httpGet(u) } catch (e: Exception) { "ERR:" + e.message }
                                  }
                                  if (r.startsWith("ERR:")) {
                                      err = r.substring(4)
                                      busy = false
                                  } else if (!r.contains("==UserScript==")) {
                                      err = "No ==UserScript== header found"
                                      busy = false
                                  } else {
                                      val l = Store.load()
                                      l.add(Script(Store.newId(), r, true, u, ""))
                                      Store.save(l)
                                      busy = false
                                      onImported(parseMeta(r).name)
                                  }
                              }
                          }
                      }) { Text("Import", color = Color.White) }
                  },
                  dismissButton = {
                      TextButton(onClick = { if (!busy) onDismiss() }) { Text("Cancel", color = Color.White) }
                  }
              )
          }

