          class TabGroup(val key: String, val label: String, val tabs: List<BrowserTab>)

          fun keyOfUrl(u: String): String {
              if (u.isBlank() || u.startsWith("about:")) return "newtab"
              val h = try { android.net.Uri.parse(u).host ?: "" } catch (e: Exception) { "" }
              val d = h.removePrefix("www.")
              return if (d.isBlank()) "other" else d
          }

          fun groupKeyOf(t: BrowserTab?): String = keyOfUrl(t?.url ?: "")

          fun groupTabs(all: List<BrowserTab>): List<TabGroup> {
              val order = ArrayList<String>()
              val map = HashMap<String, MutableList<BrowserTab>>()
              for (t in all) {
                  val k = groupKeyOf(t)
                  val l = map.getOrPut(k) {
                      order.add(k)
                      mutableListOf()
                  }
                  l.add(t)
              }
              return order.map { k ->
                  TabGroup(k, if (k == "newtab") "New tab" else k, map[k] ?: mutableListOf())
              }
          }

          fun groupColor(key: String): Color =
              GroupPalette[(key.hashCode() and 0x7fffffff) % GroupPalette.size]

          fun groupLetter(key: String): String =
              if (key == "newtab") "+" else key.take(1).uppercase()

